<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 754" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Layer 的 Attention 与 FFN 双子层图解</title>
  <desc id="desc">输入依次经过归一化、Attention、残差相加、归一化、FFN 和第二次残差相加。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#4d79a8" stroke-width="1.3"/></marker>
    <pattern id="matrix" width="15" height="15" patternUnits="userSpaceOnUse"><rect width="12" height="12" rx="1" fill="#7298bf" opacity=".58"/></pattern>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#242a31;font-size:18px}.small{font-size:14px;fill:#68717c}.blue{fill:#315f8c}.frame{fill:#f5f7f9;stroke:#d9dee5}.op{fill:#fff;stroke:#aeb7c2}.wire{fill:none;stroke:#4d79a8;stroke-width:2;marker-end:url(#arrow)}.tensor{fill:url(#matrix);stroke:#7298bf;stroke-opacity:.8}
    </style>
  </defs>
  <rect width="720" height="754" rx="24" fill="#fff"/>
  <rect class="frame" x="64" y="101" width="588" height="249" rx="9"/><text class="small" x="80" y="129">01 Attention 子层</text>
  <rect class="frame" x="64" y="418" width="588" height="243" rx="9"/><text class="small" x="80" y="446">02 FFN 子层</text>
  <rect class="tensor" x="275" y="29" width="166" height="46"/><text class="blue" x="475" y="60">X · T × H</text>
  <path class="wire" d="M358 77V118"/><rect class="op" x="230" y="126" width="256" height="36" rx="7"/><text x="358" y="150" text-anchor="middle">Norm 1</text>
  <path class="wire" d="M358 164V181"/><rect class="op" x="230" y="189" width="256" height="36" rx="7"/><text x="358" y="213" text-anchor="middle">Attention</text>
  <path class="wire" d="M358 227V245"/><rect class="tensor" x="295" y="248" width="126" height="36"/><path class="wire" d="M358 284V302"/>
  <circle cx="358" cy="323" r="19" fill="#fff" stroke="#66717d" stroke-width="1.6"/><text x="358" y="330" text-anchor="middle">＋</text>
  <path class="wire" d="M275 50H152V323H337"/><text class="blue" x="142" y="198" text-anchor="end">X</text>
  <path class="wire" d="M358 344V356"/><rect class="tensor" x="275" y="362" width="166" height="46"/><text class="blue" x="475" y="387">Y = X + R_Attn</text>
  <path class="wire" d="M358 409V428"/><rect class="op" x="230" y="436" width="256" height="36" rx="7"/><text x="358" y="460" text-anchor="middle">Norm 2</text>
  <path class="wire" d="M358 474V491"/><rect class="op" x="230" y="499" width="256" height="36" rx="7"/><text x="358" y="523" text-anchor="middle">FFN</text>
  <path class="wire" d="M358 537V553"/><rect class="tensor" x="295" y="557" width="126" height="36"/><path class="wire" d="M358 593V611"/>
  <circle cx="358" cy="632" r="19" fill="#fff" stroke="#66717d" stroke-width="1.6"/><text x="358" y="639" text-anchor="middle">＋</text>
  <path class="wire" d="M275 384H152V632H337"/><text class="blue" x="142" y="520" text-anchor="end">Y</text>
  <path class="wire" d="M358 653V675"/><rect class="tensor" x="275" y="681" width="166" height="46"/><text class="blue" x="475" y="710">Z = Y + R_FFN</text>
</svg>
