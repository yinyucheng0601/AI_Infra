<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 136 41"><style>
svg{color-scheme:dark;--bg:#fafafa;--fg:#282828;--muted:#454545;--blue:#8cbdff;--gold:#BCA0F3;--green:#79D4F2;--line:#eeeeee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,select,input{font:inherit;color:inherit}button,select{background:#f5f5f5;border:1px solid #e4e4e4;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:#454545}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid #2d2d2d;outline-offset:3px}button.active{border-color:#5e5e5e;color:var(--blue);background:#202832}a{color:#b8cce4;text-underline-offset:4px}main{max-width:1700px;margin:auto;padding:32px 3vw 0;min-height:100svh;display:flex;flex-direction:column}.heading{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font:12px/1.5 ui-monospace,monospace;letter-spacing:2px;color:var(--blue);margin-bottom:10px}h1{font-size:clamp(26px,2.5vw,38px);font-weight:500;margin:0;line-height:1.4}.sub{font-size:15px;color:var(--muted);line-height:1.75;margin:8px 0 0}.counter{font:48px ui-monospace,monospace;color:#5e5e5e}.workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(350px,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;min-height:620px}.visual{background:#f9f9f9;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.canvas{height:540px;flex:1;min-height:430px;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;padding:45px 14px 12px}.canvas svg{display:block;width:100%;height:100%;min-height:0;min-width:0;flex:none;overflow:hidden}.canvas.zoomed{cursor:grab}.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 22px;min-height:60px}.controls label{font-size:13px;color:#3d3d3d}.controls button,.controls select{font-size:13px}.controls input{accent-color:var(--blue);width:180px}.zoom{display:flex;gap:4px;padding:0 18px 10px;justify-content:flex-end}.zoom button{font-size:12px;padding:5px 10px;background:transparent}.info-wrap{position:absolute;right:16px;top:16px;z-index:3}.info{border-radius:50%;padding:0;width:28px;height:28px;font:italic 18px Georgia}.info-panel{position:absolute;right:0;top:38px;width:300px;border:1px solid #e4e4e4;border-radius:8px;padding:20px;background:#f5f5f5;box-shadow:0 12px 40px #0009;font-size:13px;line-height:1.85}.info-panel p{margin:9px 0}.explanation{padding:28px 30px;background:#f8f8f8;border-left:1px solid var(--line);display:flex;flex-direction:column}.section-label{font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--muted);margin-bottom:16px}h2{font-size:23px;line-height:1.5;font-weight:550;margin:0 0 18px}.copy p{font-size:16px;line-height:1.9;color:#373737;margin:0 0 18px}strong{color:#252525;font-weight:550}.formula{background:#1c222a;border-left:2px solid #e4e4e4;padding:13px 15px;font:14px/1.9 ui-monospace,monospace;color:#c1d9f8;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 22px}.inspector{border-top:1px solid var(--line);margin-top:auto;padding-top:18px}.inspector h3{font-size:16px;font-weight:550;margin:8px 0}.inspector p{font-size:14px;color:var(--muted);line-height:1.8;margin:0}.source{font-size:12px;line-height:1.9;color:#454545;margin-top:18px}.bottom{position:sticky;bottom:0;z-index:5;background:#111f;display:flex;gap:16px;align-items:center;padding:18px 0;margin-top:12px}.steps{display:flex;flex:1;min-width:0;overflow:auto;gap:9px;scrollbar-width:thin}.steps button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid #ececec;border-radius:0;white-space:nowrap;font-size:12px;padding:9px 8px;min-width:70px;color:#454545}.steps button.active{border-color:#5e5e5e;color:var(--blue)}.bottom>button{white-space:nowrap;font-size:13px}.cover{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:50px;min-height:calc(100svh - 125px);padding:30px 3vw 55px}.cover h1{font-size:clamp(42px,5vw,72px);line-height:1.3;letter-spacing:-1px;margin:20px 0 25px}.cover p{font-size:18px;color:#3c3c3c;line-height:1.9;max-width:540px}.cover-note{font-size:13px;color:#454545;line-height:2;margin-top:35px}.cover-visual{height:540px;border-left:1px solid #efefef;padding-left:24px}.cover-visual svg{width:100%;height:100%}svg text{font-family:inherit;fill:#282828;font-size:18px}svg .small{font-size:14px;fill:#454545}svg .tiny{font-size:12px;fill:#454545}svg .op{fill:#e5e5e5;stroke:#575757;stroke-width:1.5}svg .op-label{font-size:18px;font-weight:650;fill:#1d1d1d;dominant-baseline:middle}svg .hit{cursor:pointer}svg .hit:hover>.outline,svg .hit.selected>.outline,svg .hit:focus>.outline{stroke:#1d1d1d;stroke-width:2.5}svg .comm{stroke:#1d1d1d;stroke-width:2;stroke-dasharray:6 5;fill:none}svg .rank-outline{stroke:#2d2d2d;stroke-width:1.8}svg .rank-pin{stroke:none!important}svg .container{fill:#f7f7f7;stroke:#e4e4e4;stroke-width:1.2}svg .container{fill:#f8f8f8;stroke-dasharray:3 4}svg .wire{fill:none;stroke-width:2}svg .grid-cell{shape-rendering:geometricPrecision}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(min-width:1000px){body.overview{overflow:hidden}.overview main{height:100svh;min-height:0}.overview .workspace{min-height:0;height:0}.overview .canvas{height:0;min-height:0}.overview .explanation{overflow-y:auto}.overview .heading,.overview .bottom{flex-shrink:0}}@media(max-width:1000px){main{padding:24px 20px 0}.workspace{grid-template-columns:minmax(0,1.3fr) minmax(310px,1fr)}.explanation{padding:24px}.cover{gap:22px;padding:20px}.cover h1{font-size:48px}}@media(max-width:760px){main{padding:22px 14px 0}.workspace{grid-template-columns:1fr;min-height:0}.canvas{height:440px;min-height:0;flex:none;padding-top:48px}.explanation{border-left:0;border-top:1px solid #eeeeee;padding:24px}.cover{grid-template-columns:1fr;min-height:0;padding:25px 12px;gap:15px}.cover-visual{height:340px;border-left:0;border-top:1px solid #efefef;padding:15px 0 0}.cover h1{font-size:43px}.cover p{font-size:16px}.counter{font-size:34px}.bottom{gap:7px;padding:12px 0}.bottom>button{font-size:12px;padding:8px}.info-panel{width:min(300px,calc(100vw - 66px))}.controls{padding:8px 12px 18px}.copy p{font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

svg{--tensor-w:#BCA0F3;--tensor-i:#B1EF6B;--tensor-a:#F2C45F;--tensor-grad:#79D4F2}
svg .blue{fill:var(--tensor-i)}
.legend-rank,.legend-container,.legend-hardware{display:inline-block;width:24px;height:15px;margin-right:6px;vertical-align:middle;background:#f7f7f7;border:1px solid #5e5e5e;border-radius:4px}.legend-rank{position:relative;background:#ededed;border-radius:5px;border-color:#2d2d2d}.legend-rank:before,.legend-rank:after,.legend-rank b:before,.legend-rank b:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#f4f4f4;top:2px;left:2px}.legend-rank:after{left:auto;right:2px}.legend-rank b:before{top:auto;bottom:2px}.legend-rank b:after{top:auto;bottom:2px;left:auto;right:2px}.legend-container{border-style:dashed;background:#f8f8f8}.legend-hardware{border-radius:1px;background:#f3f3f3}.figure-caption{margin:0 20px 8px;font-size:14px;line-height:1.7;color:#3d3d3d}.semantic-legend{display:grid;gap:9px;font-size:12px;line-height:1.7;margin:12px 0}
