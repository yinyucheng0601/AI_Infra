<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 176 82"><style>
svg{color-scheme:dark;--bg:#fafafa;--panel:#f8f8f8;--line:#eeeeee;--text:#282828;--muted:#454545;--i:#B1EF6B;--w:#BCA0F3;--a:#F2C45F;--g:#79D4F2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",system-ui,sans-serif}button{font:inherit;color:inherit;background:transparent;border:1px solid #e9e9e9;border-radius:5px;cursor:pointer;padding:8px 12px}button:hover{background:#f2f2f2}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #2d2d2d;outline-offset:4px}button:disabled{opacity:.3;cursor:default}[hidden]{display:none!important}a{color:#b7cce0;text-underline-offset:4px}main{width:100%;max-width:none;margin:0;padding:28px clamp(20px,2vw,48px) 0;min-height:100svh;display:flex;flex-direction:column}.heading{display:flex;gap:20px;align-items:start;margin-bottom:22px}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:#454545;margin-bottom:12px}h1{font-size:clamp(26px,2.6vw,40px);font-weight:450;line-height:1.35;margin:0}.subtitle{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.7}.number{font:44px ui-monospace,monospace;color:#e4e4e4;margin-left:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,28vw,440px);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:580px}.visual{background:#f9f9f9;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}.canvas{position:relative;height:520px;min-height:0;overflow:hidden;touch-action:none;flex:1}.canvas svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}.canvas.dragging{cursor:grabbing}.toolbar{display:flex;gap:7px;align-items:center;justify-content:center;padding:12px 14px;border-top:1px solid #f2f2f2;flex-wrap:wrap}.toolbar button{font-size:13px}.toolbar output{font:12px ui-monospace,monospace;min-width:45px;text-align:center}.toolbar .mode{margin-right:auto;display:flex;gap:4px}.mode button.active{background:#2c2c2c;color:#fafafa;border-color:#2c2c2c}.info{position:absolute;top:14px;right:14px;z-index:4}.info>button{border-radius:50%;width:28px;height:28px;padding:0;font:italic 18px Georgia;background:#f7f7f7}.info-panel{position:absolute;right:0;top:39px;width:min(330px,75vw);padding:20px;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:8px;box-shadow:0 14px 45px #0008;font-size:13px;line-height:1.85}.info-panel p{margin:10px 0}.explanation{border-left:1px solid var(--line);padding:28px;background:var(--panel);display:flex;flex-direction:column;min-width:0}.label{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:#454545;margin-bottom:15px}.explanation h2{font-size:23px;line-height:1.5;font-weight:500;margin:0 0 16px}.copy p{font-size:16px;line-height:1.85;color:#383838;margin:0 0 17px}.copy strong{color:#252525;font-weight:550}.formula{background:#f5f5f5;border-radius:5px;padding:13px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.85 ui-monospace,monospace;margin:0 0 20px;color:#2d2d2d}.inspector{margin-top:auto;border-top:1px solid var(--line);padding-top:17px}.inspector h3{font-size:16px;font-weight:500;margin:8px 0}.inspector p{font-size:14px;line-height:1.8;color:#454545;margin:0}.sources{font-size:12px;line-height:1.8;color:#4e4e4e;margin-top:18px}.sources summary{cursor:pointer}.sources ul{padding-left:18px}.bottom{position:sticky;bottom:0;z-index:6;background:#fafafa;display:flex;align-items:center;gap:18px;padding:18px 0;margin-top:auto}.steps{display:flex;overflow:auto;gap:8px;flex:1;scrollbar-width:thin}.steps button{min-width:70px;flex:1 0 70px;border:0;border-bottom:2px solid #efefef;border-radius:0;padding:8px 2px 12px;font-size:12px;line-height:1.7;color:#4e4e4e;white-space:nowrap}.steps button[aria-current=step]{color:#252525;border-color:#2d2d2d}.steps span{display:block;font:10px ui-monospace,monospace;color:#5e5e5e;margin-bottom:5px}.bottom>button{white-space:nowrap;font-size:13px}.next{background:#282828;color:#fafafa}.next:hover{background:#1d1d1d}.cover{display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:55px;min-height:calc(100svh - 115px);padding:25px 3vw}.cover h1{font-size:clamp(34px,3.6vw,56px);letter-spacing:-1px;line-height:1.35}.cover p{font-size:17px;line-height:1.9;color:#3d3d3d;max-width:490px}.cover .meta{font-size:12px;line-height:2;color:#4e4e4e;margin-top:30px}.cover svg{width:100%;height:500px}.badge{display:inline-block;font:11px ui-monospace,monospace;border:1px solid #e9e9e9;padding:6px 10px;margin-bottom:25px;letter-spacing:1px}.cover button{margin-top:20px}svg text{font-family:Inter,"PingFang SC",system-ui,sans-serif;fill:#282828;font-size:18px}svg .small{font-size:14px;fill:#454545}svg .tiny{font-size:12px;fill:#454545}svg .op-label{font-size:18px;font-weight:650;fill:#1d1d1d;dominant-baseline:middle}svg .hit{cursor:pointer}svg .hit .outline{transition:stroke .12s}svg .hit:hover .outline,svg .hit.selected .outline,svg .hit:focus .outline{stroke:#1d1d1d;stroke-width:2.5}svg .hit.selected text{fill:#1d1d1d}svg .hit:focus{outline:none}svg .data-label{paint-order:stroke;stroke:#f9f9f9;stroke-width:2.5px;stroke-linejoin:round}svg .grid-label{font-size:14px;fill:var(--tensor-color);font-weight:400}svg .grid-detail{font-size:12px;fill:var(--tensor-color);font-weight:400}svg .hit.selected .data-label text{fill:var(--tensor-color)}svg .edge-label{font-size:12px;fill:#353535;paint-order:stroke;stroke:#f9f9f9;stroke-width:5px}svg .soft{opacity:.24}svg .hit.selected{opacity:1}.noscript{padding:35px;line-height:1.8}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1000px){body:not(.cover-mode) main{height:100svh;min-height:0}.heading,.bottom{flex-shrink:0}.workspace{flex:1;min-height:0}.canvas{height:0;min-height:320px}.explanation{overflow:auto;scrollbar-width:thin}.bottom{position:static}}
@media(max-width:999px){main{padding:25px 20px 0}.workspace{grid-template-columns:1.3fr 1fr}.explanation{padding:22px}.canvas{height:570px}.cover{gap:25px;padding:20px 0}.cover h1{font-size:45px}}
@media(max-width:760px){main{padding:22px 14px 0}.heading{margin-bottom:18px}.number{font-size:28px}.workspace{grid-template-columns:1fr}.canvas{height:440px;flex:none}.explanation{border-left:0;border-top:1px solid var(--line);padding:24px}.cover{grid-template-columns:1fr;gap:12px;min-height:0;padding:20px 10px}.cover h1{font-size:42px}.cover svg{height:340px}.cover .meta{margin-top:15px}.bottom{gap:8px;padding:12px 0}.bottom>button{font-size:12px;padding:8px}.toolbar{gap:4px}.toolbar .mode{width:100%;justify-content:center;margin:0 0 5px}.steps button{min-width:62px;flex-basis:62px}.subtitle{font-size:13px}}

/* Auxiliary colors identify object families; tensor colors retain data semantics. */
svg .hit[data-key="callable"]{--object-color:#8EAED0}
svg .hit[data-key="task"]{--object-color:#cbbcf4}
svg .hit[data-key="loop"]{--object-color:#cbbcf4}
svg .hit[data-key="loop"]>path{stroke:#cbbcf4}
svg .hit[data-key="loop"]>text{fill:#cbbcf4}
svg .hit[data-key="buffer"],svg .hit[data-key="address"]{--object-color:#C7AD88}
svg .hit[data-key="pass"],svg .hit[data-key="snapshot"]{--object-color:#454545}
svg .hit[data-key="callable"]>.outline,svg .hit[data-key="loop"]>.outline,svg .hit[data-key="task"]>.outline,svg .hit[data-key="buffer"]>.outline,svg .hit[data-key="address"]>.outline,svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{stroke:var(--object-color);stroke-width:1.3}
svg .hit[data-key="callable"]>text,svg .hit[data-key="loop"]>text,svg .hit[data-key="task"]>text,svg .hit[data-key="buffer"]>text,svg .hit[data-key="address"]>text,svg .hit[data-key="pass"]>text,svg .hit[data-key="snapshot"]>text{fill:var(--object-color)}
svg .hit[data-key="task"]>.outline{fill:#211C3C}
svg .hit[data-key="buffer"]>.outline{fill:#25221D}
svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{fill:#f5f5f5}
svg .hit[data-key="callable"]>path{stroke:#8EAED0;stroke-opacity:.3}
svg .hit[data-key="buffer"]>path{stroke:#C7AD88;stroke-opacity:.45}
svg .hit[data-key="address"]>rect{fill:#C7AD88;fill-opacity:.17;stroke:#C7AD88;stroke-width:1.2}
svg .hit:hover>.outline,svg .hit.selected>.outline,svg .hit:focus>.outline{stroke-width:2;stroke:var(--object-color,#1d1d1d)}
svg .symbol .outline{stroke:#B9C2CD;stroke-width:1.5;fill:#1A1E23}
svg .symbol.selected .outline,svg .symbol:hover .outline,svg .symbol:focus .outline{stroke:#1d1d1d;stroke-width:2}
svg .hit[data-key="kernel"]{--object-color:#cbbcf4}svg .hit[data-key="kernel"]>text{fill:#CEC4F9}svg .hit[data-key="op"]{--object-color:#cbbcf4}
svg .cell-title{font-size:16px;font-weight:600;fill:#252525}

/* Current runtime glyphs and shared function-scope container. */
svg .hit[data-key="task"],svg .hit[data-key="instruction"]{--object-color:#9EF04B}
svg .hit[data-key="task"]>.outline,svg .hit[data-key="instruction"]>.outline{fill:#9EF04B;stroke:none}
svg .hit[data-key="task"]>text,svg .hit[data-key="instruction"]>text{fill:#080b05}
svg .hit[data-key="callable"],svg .hit[data-key="kernel"]{--object-color:#252525}
svg .hit[data-key="callable"]>rect.outline,svg .hit[data-key="kernel"]>rect.outline{rx:18px;fill:#1d1d1d;fill-opacity:.1;stroke:none}
svg .hit[data-key="callable"]>path{display:none}
svg .hit[data-key="callable"]>text,svg .hit[data-key="kernel"]>text{fill:#252525}
svg .hit:is([data-key="task"],[data-key="instruction"],[data-key="callable"],[data-key="kernel"]):is(:hover,:focus,.selected)>.outline{stroke:var(--object-color);stroke-width:2}
</style><g class="hit" tabindex="0" role="button" aria-label="阶段 IR · 程序结构" data-key="snapshot" data-layer="program"><path class="outline" d="M0 3 V65 M162 3 V65" fill="none" stroke="#454545"/><text x="81" y="-10" class="small" text-anchor="middle">IR</text><path d="M47 17 H66 V33 H80 M47 49 H66 V33 M130 33 H151" fill="none" stroke="#454545" stroke-width="1.3"/><path d="M76 30 L80 33 L76 36 M147 30 L151 33 L147 36" fill="none" stroke="#454545"/><rect data-ir-kind="tensor" x="10" y="7" width="37" height="20" rx="4" fill="#f3f3f3" stroke="#454545" stroke-width="1.1"/><text x="28.5" y="21" class="tiny" text-anchor="middle">X</text><rect data-ir-kind="tensor" x="10" y="39" width="37" height="20" rx="4" fill="#f3f3f3" stroke="#454545" stroke-width="1.1"/><text x="28.5" y="53" class="tiny" text-anchor="middle">W</text><rect data-ir-kind="op" x="80" y="23" width="50" height="20" rx="10" fill="#cbbcf4" stroke="#cbbcf4" stroke-width="1.1"/><text x="105" y="37" class="tiny" text-anchor="middle">op</text></g><style>[data-tensor] text,.gl-onrole,.gl-onrole-strong{fill:#080808!important}.slot-title{fill:#111!important}.slot-capacity{fill:#292929!important}</style><style>.data-label{paint-order:normal!important;stroke:none!important}.data-label text,.grid-label,.grid-detail,.tensor-label,[data-tensor] text{fill:#233516!important;stroke:none!important}</style><style id="knowledge-presentation">svg .op,svg rect.op{stroke:none!important;stroke-width:0!important}text.blue,text.gold,text.purple,.grid-label,.grid-detail,.tensor-label,.data-label text,.data-label,[data-tensor] text{fill:#253344!important;stroke:none!important;paint-order:normal!important}</style></svg>