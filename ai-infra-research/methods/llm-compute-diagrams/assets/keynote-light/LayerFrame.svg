<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 516 151"><style>
svg{--bg:#fafafa;--panel:#f8f8f8;--text:#282828;--muted:#454545;--blue:#8cbdff;--gold:#BCA0F3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,select,input{font:inherit}button{color:inherit;background:#f4f4f4;border:1px solid #e4e4e4;border-radius:5px;cursor:pointer;padding:8px 12px}button:hover{border-color:#252525}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}main{height:100svh;min-height:680px;display:flex;flex-direction:column;padding:28px 3vw 0}.heading{display:flex;align-items:center;justify-content:space-between;min-height:105px;padding-bottom:20px}.kicker{font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}h1{font-size:clamp(24px,2.5vw,38px);font-weight:500;margin:10px 0 0}#count{font:40px ui-monospace,monospace;color:#5e5e5e}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,1fr);flex:1;min-height:0;gap:2px}.visual{position:relative;background:#f9f9f9;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:8px}#canvas{flex:1;min-height:0;touch-action:none;cursor:grab}svg{width:100%;height:100%;display:block}svg text{font-family:inherit;fill:#282828;font-size:16px}svg .hit{cursor:pointer}svg .hit:hover>rect,svg .hit.selected>rect,svg .hit:hover>circle,svg .hit.selected>circle{stroke:#1d1d1d;stroke-width:2.3}.op{fill:#e5e5e5;stroke:#575757;stroke-width:1.5}.op-label{font-size:18px;font-weight:650;fill:#242424;dominant-baseline:middle}.small{font-size:14px;fill:#454545}aside{background:#f8f8f8;border-radius:8px;padding:28px 30px;overflow:auto}aside h2{font-size:23px;font-weight:500;line-height:1.5;margin:12px 0 18px}aside p{font-size:16px;line-height:1.85;color:#373737;margin:0 0 17px}.formula{padding:13px 16px;background:#f4f4f4;border-left:2px solid var(--blue);font:14px/1.8 ui-monospace,monospace;white-space:pre-line;margin:20px 0;color:#c9deff}#inspector{border-top:1px solid #ececec;margin-top:23px;padding-top:18px}#inspector h3{font-size:16px;font-weight:550;margin:10px 0}#inspector p{font-size:14px;color:#454545}.source{font-size:12px;line-height:1.8;color:#454545;margin-top:20px}.source a{color:#393939}.toolbar{position:absolute;top:13px;left:13px;display:flex;gap:5px;z-index:2}.toolbar button{background:#191919e8;font-size:12px;padding:6px 10px}.info-toggle{position:absolute;right:16px;top:14px;border-radius:50%;width:28px;height:28px;padding:0;font:italic 18px Georgia;z-index:4}.info{position:absolute;right:15px;top:52px;max-width:355px;width:calc(100% - 30px);padding:22px;background:#f3f3f3;border:1px solid #e4e4e4;border-radius:8px;z-index:5;font-size:13px;line-height:1.85;box-shadow:0 12px 40px #0008}.info svg{height:120px}.controls{display:flex;justify-content:center;align-items:center;gap:8px;min-height:53px;flex-wrap:wrap;padding:10px;font-size:13px}.controls:empty{display:none}.controls button.active{border-color:var(--blue);color:var(--blue)}input{accent-color:var(--blue)}footer{display:flex;gap:15px;align-items:center;height:85px;flex-shrink:0}#steps{display:flex;overflow:auto;gap:9px;flex:1;scrollbar-width:thin}#steps button{flex:0 0 82px;font-size:12px;line-height:1.8;border:0;border-bottom:2px solid #ececec;border-radius:0;background:none;padding:7px 0;color:#454545}#steps button.current{border-bottom-color:var(--blue);color:#d4e6ff}footer>button{white-space:nowrap;font-size:13px}#next{background:#282828;color:#fafafa}.cover aside{display:flex;flex-direction:column;justify-content:center}.cover aside h2{font-size:40px}.cover .heading h1{font-size:20px}a{overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:800px){main{height:auto;min-height:100svh;padding:20px 16px 0}.workspace{grid-template-columns:1fr}.visual{height:560px}aside{overflow:visible;padding:24px}footer{position:sticky;bottom:0;background:#fafafa;z-index:6;gap:8px}.heading{min-height:100px}#count{font-size:28px}.cover aside h2{font-size:30px}}@media(min-width:1700px){aside{padding:36px 40px}}

.hero{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:70px;padding:25px 5vw 50px}.hero-mark{display:grid;grid-template-columns:repeat(3,10px);gap:5px;margin-bottom:50px;width:max-content}.hero-mark i{height:10px;background:#8CBDFF}.hero-mark i:nth-child(3n){opacity:.45}.hero h1{font-size:clamp(42px,5vw,76px);font-weight:450;line-height:1.3;letter-spacing:-1.5px;margin:15px 0 25px}.hero p{max-width:490px;font-size:18px;line-height:1.9;color:#3c3c3c;margin:0}.hero-note{font-size:13px;line-height:2;color:#454545;margin-top:43px}.hero-art{border-left:1px solid #efefef;padding-left:30px;height:620px;max-height:calc(100svh - 170px)}.hero .kicker{line-height:1.6;letter-spacing:1.6px}.hero .hit{cursor:default}.hero .hit:hover>rect{stroke-width:1.2}body.cover main{padding-top:34px}@media(max-width:1100px){.hero{gap:35px;padding-left:20px;padding-right:20px}.hero h1{font-size:50px}.hero-art{padding-left:15px}.hero p{font-size:16px}}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:20px;padding:12px 15px 25px}.hero-mark{margin-bottom:30px}.hero h1{font-size:43px}.hero-note{margin-top:22px}.hero-art{border-left:0;border-top:1px solid #efefef;padding:20px 0 0;height:380px;max-height:none}.hero-art svg{height:350px}}
body.rounds .workspace{grid-template-columns:minmax(0,2.15fr) minmax(330px,1fr)}@media(max-width:800px){body.rounds .workspace{grid-template-columns:1fr}}
svg .rank-pin{stroke:none!important}svg .rank-label{font-size:20px;font-weight:650;fill:#1d1d1d}svg .rank-outline{stroke:#2d2d2d;stroke-width:1.8}svg .rank:hover>.rank-outline,svg .rank.selected>.rank-outline{stroke:#1d1d1d;stroke-width:2.5}

svg{--tensor-w:#BCA0F3;--tensor-i:#B1EF6B;--tensor-a:#F2C45F;--tensor-grad:#79D4F2}
svg .blue{fill:var(--tensor-i)}svg .wire{stroke:var(--tensor-i)}
.semantic-legend{display:grid;gap:9px;font-size:12px;line-height:1.7;margin:12px 0}
</style><g class="hit" data-node="n0" role="button" tabindex="0" aria-label="Layer"><rect x="0" y="0" width="510" height="145" rx="10" fill="none" stroke="#e8e8e8"/><text x="16" y="27" class="small">Layer</text></g><style>[data-tensor] text,.gl-onrole,.gl-onrole-strong{fill:#080808!important}.slot-title{fill:#111!important}.slot-capacity{fill:#292929!important}</style><style>.data-label{paint-order:normal!important;stroke:none!important}.data-label text,.grid-label,.grid-detail,.tensor-label,[data-tensor] text{fill:#233516!important;stroke:none!important}</style><style id="knowledge-presentation">svg .op,svg rect.op{stroke:none!important;stroke-width:0!important}text.blue,text.gold,text.purple,.grid-label,.grid-detail,.tensor-label,.data-label text,.data-label,[data-tensor] text{fill:#253344!important;stroke:none!important;paint-order:normal!important}</style></svg>