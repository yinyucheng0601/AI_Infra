@media(max-width:1100px){.bottom{gap:13px}.progress button{min-width:62px;flex-basis:62px}.cover{gap:35px;padding-left:20px;padding-right:20px}.cover h1{font-size:50px}.cover-visual{padding-left:15px}.cover p{font-size:16px}}
@media(max-width:780px){main{padding-top:24px}.cover{grid-template-columns:1fr;gap:20px;padding:12px 15px 25px;min-height:0}.cover-mark{margin-bottom:30px}.cover h1{font-size:43px}.cover p{font-size:16px}.cover-note{margin-top:22px}.cover-visual{border-left:0;border-top:1px solid #333;padding:20px 0 0}.cover-visual svg{height:350px}.bottom{gap:10px;padding:14px 0 10px}.bottom>button{padding:9px 10px;font-size:12px}.progress{gap:8px}.progress button{flex-basis:65px;font-size:12px}.workspace{min-height:0}#diagram{padding:40px 8px 12px}.info-panel{width:min(310px,calc(100vw - 65px))}.complete #diagram{max-height:none;padding:44px 5px 15px}.complete svg text{font-size:24px}.complete svg .small{font-size:21px}}

