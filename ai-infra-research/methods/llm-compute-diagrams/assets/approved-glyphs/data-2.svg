<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="展开矩阵"><style>
svg{color-scheme:dark;--bg:#111;--panel:#171717;--line:#353535;--text:#e8e8e8;--muted:#ababab;--blue:#8cbdff;--gold:#BCA0F3;--purple:#79D4F2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,a,input{touch-action:manipulation}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button:disabled{opacity:.3;cursor:default}header{height:78px;border-bottom:1px solid var(--line);padding:0 3.2vw;display:flex;align-items:center;gap:40px}.brand{font-size:18px;font-weight:550;white-space:nowrap;display:flex;align-items:center;gap:12px}.brand-mark{display:grid;grid-template-columns:repeat(3,5px);gap:3px}.brand-mark i{height:5px;background:var(--blue)}.brand-mark i:nth-child(3n){opacity:.45}nav{display:flex;gap:8px;margin-left:auto}nav button{font-size:14px;padding:11px 14px;border-radius:5px;color:var(--muted)}nav button.active{background:#252525;color:var(--text)}.top-count{font:13px ui-monospace,monospace;color:var(--muted);border-left:1px solid var(--line);padding-left:22px;white-space:nowrap}main{max-width:1640px;margin:auto;padding:33px 3.2vw 0}.heading{display:flex;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--blue);margin:0 0 10px}.heading h1{font-size:clamp(25px,2.5vw,38px);line-height:1.35;font-weight:450;margin:0}.heading p{font-size:15px;line-height:1.65;color:var(--muted);margin:10px 0 0}.step-num{margin-left:auto;font:52px ui-monospace,monospace;color:#454545;letter-spacing:-4px}.workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(345px,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:600px}.visual{display:flex;flex-direction:column;min-width:0;background:#131313;position:relative}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;padding:19px 24px;border-bottom:1px solid #282828;color:var(--muted)}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:8px;height:8px;background:var(--blue)}.legend span:nth-child(2) i{background:var(--gold)}.legend span:nth-child(3) i{background:var(--purple)}#diagram{flex:1;display:flex;align-items:center;justify-content:center;padding:15px 18px;min-height:425px}svg{display:block;width:100%;max-height:600px;overflow:visible}svg text{font-family:inherit;font-size:18px;fill:var(--text)}svg .small{font-size:14px;fill:var(--muted)}svg .tiny{font-size:12px;fill:var(--muted)}svg .blue{fill:var(--blue)}svg .gold{fill:var(--gold)}svg .purple{fill:var(--purple)}svg .hit{cursor:pointer}svg .hit:hover>rect:first-child,svg .hit:focus>rect:first-child{stroke:#e8e8e8;stroke-width:2}svg .token-box{fill:#1b1b1b;stroke:#414141}svg .op{fill:#505050;stroke:#858585;stroke-width:1.5}svg .op-label{fill:#fff;font-size:18px;font-weight:650;dominant-baseline:middle}.complete svg .op-label{font-size:18px}svg .wire{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#blueArrow)}svg .gradient{fill:none;stroke:var(--purple);stroke-width:2;stroke-dasharray:6 6;marker-end:url(#purpleArrow)}.visual-caption{font-size:12px;line-height:1.7;color:var(--muted);padding:14px 24px;border-top:1px solid #282828;display:flex;justify-content:space-between;gap:15px}.explanation{padding:28px 30px;border-left:1px solid var(--line);background:#171717;display:flex;flex-direction:column}.section-label{color:var(--muted);font-size:12px;letter-spacing:2px;margin-bottom:18px}.explanation h2{font-size:23px;font-weight:500;line-height:1.45;margin:0 0 16px}.explanation p{font-size:16px;line-height:1.9;color:#c8c8c8;margin:0 0 17px}.explanation strong{font-weight:500;color:#f0f0f0}.formula{border-left:2px solid var(--blue);padding:12px 15px;background:#1e2227;margin:5px 0 22px;font:15px/1.75 ui-monospace,monospace;color:#b5d4ff;overflow-wrap:anywhere}.inspector{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}.inspector-label{font-size:12px;color:var(--blue);letter-spacing:1px;display:block;margin-bottom:9px}.inspector h3{font-size:16px;font-weight:500;margin:0 0 8px}.inspector p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.source{margin-top:16px;font-size:12px;line-height:1.65;color:#aaa}.source a{color:#aaa;text-underline-offset:3px}.controls{padding:0 25px 18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.controls button{padding:8px 14px;border:1px solid #484848;border-radius:5px;font-size:14px}.controls button.selected{color:var(--blue);border-color:var(--blue);background:#202936}.controls label{font-size:14px;color:var(--muted)}.controls input{accent-color:var(--blue);width:170px}.bottom{display:flex;align-items:center;gap:26px;padding:20px 0 25px}.bottom button{padding:10px 18px;border:1px solid #444;border-radius:5px;font-size:14px;white-space:nowrap}.bottom .next{background:#e8e8e8;color:#111;border-color:#e8e8e8}.progress{display:flex;gap:6px;flex:1}.progress button{height:25px;flex:1;padding:10px 0;border:0;border-radius:0;position:relative}.progress button:after{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:#363636}.progress button.done:after{background:#566a84}.progress button.current:after{background:var(--blue)}.keyboard{font-size:12px;color:var(--muted);white-space:nowrap}.original-wrap{width:100%;height:540px;overflow:auto;scrollbar-color:#555 #171717;text-align:center}.original-wrap img{width:100%;height:auto;display:block}.original-wrap.fit img{height:100%;width:auto;max-width:100%;object-fit:contain;margin:auto}.original-wrap button{padding:0;display:block;margin:auto;height:100%}.modal{display:none;position:fixed;inset:0;background:#111f;z-index:20;overflow:auto;padding:75px 20px 30px}.modal.open{display:block}.modal img{display:block;width:min(100%,1100px);margin:auto}.modal .close{position:fixed;right:30px;top:20px;padding:10px 20px;border:1px solid #666;background:#222;border-radius:5px}.screen-enter{animation:enter .23s ease-out}@keyframes enter{from{opacity:.25;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.screen-enter{animation:none}}@media(min-width:1600px){#diagram svg{max-height:660px}.workspace{min-height:690px}}@media(max-width:1100px){header{gap:15px;padding:0 24px}nav{gap:0}nav button{padding:10px}.top-count{display:none}main{padding:25px 24px 0}.workspace{grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr)}.explanation{padding:24px}.legend{gap:12px;padding:16px}.keyboard{display:none}}@media(max-width:780px){header{height:auto;min-height:100px;display:block;padding:18px 18px 0}.brand{font-size:16px}nav{overflow:auto;margin-top:12px;padding-bottom:8px}nav button{white-space:nowrap;padding:8px 13px}main{padding:25px 16px 0}.heading{margin-bottom:20px}.heading p{font-size:14px}.step-num{font-size:38px}.workspace{grid-template-columns:1fr}.explanation{border-left:0;border-top:1px solid var(--line);padding:24px}.legend{font-size:12px;justify-content:space-between;gap:5px}#diagram{padding:15px 8px;min-height:0}svg{max-height:none}.visual-caption{padding:12px 16px}.visual-caption span:last-child{display:none}.bottom{gap:14px}.bottom button{padding:9px 12px}.progress{gap:4px}.progress button{padding:0}.explanation h2{font-size:22px}.original-wrap{height:560px}}@media print{header,.bottom,.controls{display:none}.workspace{display:block}.explanation{border:0}.original-wrap{height:auto}.original-wrap.fit img{width:100%;height:auto}}
[hidden]{display:none!important}main{padding-top:34px;min-height:100svh;display:flex;flex-direction:column}.heading{margin-bottom:24px}.workspace{min-height:590px}.visual{position:relative}.controls:empty{display:none}#diagram{padding:25px 18px 15px}.info-wrap{position:absolute;top:15px;right:15px;z-index:5}.info-toggle{display:grid;place-items:center;width:28px;height:28px;border:1px solid #696969;border-radius:50%;font:italic 18px Georgia,serif;color:#bbb;background:#191919}.info-toggle:hover,.info-toggle[aria-expanded=true]{border-color:var(--blue);color:var(--blue)}.info-panel{position:absolute;right:0;top:39px;width:320px;padding:21px 22px;border:1px solid #494949;border-radius:9px;background:#202020;box-shadow:0 14px 45px #0009}.info-panel h3{font-size:15px;font-weight:500;margin:0 0 15px}.info-panel .legend{display:grid;padding:0 0 15px;gap:13px;border-bottom:1px solid #414141;font-size:14px}.info-panel p{font-size:13px;line-height:1.8;color:#bababa;margin:14px 0 0}.bottom{position:sticky;bottom:0;z-index:8;background:#111f;padding:22px 0 18px;margin-top:auto;gap:22px;align-items:center}.progress{gap:8px;overflow:auto;padding:3px 2px 5px}.progress button{min-width:64px;flex:1 0 64px;height:48px;padding:0 0 13px;font-size:12px;color:#aaa}.progress button:after{top:auto;bottom:3px;height:2px}.progress button.current{color:#c8dfff}.progress button:hover{color:#eee}.bottom>button{font-size:13px;padding:10px 14px}.cover{min-height:calc(100svh - 140px);display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:70px;padding:25px 5vw 50px}.cover-mark{grid-template-columns:repeat(3,10px);gap:5px;margin-bottom:50px;width:max-content}.cover-mark i{height:10px}.cover h1{font-size:clamp(42px,5vw,76px);font-weight:450;line-height:1.3;letter-spacing:-1.5px;margin:15px 0 25px}.cover p{max-width:490px;font-size:18px;line-height:1.9;color:#bdbdbd;margin:0}.cover-note{font-size:13px;line-height:2;color:#959595;margin-top:43px}.cover-visual svg{max-height:620px;opacity:.88}.cover-visual{border-left:1px solid #333;padding-left:30px}.complete #diagram{max-height:760px;overflow:auto;align-items:flex-start;padding:25px 18px}.complete #diagram svg{max-height:none;height:auto}.complete svg text{font-size:23px}.complete svg .small{font-size:20px}.complete .explanation{justify-content:flex-start}.hit.selected>rect:first-child,.hit.selected>circle{stroke:#fff;stroke-width:2.5}.hit.selected>.wire,.hit.selected>.gradient{stroke:#fff}.cover .hit{cursor:default}.cover .hit:hover>rect:first-child{stroke:inherit}.cover .eyebrow{font-size:12px;line-height:1.6;letter-spacing:1.6px}
