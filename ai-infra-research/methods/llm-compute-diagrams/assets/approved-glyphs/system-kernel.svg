<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="核函数 · Kernel"><style>
svg{color-scheme:dark;--bg:#111;--panel:#171717;--line:#353535;--text:#e8e8e8;--muted:#ababab;--i:#B1EF6B;--w:#BCA0F3;--a:#F2C45F;--g:#79D4F2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",system-ui,sans-serif}button{font:inherit;color:inherit;background:transparent;border:1px solid #444;border-radius:5px;cursor:pointer;padding:8px 12px}button:hover{background:#292929}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #ddd;outline-offset:4px}button:disabled{opacity:.3;cursor:default}[hidden]{display:none!important}a{color:#b7cce0;text-underline-offset:4px}main{width:100%;max-width:none;margin:0;padding:28px clamp(20px,2vw,48px) 0;min-height:100svh;display:flex;flex-direction:column}.heading{display:flex;gap:20px;align-items:start;margin-bottom:22px}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:#aaa;margin-bottom:12px}h1{font-size:clamp(26px,2.6vw,40px);font-weight:450;line-height:1.35;margin:0}.subtitle{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.7}.number{font:44px ui-monospace,monospace;color:#555;margin-left:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,28vw,440px);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:580px}.visual{background:#131313;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}.canvas{position:relative;height:520px;min-height:0;overflow:hidden;touch-action:none;flex:1}.canvas svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}.canvas.dragging{cursor:grabbing}.toolbar{display:flex;gap:7px;align-items:center;justify-content:center;padding:12px 14px;border-top:1px solid #292929;flex-wrap:wrap}.toolbar button{font-size:13px}.toolbar output{font:12px ui-monospace,monospace;min-width:45px;text-align:center}.toolbar .mode{margin-right:auto;display:flex;gap:4px}.mode button.active{background:#e0e0e0;color:#111;border-color:#e0e0e0}.info{position:absolute;top:14px;right:14px;z-index:4}.info>button{border-radius:50%;width:28px;height:28px;padding:0;font:italic 18px Georgia;background:#191919}.info-panel{position:absolute;right:0;top:39px;width:min(330px,75vw);padding:20px;background:#202020;border:1px solid #494949;border-radius:8px;box-shadow:0 14px 45px #0008;font-size:13px;line-height:1.85}.info-panel p{margin:10px 0}.explanation{border-left:1px solid var(--line);padding:28px;background:var(--panel);display:flex;flex-direction:column;min-width:0}.label{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:#aaa;margin-bottom:15px}.explanation h2{font-size:23px;line-height:1.5;font-weight:500;margin:0 0 16px}.copy p{font-size:16px;line-height:1.85;color:#c7c7c7;margin:0 0 17px}.copy strong{color:#eee;font-weight:550}.formula{background:#202020;border-radius:5px;padding:13px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.85 ui-monospace,monospace;margin:0 0 20px;color:#ddd}.inspector{margin-top:auto;border-top:1px solid var(--line);padding-top:17px}.inspector h3{font-size:16px;font-weight:500;margin:8px 0}.inspector p{font-size:14px;line-height:1.8;color:#aaa;margin:0}.sources{font-size:12px;line-height:1.8;color:#999;margin-top:18px}.sources summary{cursor:pointer}.sources ul{padding-left:18px}.bottom{position:sticky;bottom:0;z-index:6;background:#111;display:flex;align-items:center;gap:18px;padding:18px 0;margin-top:auto}.steps{display:flex;overflow:auto;gap:8px;flex:1;scrollbar-width:thin}.steps button{min-width:70px;flex:1 0 70px;border:0;border-bottom:2px solid #333;border-radius:0;padding:8px 2px 12px;font-size:12px;line-height:1.7;color:#999;white-space:nowrap}.steps button[aria-current=step]{color:#eee;border-color:#ddd}.steps span{display:block;font:10px ui-monospace,monospace;color:#777;margin-bottom:5px}.bottom>button{white-space:nowrap;font-size:13px}.next{background:#e8e8e8;color:#111}.next:hover{background:#fff}.cover{display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:55px;min-height:calc(100svh - 115px);padding:25px 3vw}.cover h1{font-size:clamp(34px,3.6vw,56px);letter-spacing:-1px;line-height:1.35}.cover p{font-size:17px;line-height:1.9;color:#bbb;max-width:490px}.cover .meta{font-size:12px;line-height:2;color:#999;margin-top:30px}.cover svg{width:100%;height:500px}.badge{display:inline-block;font:11px ui-monospace,monospace;border:1px solid #444;padding:6px 10px;margin-bottom:25px;letter-spacing:1px}.cover button{margin-top:20px}svg text{font-family:Inter,"PingFang SC",system-ui,sans-serif;fill:#e8e8e8;font-size:18px}svg .small{font-size:14px;fill:#ababab}svg .tiny{font-size:12px;fill:#ababab}svg .op-label{font-size:18px;font-weight:650;fill:#fff;dominant-baseline:middle}svg .hit{cursor:pointer}svg .hit .outline{transition:stroke .12s}svg .hit:hover .outline,svg .hit.selected .outline,svg .hit:focus .outline{stroke:#fff;stroke-width:2.5}svg .hit.selected text{fill:#fff}svg .hit:focus{outline:none}svg .data-label{paint-order:stroke;stroke:#131313;stroke-width:2.5px;stroke-linejoin:round}svg .grid-label{font-size:14px;fill:var(--tensor-color);font-weight:400}svg .grid-detail{font-size:12px;fill:var(--tensor-color);font-weight:400}svg .hit.selected .data-label text{fill:var(--tensor-color)}svg .edge-label{font-size:12px;fill:#ccc;paint-order:stroke;stroke:#131313;stroke-width:5px}svg .soft{opacity:.24}svg .hit.selected{opacity:1}.noscript{padding:35px;line-height:1.8}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1000px){body:not(.cover-mode) main{height:100svh;min-height:0}.heading,.bottom{flex-shrink:0}.workspace{flex:1;min-height:0}.canvas{height:0;min-height:320px}.explanation{overflow:auto;scrollbar-width:thin}.bottom{position:static}}
@media(max-width:999px){main{padding:25px 20px 0}.workspace{grid-template-columns:1.3fr 1fr}.explanation{padding:22px}.canvas{height:570px}.cover{gap:25px;padding:20px 0}.cover h1{font-size:45px}}
@media(max-width:760px){main{padding:22px 14px 0}.heading{margin-bottom:18px}.number{font-size:28px}.workspace{grid-template-columns:1fr}.canvas{height:440px;flex:none}.explanation{border-left:0;border-top:1px solid var(--line);padding:24px}.cover{grid-template-columns:1fr;gap:12px;min-height:0;padding:20px 10px}.cover h1{font-size:42px}.cover svg{height:340px}.cover .meta{margin-top:15px}.bottom{gap:8px;padding:12px 0}.bottom>button{font-size:12px;padding:8px}.toolbar{gap:4px}.toolbar .mode{width:100%;justify-content:center;margin:0 0 5px}.steps button{min-width:62px;flex-basis:62px}.subtitle{font-size:13px}}

/* Auxiliary colors identify object families; tensor colors retain data semantics. */
svg .hit[data-key="callable"]{--object-color:#8EAED0}
svg .hit[data-key="task"]{--object-color:#685CF0}
svg .hit[data-key="loop"]{--object-color:#685CF0}
svg .hit[data-key="loop"]>path{stroke:#685CF0}
svg .hit[data-key="loop"]>text{fill:#685CF0}
svg .hit[data-key="buffer"],svg .hit[data-key="address"]{--object-color:#C7AD88}
svg .hit[data-key="pass"],svg .hit[data-key="snapshot"]{--object-color:#aaa}
svg .hit[data-key="callable"]>.outline,svg .hit[data-key="loop"]>.outline,svg .hit[data-key="task"]>.outline,svg .hit[data-key="buffer"]>.outline,svg .hit[data-key="address"]>.outline,svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{stroke:var(--object-color);stroke-width:1.3}
svg .hit[data-key="callable"]>text,svg .hit[data-key="loop"]>text,svg .hit[data-key="task"]>text,svg .hit[data-key="buffer"]>text,svg .hit[data-key="address"]>text,svg .hit[data-key="pass"]>text,svg .hit[data-key="snapshot"]>text{fill:var(--object-color)}
svg .hit[data-key="task"]>.outline{fill:#211C3C}
svg .hit[data-key="buffer"]>.outline{fill:#25221D}
svg .hit[data-key="pass"]>.outline,svg .hit[data-key="snapshot"]>.outline{fill:#202020}
svg .hit[data-key="callable"]>path{stroke:#8EAED0;stroke-opacity:.3}
svg .hit[data-key="buffer"]>path{stroke:#C7AD88;stroke-opacity:.45}
svg .hit[data-key="address"]>rect{fill:#C7AD88;fill-opacity:.17;stroke:#C7AD88;stroke-width:1.2}
svg .hit:hover>.outline,svg .hit.selected>.outline,svg .hit:focus>.outline{stroke-width:2;stroke:var(--object-color,#fff)}
svg .symbol .outline{stroke:#B9C2CD;stroke-width:1.5;fill:#1A1E23}
svg .symbol.selected .outline,svg .symbol:hover .outline,svg .symbol:focus .outline{stroke:#fff;stroke-width:2}
svg .hit[data-key="kernel"]{--object-color:#685CF0}svg .hit[data-key="kernel"]>text{fill:#CEC4F9}svg .hit[data-key="op"]{--object-color:#685CF0}
svg .cell-title{font-size:16px;font-weight:600;fill:#eee}
 svg{--text:#e8e8e8;--muted:#ababab;font-family:Inter,"PingFang SC",system-ui,sans-serif} svg text{font-family:inherit} .hit{cursor:default}</style><defs><linearGradient id="op-purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4D3BC9"/><stop offset="1" stop-color="#3D2DC0"/></linearGradient><marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M8 7 H12" stroke="#131313" stroke-width="2.5"/><path d="M3 2 L8 7 L3 12 M7 2 L12 7 L7 12" stroke="#E8E8E8" stroke-width="1.4" stroke-linejoin="miter" fill="none"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#ccc" stroke-width="1.5" fill="none"/></marker><marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 6 L6 1 L11 6 L6 11Z" fill="#131313" stroke="#aaa"/></marker><marker id="circle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><circle cx="5" cy="5" r="3" fill="#131313" stroke="#aaa"/></marker></defs><rect x="35" y="25" width="250" height="130" rx="18" fill="#fff" fill-opacity=".1"/><text x="49" y="55" style="fill:white;font-weight:650;font-size:18px">projection</text><rect x="226" y="39" width="43" height="24" rx="2" fill="#000"/><text x="247.5" y="56" text-anchor="middle" style="fill:white;font-size:14px">AIC</text><g class="hit" tabindex="0" role="button" aria-label="IR 操作 · OP" data-key="op" data-layer="data"><rect class="op outline" x="69" y="84" width="182" height="48" rx="24" fill="#685CF0" stroke="#685CF0" stroke-width="1"/><circle cx="94" cy="108" r="12" fill="#211391"/><text x="94" y="109" text-anchor="middle" dominant-baseline="middle" style="font-size:15px;font-style:italic;fill:#A58BFF">ƒₓ</text><text x="174" y="108" class="op-label" text-anchor="middle">MatMul</text></g></svg>