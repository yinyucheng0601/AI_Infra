xt-anchor="middle" class="anomaly-mark">!</text><text x="320" y="126" text-anchor="middle" class="tensor-label">[T × 1024]</text><text x="320" y="148" text-anchor="middle" class="tensor-label tensor-rms">RMS 0.1250</text></g></svg>