function render(){document.querySelector('h1').textContent=String(page+1).padStart(2,'0')+' / '+titles[page];document.querySelector('#intro').innerHTML=page===0?'<input aria-label="开发目标" value="'+esc(goal)+'" onchange="goal=this.value;render()"><small> 委托示例 · 本页不执行真实任务</small>':'<small>'+explanations[page]+'</small>';document.querySelector('#modes').innerHTML=steps[page].map((s,i)=>`<button class="${i===step?'on':''}" onclick="step=${i};render()">${s}</button>`).join('');let s=diagram();document.querySelector('svg').innerHTML=s;document.querySelector('svg').setAttribute('data-diagram',page);document.querySelectorAll('svg g[onclick]').forEach(el=>{el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',el.textContent);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.dispatchEvent(new MouseEvent('click'))}}});let l=layers[selected];document.querySelector('#notes').innerHTML='<strong>'+steps[page][step]+'</strong>　'+(page===10?['编程：文件 / 编译反馈 / 可用功能','检索：文献 / 来源核对 / 覆盖问题','浏览器：页面 / 环境反馈 / 授权操作结果','分析：数据 / 可复核计算 / 分析产物'][step]:page===6?['工具 → 当前 Runtime：结果返回','主 Agent → 专家 → 主 Agent：汇总结果','当前 Agent → 接收 Agent：控制转移','节点 → 条件边 → 后续节点：状态决定路径'][step]:page===4?'文本片段用于展示序列追加；不表示实际 tokenizer 的分词结果。':page===3?'请求状态随分步变化；色块不表示真实运行耗时。':'');document.querySelector('#info').innerHTML=((page===1||page===12)?'<p>选中层：'+l[0]+'；状态：'+l[4]+'；结束：'+l[5]+'</p>':'<p>'+explanations[page]+'</p>')+'<p>四层分析框架与交互分步是报告综合。案例步骤未表示实际耗时、运行轨迹或私有产品内部架构。</p>'+sources.filter((_,i)=>({0:[5],1:[0,1,2,4],2:[0,1,3,4,6],3:[2],4:[0],5:[1],6:[1,4],7:[3,4],8:[5],9:[5,6],10:[1,4],11:[3],12:[0,1,2,3,4,5,6]})[page].includes(i)).map(([n,u])=>`<p><a href="${u}" target="_blank" rel="noopener">${n}</a></p>`).join('');document.querySelector('nav').innerHTML=titles.map((s,i)=>`<button class="${i===page?'on':''}" onclick="page=${i};step=0;render()">${i+1} ${s}</button>`).join('');document.querySelector('#next').disabled=page===12&&step===steps[page].length-1}function advance(d){if(d>0){if(step<steps[page].length-1)step++;else if(page<12){page++;step=0}}else if(step>0)step--;else if(page>0){page--;step=steps[page].length-1}render()}document.querySelector('#next').onclick=()=>advance(1);document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1)});render();</script></html>
