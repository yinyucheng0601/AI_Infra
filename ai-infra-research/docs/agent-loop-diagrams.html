function choose(id){selected=id;if(id.startsWith('layer-'))state.layer=Number(id.slice(6));renderScene();inspect()}
function inspect(){const item=objects[selected];$('#objectTitle').textContent=item?.title||'点击对象查看定义';$('#objectText').textContent=item?.desc||REPORT.pages[page].change}
function renderScene(){const body=draw();$('#scene').innerHTML=body;resize();}
function render(){const p=REPORT.pages[page];$('#title').textContent=p.title;$('#count').textContent=String(page+1).padStart(2,'0')+' / 13';$('#question').textContent=p.question;$('#kind').textContent=page===8?'官方行为 / PRODUCT':page===1||page===12?'综合框架 / SYNTHESIS':'机制分析 / MECHANISM';$('#conclusion').textContent=p.conclusion;$('#explanation').innerHTML=(paragraphs[page]||[p.conclusion,p.change]).map(v=>'<p>'+esc(v)+'</p>').join('');$('#goalField').hidden=page!==0;$('#steps').innerHTML=p.steps.map((s,i)=>`<button data-step="${i}" class="${i===step?'active':''}" aria-pressed="${i===step}" data-tip="显示：${esc(s)}">${esc(s)}</button>`).join('');$('#chapterNav').innerHTML=REPORT.pages.map((v,i)=>`<button data-page="${i}" class="${i===page?'active':''}" aria-current="${i===page?'step':'false'}" data-tip="第 ${i+1} 章：${esc(v.title)}">${String(i+1).padStart(2,'0')} ${esc(v.title.split('：')[0])}</button>`).join('');$('#position').textContent=`${page+1}/13 · ${step+1}/${p.steps.length}`;$('#previous').disabled=page===0&&step===0;$('#next').disabled=page===12&&step===p.steps.length-1;renderScene();inspect();if(!$('#infoPanel').hidden)renderInfo()}
function gotoPage(i){page=i;step=0;selected='';zoom=1;pan={x:0,y:0};render();$('#chapterNav .active').scrollIntoView({block:'nearest',inline:'nearest'})}
function stepReading(d){if(d>0){if(step<REPORT.pages[page].steps.length-1)step++;else if(page<12){page++;step=0;zoom=1;pan={x:0,y:0};selected=''}}else if(step>0)step--;else if(page>0){page--;step=REPORT.pages[page].steps.length-1;zoom=1;pan={x:0,y:0};selected=''}render();$('#chapterNav .active').scrollIntoView({block:'nearest',inline:'nearest'})}
function resize(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight,scale=Math.min(1,w/1100,h/650);$('#diagram').style.width=1100*scale+'px';$('#diagram').style.height=650*scale+'px';$('#diagram').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;$('#scale').textContent=Math.round(scale*zoom*100)+'%';$('#stage').classList.toggle('zoomed',zoom>1)}
function renderInfo(){document.querySelectorAll('[data-info]').forEach(b=>b.classList.toggle('active',b.dataset.info===infoTab));const p=REPORT.pages[page];if(infoTab==='sources'){$('#infoBody').innerHTML='<h3>结论与证据边界</h3><p>'+esc(p.boundary)+'</p>'+p.sources.map(id=>{let a=REPORT.sources[id];return `<p><a href="${a[1]}" target="_blank" rel="noopener">${esc(a[0])}</a><br><small>${esc(a[2])} · ${esc(a[3])}</small></p>`}).join('');return}if(infoTab==='terms'){$('#infoBody').innerHTML='<h3>状态尺度</h3>'+layers.map(l=>'<p><strong>'+l[0]+'</strong><br>'+l[4]+'<br><small>'+l[5]+'</small></p>').join('');return}const legend=[['token','Token','Token 图元标识模型序列位置。服务请求使用独立的请求对象图形。'],['data-2','激活 / 参数矩阵','正式展开矩阵：激活为绿色，参数为蓝紫色。形状需由实际模型确定。'],['data-5','KV Cache','保存注意力的 K / V，中间状态与参数分开。'],['system-op','计算 OP','正式库模型计算变体。只用于模型前向或加速器计算，不冒充业务步骤。'],['system-storage','存储空间','蓝色存储板。第二行表达当前存储语义；未指定实际芯片容量。'],['system-memref','存储引用','灰色板标识已分配缓冲区与引用，区别于物理容量。']];$('#infoBody').innerHTML='<h3>已确认图元 · 库版本 2026-10-13</h3>'+legend.map(([id,t,d],i)=>`<div class="legend-item"><svg viewBox="0 0 320 180" aria-label="${esc(t)}">${glyph(id,20,40,id==='system-op'?.9:id==='data-5'?1:.8,id==='system-storage'?['KV 存储池','按请求分配 / 回收']:id==='system-memref'?['缓存引用','关联请求与物理块']:[], 'legend-'+i,d).replace(/ data-select="[^"]*"| data-tip="[^"]*"| tabindex="0"| role="button"/g,'')}</svg><div><strong>${t}</strong><br>${d}</div></div>`).join('')+'<p>文档形表示目标、工具消息或账本；连线依旁注区分调用、返回、依赖与读写。业务状态图形不属于计算 OP 图元。</p>'}
function setInfo(open){$('#infoPanel').hidden=!open;$('#infoButton').setAttribute('aria-expanded',open);if(open)renderInfo()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-step],[data-select],[data-info]');if(b){if(b.dataset.page!==undefined)gotoPage(+b.dataset.page);else if(b.dataset.step!==undefined){step=+b.dataset.step;render()}else if(b.dataset.info){infoTab=b.dataset.info;renderInfo()}else if(b.dataset.select)choose(b.dataset.select)}if(!e.target.closest('#infoPanel,#infoButton'))setInfo(false)});
$('#previous').onclick=()=>stepReading(-1);$('#next').onclick=()=>stepReading(1);$('#zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);resize()};$('#zoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.25);resize()};$('#fit').onclick=()=>{zoom=1;pan={x:0,y:0};resize()};$('#infoButton').onclick=()=>setInfo($('#infoPanel').hidden);$('#closeInfo').onclick=()=>setInfo(false);$('#goalInput').oninput=e=>{state.goal=e.target.value;renderScene()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setInfo(false);$('#tooltip').hidden=true;return}if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;const node=e.target.closest('[data-select]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const id=node.dataset.select;choose(id);const replacement=$('#diagram [data-select="'+id+'"]');replacement?.focus();return}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepReading(e.key==='ArrowRight'?1:-1)}});
function tooltip(e){const el=e.target.closest('[data-tip]');if(!el)return;const r=el.getBoundingClientRect();$('#tooltip').textContent=el.dataset.tip;$('#tooltip').hidden=false;$('#tooltip').style.left=Math.max(8,Math.min(r.left,innerWidth-310))+'px';$('#tooltip').style.top=(r.bottom+38<innerHeight?r.bottom+5:r.top-36)+'px'}document.addEventListener('mouseover',tooltip);document.addEventListener('focusin',tooltip);document.addEventListener('mouseout',()=>$('#tooltip').hidden=true);document.addEventListener('focusout',()=>$('#tooltip').hidden=true);
$('#stage').addEventListener('pointerdown',e=>{if(zoom<=1)return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y,moved:false};});window.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){pan={x:drag.px+dx,y:drag.py+dy};resize()}});window.addEventListener('pointerup',()=>{if(drag?.moved)window.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault()},{capture:true,once:true});drag=null});window.addEventListener('resize',resize);render();
