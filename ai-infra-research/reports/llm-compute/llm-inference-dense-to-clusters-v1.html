</style><main><section class="hero" id="hero" aria-labelledby="hero-title"><div><span class="hero-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><div class="kicker">A VISUAL GUIDE TO LLM INFERENCE</div><h1 id="hero-title">LLM 推理<br>全流程图解</h1><p>从小型 Dense 模型的逐 Token 生成出发，理解 KV cache、多卡协作与 MoE，逐步读懂生产推理服务。</p><div class="hero-note">23 节图解 · 由浅入深<br>单卡 Dense → 多卡 Dense → MoE → 生产集群</div></div><div class="hero-art" id="hero-art" aria-label="Prefill 与连续 Decode 的阶段预览"></div></section><header class="heading"><div><div class="kicker" id="kicker"></div><h1 id="title"></h1></div><div id="count"></div></header><section class="workspace"><div class="visual"><div class="toolbar"><button id="minus" aria-label="缩小">−</button><button id="fit">Fit</button><button id="plus" aria-label="放大">＋</button></div><button class="info-toggle" id="infoBtn" aria-label="图例与说明" aria-expanded="false">i</button><div class="info" id="info" hidden></div><div id="canvas"></div><div class="controls" id="controls"></div></div><aside><div class="kicker" id="section"></div><h2 id="thesis"></h2><div id="copy"></div><div class="formula" id="formula"></div><div id="inspector"><div class="kicker">SELECTED ELEMENT</div><h3 id="nodeTitle">点击图元查看含义</h3><p id="nodeText">图中的计算、数据和部署边界分别对应不同层级。</p><button id="jump" hidden>展开相关图解 →</button></div><div class="source" id="source"></div></aside></section><footer><button id="prev">← 上一页</button><nav id="steps" aria-label="章节"></nav><button id="next">下一页 →</button></footer></main><script>
'use strict';
const B='#8CBDFF',G='#E8C66E',W='#E8E8E8';
const sources={cache:['KV cache · Transformers','https://huggingface.co/docs/transformers/en/cache_explanation'],parallel:['多卡推理 · vLLM','https://docs.vllm.ai/en/latest/serving/parallelism_scaling/'],pd:['P/D 分离 · vLLM','https://docs.vllm.ai/en/latest/features/disagg_prefill/'],ds:['DeepSeek V3/R1 · 2025 年 2 月公开部署','https://github.com/deepseek-ai/open-infra-index/blob/main/202502OpenSourceWeek/day_6_one_more_thing_deepseekV3R1_inference_system_overview.md'],v3:['DeepSeek-V3 技术报告 · 2025-02 版本','https://arxiv.org/html/2412.19437v2'],ep:['专家通信 · DeepEP','https://github.com/deepseek-ai/DeepEP']};
sources.phases=['生成阶段与 KV cache · NVIDIA','https://developer.nvidia.com/blog/mastering-llm-techniques-inference-optimization/'];sources.batch=['连续批处理 · Transformers','https://huggingface.co/docs/transformers/en/continuous_batching'];sources.paged=['前缀缓存 · vLLM','https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/'];
sources.rank=['Rank 的进程语义 · PyTorch','https://docs.pytorch.org/docs/stable/distributed.html'];
const slides=[];
function page(id,nav,title,thesis,p,f,src='',group='01 / SINGLE-NPU DENSE'){slides.push({id,nav,title,thesis,p:p.split('|'),f,src,group});}
page('cover','封面','LLM COMPUTE / INFERENCE','从一个 Token，读到一套推理服务','先用小型 Dense 模型建立生成过程，再把同一条请求放进多卡模型、MoE 专家网络和生产资源池。|沿着数据、计算、状态和部署四条关系，逐页展开，最后在总览中重新汇合。','单卡 Dense → 多卡 Dense → MoE → 生产集群','','PROGRESSIVE GUIDE / 01');
page('journey','全流程','一条请求如何变成连续输出','生成过程包含模型计算与服务调度','用户输入先经过对话模板和分词，形成 Token ID 序列。服务端为请求分配计算与缓存资源，模型读取整段提示词后选出第一个输出 Token。|之后每轮把刚选出的 Token 送回模型，继续预测下一个；服务端将结果逐步转成文本并返回，遇到停止条件后释放请求状态。','请求 → Prefill → 首 Token → Decode 循环 → 结束');
page('vocab','图元','数据、计算与部署使用不同图元','先识别对象，再阅读连线','蓝色网格承载本次请求的数据与中间结果，金色网格承载已训练的权重。推理期间权重通常保持固定，KV cache 则是持续更新的请求状态。|中灰实线胶囊代表计算，外虚线胶囊代表通信，圆形加号与乘号代表逐元素运算。设备容器只说明计算放在哪里，不代表一次计算。','蓝色实线箭头：数据传递\n金色虚线箭头：参数读取');
page('tokens','输入','文本先变成 Token ID，再查表得到向量','Embedding 把离散编号转换为特征','图中用四个教学 Token 追踪同一条请求，编号与分词边界均为示例。真实分词取决于 tokenizer，对话角色、模板和特殊 Token 也占上下文长度。|Embedding 从词表权重中读取对应的行，得到 [T,H] 激活。这里用 T=4、H=8 展示矩阵；后续以约 3B 的假想 Dense 模型讨论部署，H=8 仅用于看清形状。','ID [T] → Embedding → X [T,H]\nT：本次处理的位置数；H：特征宽度');
page('layer','单层','一个 Dense Layer 包含两个残差子层','每个位置都经过 Attention 与 Dense FFN','采用 decoder-only、Pre-Norm 的教学基线：Attention 让当前位置读取可见上下文，FFN 对每个位置的特征作非线性变换。两条残差旁路分别保留各自子层的输入。|Prefill 和 Decode 使用同一组层与权重；变化的是本轮输入的位置数和所读取的缓存。点击 Attention 或 FFN 可以展开内部计算。','Y = X + Attention(Norm₁(X))\nZ = Y + FFN(Norm₂(Y))');
page('attention','注意力','当前位置如何读取已有上下文','Q 发起查询，K 决定匹配，V 提供内容','输入先投影成 Q、K、V；采用 RoPE 的模型会对 Q、K 加入位置相关变换，再计算匹配分数、因果掩码和 Softmax。注意力系数是随输入变化的中间结果。|选中第 i 个位置时，它只读取自己及之前位置的信息；图中右侧矩阵展示可见范围。加权结果经过输出投影，恢复到 [T,H] 后进入残差相加。','每个头：A = softmax(QKᵀ / √d + mask)\n输出 = Concat(A V) Wₒ');
page('ffn','Dense FFN','Dense FFN 在每个位置使用同一套权重','SwiGLU 先扩展特征，再投影回 H','这页展开一种常见的 Dense FFN：输入分别经过 gate 与 up 投影，gate 分支经 SiLU 后与 up 分支逐元素相乘，再通过 down 投影回到原宽度。|F 是中间特征宽度，Token 数 T 保持不变。Dense 的含义是各位置使用同一套完整 FFN；它并不表示 Attention 可以看到未来。','U = SiLU(XWgate) ⊙ (XWup)\nFFN(X) = U Wdown');
page('prefill','Prefill','提示词的多个位置在同一轮参与计算','Prefill 建立上下文缓存并产生首个预测','整段提示词已知，所以同一层可以并行处理多个位置，同时用因果掩码限制可见范围。层与层之间仍需按依赖顺序推进。|每一层保存自己的 K/V。经过最后一层和最终 Norm，常见生成路径只将最后一个提示位置的隐藏向量送入 LM Head，用它预测第一个新 Token。','输入 T=4 个位置 → 各层缓存长度 4\n最后位置隐藏向量 [1,H] → 首个新 Token','cache');
page('sample','输出选择','LM Head 将特征转换为词表分数','采样得到的是下一位置的 Token ID','LM Head 将最后位置的隐藏向量映射成词表 logits，即每个候选 Token 的未归一化分数。Greedy 选择最高分，随机采样则按温度及 top-k、top-p 等策略处理后的分布选择。|下面的概率完全是教学数据。切换选择方式可以看到，同一组分数可产生不同续写；选择出的 Token 进入下一轮计算，detokenizer 再把输出序列还原为文本。','[1,H] × Whead [H,V] → logits [1,V]\nV：词表大小；EOS：可选停止 Token');
page('decode','Decode','每轮只计算新位置，并读取历史 KV','刚输出的 Token 在下一轮才进入缓存','Prefill 已输出 y₁，但缓存仅包含提示词。第一次 Decode 输入 y₁，为它在每层生成并追加 K/V，随后输出 y₂；接着输入 y₂，重复同样的过程。|旧位置的 FFN 和投影结果无需整段重算，但新位置的 Attention 仍要读取相关历史信息。这里采用全注意力、单请求、每轮一个 Token 的基线。','Prefill：缓存 4 → 输出 y₁\nDecode 1：输入 y₁ → 缓存 5 → 输出 y₂','cache');
page('memory','显存','模型装得下，还要为请求状态留空间','权重、KV cache 和工作区共同占用显存','约 3B 参数的假想 Dense 模型，以 BF16 每参数 2 字节计，仅权重约 6 GB；约 70B 模型对应约 140 GB。这里使用十进制 GB，实际还需量化元数据、工作区和框架开销。|普通 MHA/GQA 的 KV 容量随并发请求和上下文增长。右侧估算器采用 L=32、KV 头数=8、每头宽度=128、BF16；这组参数独立于前面的 3B 示例，不能直接套用 MLA。','KV 字节 ≈ 2 × L × B × S × nKV × d × 每元素字节\n2 代表 K 和 V；B 为等长请求数；S 为已缓存长度');
page('batch','连续批处理','不同请求可以在相邻轮次加入和退出','批次是调度器的当前工作集合','请求 A、B、C 的提示长度和输出长度不同。若整个批次都等最长请求结束，已完成请求占用的计算槽位便无法及时复用；连续批处理允许在迭代边界调入新请求。|图中按轮次展示活跃请求集合，不把轮次宽度解释成真实耗时。长 Prefill 还可以分块，与 Decode 预算共同调度；具体策略受 Token 预算、KV 空间与服务目标约束。','每轮：选择请求 → 执行 → 更新状态 → 回收／加入');
page('paged','缓存管理','逻辑连续的 KV 可以分散在物理块中','分页管理改变存放位置，保留上下文顺序','请求的逻辑位置通过块表映射到物理 KV 块，Attention 据此读取正确历史。按需分配与结束回收让不同长度的请求更容易共用显存。|相同前缀在模型、Token 和缓存兼容条件一致时可以复用已有缓存；这减少重复 Prefill。分页管理本身并不会让每个 KV 元素变小，量化和压缩属于另外的机制。','逻辑块 0,1,2 → 物理块 5,1,7\n请求结束 → 引用计数归零的块可回收');
page('scale','大模型','参数规模与服务流量推动两种扩展','模型切分解决单副本容量，副本扩展承接更多请求','一个大模型副本可以由多张卡协作承载，这些卡共同完成一次生成。另一个方向是部署多个完整服务副本，将不同请求分配给它们。|Dense 的 TP 按张量维切分计算，PP 按层切分；服务副本之间通常没有训练式的梯度同步。能否部署还取决于 KV 空间、精度和卡间网络，不能只比较权重与显存。','模型内：TP / PP → 一条请求的协作\n模型外：服务副本 → 多条请求的分流','parallel','02 / MULTI-NPU DENSE');
page('tp','张量并行','两张卡共同完成一个 FFN','各卡计算部分结果，再进行求和合并','这里选一个 TP=2 的 FFN 教学布局：gate 与 up 的输出特征按 F 切开，两张卡分别得到 [T,F/2]；down 权重按输入维切分，因此每卡得到 [T,H] 的部分和。|AllReduce 对部分和逐元素求和，让各卡取得完整分支结果，再与残差合并。Attention 的头与输出投影也可以按实现切分；KV 头数较少时还可能复制 KV。','U₀,U₁ [T,F/2] → P₀,P₁ [T,H]\nAllReduce(P) = P₀ + P₁','parallel','02 / MULTI-NPU DENSE');
page('pp','层间并行','不同层由不同设备组承载','PP 传递层边界激活，TP 发生在层内','这页用 TP=2、PP=2 的四卡副本说明两种关系：Stage 0 放前半层，Stage 1 放后半层；每个 stage 内两张卡协作。图中一个 rank 对应一张设备，是本例假设。|当前 Token 必须依次经过两个 stage，最后选出的下一 Token 再返回起点。多个请求可填充流水线，但单条自回归序列仍存在前后依赖，增加 stage 不保证单请求更快。','一个模型副本：TP 2 × PP 2 = 4 卡\nStage 边界传递 hidden states，而非整套权重','parallel','02 / MULTI-NPU DENSE');
page('moe','MoE','大规模 MoE 每个 Token 只选择部分专家','总参数量与单 Token 激活参数量含义不同','教学图用四个专家、top-2 展示：router 为输入产生分数，选择两个专家；同一个完整特征向量送往两条分支，专家输出分别乘以动态系数，再相加恢复 [T,H]。|DeepSeek-V3 报告给出 671B 总参数、每 Token 约 37B 激活参数。未被当前 Token 选择的专家仍是部署模型的一部分，容量规划需要考虑整套参数及副本。','教学：4 experts / top-2\nDeepSeek-V3：671B total / 37B active','v3','03 / MoE & PRODUCTION');
page('ep','专家并行','专家分布到不同卡后，路由变成通信','Dispatch 发送激活，Combine 返回专家输出','EP 将不同专家放在不同设备上。源设备依据路由发送 Token 特征，目标设备运行本地专家，再把结果送回源设备合并，恢复请求与位置顺序。|图中只追踪一个 Token 的两条路径；真实批次里多个源卡与多个目标卡同时交换数据。DeepEP 提供面向 MoE 的 dispatch/combine 通信实现，具体通信精度与重叠方式随部署配置变化。','源 Token → Dispatch → 远端专家 → Combine\n传输的是激活／专家输出；权重驻留在专家设备','ep','03 / MoE & PRODUCTION');
page('mla','MLA','DeepSeek 的缓存结构需要单独理解','MLA 以压缩潜变量保存历史信息','常规 MHA/GQA 缓存各位置的 K、V；DeepSeek-V3 的 MLA 将联合 KV 信息压缩为潜变量，并保留解耦的位置相关键状态，从而降低缓存开销。|计算可通过权重吸收等实现方式使用压缩状态，不必把概念图理解成每一步都显式还原并保存全部 K/V。这里仅展示存储对象的差异，不用通用 KV 公式估算 MLA 的具体容量。','普通 KV：每层每位置约 2 × nKV × d 个元素\nMLA：每层每位置 dc + dR 个元素\n总量再乘历史长度 S、层数 L 与元素字节数','v3','03 / MoE & PRODUCTION');
page('pd','P/D 分离','Prefill 与 Decode 可以使用不同资源池','交接请求状态后，由 Decode 继续生成','Prefill 处理较多已知位置，Decode 则反复处理少量新增位置，两者的计算、访存与延迟诉求不同。分离后可以分别配置并行布局与资源配比。|接力所需的不只是首 Token：Decode 还要获得各层缓存、位置和请求状态，并处理缓存布局兼容性。KV 传输与排队会增加首 Token 或后续输出的等待，分离收益取决于负载与网络。','P 池：Prompt → Prefill → KV\nD 池：接收状态 → Decode → 持续输出','pd','03 / MoE & PRODUCTION');

page('clusters','多集群','跨节点、分资源池与多集群需要分开看','请求路由边界与模型通信边界不同','一个部署单元可以跨多个高速互联节点；P/D 资源池也可以处于同一集群中。面向更大规模服务，还可在多个集群部署服务单元，由上层入口按容量、缓存亲和性与健康状态选择去向。|本页多集群拓扑是生产架构教学方案，并非 DeepSeek 的已证实跨地域结构。跨地域通常以请求分流为边界；把每层 EP 通信跨广域网，会引入完全不同的延迟和带宽约束。','层内 EP：高频交换激活\nP → D：交接 KV 状态\n集群间路由：选择请求的服务位置','','03 / MoE & PRODUCTION');

Object.assign(slides.find(s=>s.id==='paged'),{title:'同一请求的 KV，落在哪个 Rank？',thesis:'逻辑块描述 Token 顺序；物理块保存各 Rank 的本地 KV 分片',p:['先看上方的请求 A：12 个位置按每块 4 个位置分成 3 个逻辑块，块表把它们映射到槽位 5、1、7。块表保存地址索引，真正的 K/V 数值保存在绑定 NPU 的内存中。','下方提前引入一个 TP=2 示例：同一层共有 4 个 KV heads，R00 保存 heads 0–1，R01 保存 heads 2–3。两个 Rank 都覆盖全部 12 个 Token 位置，切分的是 KV heads。本例采用一致的块号分配，因此两边都能查到块 1，但它们位于不同 NPU，保存不同的 KV 分片。','沿蓝线读取位置 6：6÷4 得到逻辑块 1、余数 2；查表得到物理块 1，再取块内偏移 2。两个 Rank 分别读出本地 heads 的 K/V，供本地 Attention 使用。图中只展开一次定位，完整 Attention 会读取所有需要的历史位置。','单 Rank 模型把所需各层的 KV 保存在本地；引入 PP 后，各 Stage 只缓存自己执行层的 KV。这里仅展开 Layer 0，未采用上下文并行；GQA/MQA 在 KV heads 不足以继续切分时可能复制 KV，不能一概视为减半。请求结束后，无引用的块可回收；分页本身不压缩 KV。'],f:'示例：Replica A · Layer 0 · TP=2\n每块 4 个位置；K、V 各为 [4,2,d_head]\n定位：本地基址、块号、块内偏移',src:'paged'});

Object.assign(slides.find(s=>s.id==='deepseek'),{thesis:'Node 包含多张卡，Rank 标识卡上的进程',p:['Node 指一台服务器。本页按每 Node 8 张 NPU、一卡一 Rank 画出完整数量：Prefill 单元含 4 个 Node、32 个 Rank；Decode 单元含 18 个 Node、144 个 Rank。切换下方阶段可查看所有服务器及其内部 Rank，编号在两个单元内分别从 0 开始。','这些数量关系取自 DeepSeek 2025 年 2 月公开的 V3/R1 部署快照，原始硬件为 H800。图中统一采用 NPU 作教学映射，不主张相同配置已经在 NPU 上复现，也不代表 2026 年线上部署。','路由专家跨整个单元形成 EP32 或 EP144；MLA 与共享专家使用同一组设备进行数据并行，因此 EP 和 DP 的数量不相乘。紧凑图元仅居中显示进程编号；点击可查看所属 Node、本地 NPU 编号和并行关系。'],f:'Prefill：4 Node × 8 NPU = 32 Rank\nDecode：18 Node × 8 NPU = 144 Rank\nNode → NPU → 绑定进程 Rank'});
Object.assign(slides.find(s=>s.id==='clusters'),{p:['图中将两个集群逐层展开为资源池、部署单元、服务器 Node 和 NPU Rank。为便于逐个阅读，教学配置固定为每个集群一个 P 单元和一个 D 单元，每单元两台服务器，每台四张 NPU；两集群合计 8 个 Node、32 个 Rank。','入口首先选择集群；请求在该集群的 P 单元完成 Prefill，再把各层缓存与请求状态交给 D 单元。单元内部的 EP 交换发生在其两个 Node 的高速网络中，P/D 状态交接与单层专家通信是不同粒度的通信。','两个单元各自独立编号，所以 rank 0 必须结合集群名和 P/D 单元定位。这里的多集群与缩小规模均为教学方案，不是 DeepSeek 已公开的跨地域拓扑；卡数也不代表实际部署该模型所需容量。'],f:'两集群 × 两单元 × 两 Node × 四 NPU\n= 32 Rank（一卡一进程假设）\n请求路由 → KV 交接 → 单元内 EP'});
Object.assign(slides.find(s=>s.id==='scale'),{p:['本例将两个服务副本分别部署在 Node A、B，各使用四张 NPU，并组成独立进程组，因此 Replica A 与 Replica B 都从 R00 编到 R03；完整身份需要同时包含副本名和进程编号。这是明确的教学选择，不要求所有 serving 实现都采用独立编号。','每个副本采用 PP2 × TP2：Stage 0 保存 Layer 0–1，Stage 1 保存 Layer 2–3；每个 Stage 的两个 TP 位置承担主要投影参数的不同分片，Norm 等小参数可复制。两个副本各持有一套完整模型，分别处理请求 A、B。'],f:'Replica A：R00–R03，独立编号\nReplica B：R00–R03，独立编号\n每副本 PP2 × TP2 = 4 个进程'});
Object.assign(slides.find(s=>s.id==='tp'),{p:['上方 2×8 网格仅用于说明完整 F 维坐标如何分配，本例 T=2、F=8。TP position 0 负责列 0–3，position 1 负责列 4–7；R00、R01 是这个副本中两个进程的编号，分片职责来自 TP 位置。','两进程读取相同输入 X，用 gate/up 的列分片直接生成各自 2×4 的中间结果，不先计算完整 2×8 再切开。随后本地结果乘 down 权重的对应行分片，各得到 [2,H] 部分和。','AllReduce 在 TP 组内逐元素求和，两进程都拿到相同完整输出。这里合并数值贡献，不拼接 H 维向量；下一步可继续残差相加。'],f:'逻辑分配：F[0:4] / F[4:8]\n本地真实张量：每端 [2,4]\nAllReduce 后：每端 [2,H]'});
Object.assign(slides.find(s=>s.id==='pp'),{p:['同一副本使用四个进程：R00、R01 属于 Stage 0 的 TP 组，R02、R03 属于 Stage 1 的 TP 组。每个 Stage 持有不同层；两个 Stage 都有 TP position 0、1，但它们对应不同进程。','本页明确采用复制态边界激活：Stage 0 的两个进程在层内 AllReduce 后各持有相同 [T,H]，通过 R00→R02 和 R01→R03 两条点对点通道发送。图中 ×2 表示两份相同数据，不是两批请求或两份特征分片。','P2P 传输的是前半层算出的 hidden states，即中间特征矩阵。下游从该结果继续后半层计算；采用分片边界的实现会改变载荷和发送方式，两路复制传输不是 PP 的固定规则。'],f:'Stage 0：TP group {R00,R01}\nStage 1：TP group {R02,R03}\n本例 P2P：R00→R02，R01→R03'});
Object.assign(slides.find(s=>s.id==='ep'),{p:['本页只追踪 Token A：它当前位于 R00，Router 选择由 R01 持有的 Expert 0 和由 R02 持有的 Expert 2。Dispatch 将完整 H 维输入复制到这两个专家所在进程；各专家使用本地参数计算。','专家输出沿返回路径回到 R00，Combine 按路由系数加权合并；最终输出仍在 R00 区域内。源和目标是相对于当前 Token 的临时角色，其他 Token 可以从 R01 或 R02 发起路由。','三个纵向区域表示进程归属，纵向排列只表示依赖先后，不编码耗时。这里展示单 Token 的三进程教学例，不表示所有 Rank 的完整专家分布。'],f:'当前持有：R00 / Token A\n专家持有：R01 / E0，R02 / E2\n返回位置：R00 / 合并结果'});

function knowledge(label,kind){
const exact={'Norm 1':'对每个 Token 的 H 维输入做归一化，再送入 Attention；可训练缩放参数 γ1 在推理中固定。','Norm 2':'对 Attention 残差合并后的特征做归一化，再输入 FFN 或 MoE。','Linear 投影':'将输入 X [T,H] 与参数 W [H,F] 相乘，得到 [T,F]；Token 行数不变，特征列数改变。','Embedding':'按 Token ID 从词表参数中取出对应向量，组成 [T,H] 隐藏特征。','Gate 投影':'输入 [T,H] 乘 Wgate [H,F]，产生后续 SiLU 门控分支的 [T,F] 特征。','Up 投影':'输入 [T,H] 乘 Wup [H,F]，得到与 gate 分支逐元素相乘的 [T,F] 特征。','SiLU':'对 gate 分支的每个元素应用 x·sigmoid(x)，形成连续门控信号，形状保持 [T,F]。','Down 投影':'将门控后的 [T,F] 特征乘 Wdown [F,H]，恢复为可与残差相加的 [T,H]。','MLA':'当前查询读取压缩潜变量与位置键；利用投影权重或等价的权重吸收计算注意力，避免持久缓存展开后的所有头 K/V。','Attention':'Q 与可见历史 K 计算匹配分数，归一化后对 V 加权求和；输出投影将多头结果映射回 H 维。','LM Head':'将最后位置的 H 维隐藏向量投影到 V 维词表 logits；后续选择策略据此选出一个 Token ID。','AllReduce':'参与 Rank 将同位置的部分结果逐元素求和，每个 Rank 都取得相同的完整结果。','本地计算':'此处以一个本地算子为例：激活进入绑定该 Rank 的 NPU，读取本地参数并产生下一份激活。'};
Object.assign(exact,{
'Q / K / V 投影':'归一化输入分别乘 Wq、Wk、Wv。Q 表达当前位置要查找的内容，K 用于匹配，V 提供被加权读取的内容；每个注意力头有自己的特征分量。',
'Q、K 位置变换':'采用 RoPE 时，按 Token 位置旋转 Q、K 的指定分量，使匹配分数包含相对位置信息；V 不在这一步执行相同的位置旋转。',
'QKᵀ → Mask → Softmax':'Q 与 K 的转置相乘形成位置间匹配分数；因果掩码屏蔽未来位置，Softmax 将每个查询行归一化为注意力系数。',
'A · [heads,T,T]':'每个头有一张查询位置 × 键位置的注意力系数矩阵；每个有效查询行归一化为和为 1 的权重，用于对 V 加权。Decode 时查询长度与历史键长度可不同。',
'A V → 输出投影':'注意力系数 A 对各头 V 加权求和，再合并各头并乘 Wo，得到 H 维分支输出，供残差相加。',
'Layer 0 → … → L−1':'输入依次经过全部 L 个模型层，每层各有自己的参数与 KV 状态；层间传递 H 维特征，不能跳过前层直接计算后层。',
'最终 Norm → 取末位置':'将末层隐藏特征归一化，生成时取最后一个已处理位置的向量 [1,H]，交给 LM Head 预测下一位置。',
'LM Head / 选择':'先将最后隐藏向量 [1,H] 投影为词表 logits [1,V]，再按 greedy 或采样规则选出一个 Token ID；新 ID 下一轮经 Embedding 和全部模型层。',
'Router → Top-2':'输入向量乘路由参数得到各专家分数，选择分数最高的两个专家，并产生合并时使用的动态系数；图中只追踪一个 Token。',
'Prefill':'整段已知提示词经过所有层，以因果注意力并行处理各位置；保存每层 KV，并从最后位置预测首个新 Token。',
'Prefill 资源池':'为提示词阶段分配执行单元。单元处理提示位置并建立请求的各层 KV；完成后将必要状态交给 Decode 资源池。',
'Decode 资源池':'接收已经建立的请求缓存，反复处理新增位置并输出下一个 Token；保持请求状态直至停止，随后释放无引用缓存。',
'请求 A · 逐层缓存':'请求 A 在每层分别保存历史注意力状态。Layer 0 只使用 KV0，Layer 1 只使用 KV1；缓存长度随已处理位置增长，不包含刚选出但尚未送回模型的 Token。',
'中间结果 · [T,F]':'Linear 将 T 个位置各自的 H 维向量投影成 F 维，因此行数 T 保持不变、特征宽度变为 F。',
'G · [T,F]':'Gate 投影输出，下一步逐元素应用 SiLU，作为调节 up 分支的门控值。',
'U · [T,F]':'Up 投影输出，与 SiLU(gate) 的相同位置逐元素相乘。',
'Gated · [T,F]':'SiLU(gate) 与 up 的逐元素乘积，仍有 T 行、F 列；随后乘 Wdown 恢复 H 维。',
'logits · [1,V]':'词表 V 个候选 Token 的未归一化分数。最高分选择或温度、top-k、top-p 等采样规则把这些分数转换成一个输出 ID。',
'E · [V,H]':'Embedding 参数表，共 V 个 Token，每个 Token 对应一行 H 维向量。根据输入 ID 索引行，不是将 ID 当作连续特征相乘。'
});
if(exact[label])return exact[label];
const p=slides[index];
if(label.startsWith('选中：'))return '本轮选择的 Token 为 '+label.slice(3)+'。若为 EOS 则触发停止；否则送回模型完成下一轮前向，再预测后续 Token。';
if(label.startsWith('α'))return '该专家的 H 维输出乘以 Router 产生的标量系数 α；系数广播到每个特征，多个被选专家的加权结果随后逐元素相加。';
if(/^E[0-9]/.test(label)||label.includes('专家输出'))return '本地专家 FFN 对同一个 Token 的完整 H 维输入执行计算，得到 H 维输出。输出需返回源 Rank 按路由系数合并。';
if(label.includes('合并输出')||label.includes('rank 00 · 输出'))return '被选专家的 H 维输出按路由系数加权相加，恢复这个 Token 的完整 MoE 分支结果 [1,H]，随后进入残差相加。';
if(label.includes('本副本输出'))return '当前请求经过该副本的全部 Stage 后得到生成结果。另一副本同时承接独立请求，两副本的生成状态与 KV 分开保存。';
if(label.includes('流式输出'))return '选出的 Token 交给 detokenizer 按序转换为文本片段并返回客户端；持续返回片段使用户不必等待整个响应生成完毕。';
if(label.includes('[1,H]'))return '一个位置的 H 维特征向量。这里承接模型或本地计算的输出；进入 LM Head 时，它将用于预测下一位置的词表分数。';
if(label.includes('输入 y'))return '上一轮已选出的 Token ID，本轮先查 Embedding，再经过全部模型层；其 K/V 在本轮才追加到各层缓存。';
if(label.includes('输出 y')||label.includes('本轮输出')||label.includes('Token y')||label.includes('首 Token')||label.includes('下一 Token'))return '根据当前最后位置的隐藏特征选择的新 Token ID。它还未参与模型前向，下轮作为输入时才产生自身的各层 KV。';
if(label.includes('Prompt')||label.includes('提示')||label.includes('Token ID')||label.includes('示例 ID'))return '已知上下文的 Token ID 序列，每个 ID 对应词表条目。Embedding 将 ID 查表转换为特征，Prefill 处理这些位置并初始化各层缓存。';
if(label.includes('KV'))return label+' 保存当前请求的历史注意力状态。各层单独维护，新增位置读取本层历史并追加自己的状态；生成结束后按引用关系回收。';
if(label.includes('W')||label.includes('权重')||label.includes('γ'))return label+' 是训练得到的固定参数；在当前推理中读取并参与投影或缩放，参数值不随生成轮次更新。';
if(label.includes('[T,H]'))return label+' 包含 T 个位置、每个位置 H 个特征；上下游计算改变特征数值，残差合并前保持相同形状。';

return label+'：'+p.p[0];
}
function op(x,y,label,w=260,desc='',jump){return hit(label,desc||knowledge(label,'op'),`<rect class="op" x="${x-w/2}" y="${y}" width="${w}" height="48" rx="24"/><text class="op-label" x="${x}" y="${y+24}" text-anchor="middle">${esc(label)}</text>`,jump)}
function tensor(x,y,label,w=260,color=B,desc=''){let s=`<rect x="${x-w/2}" y="${y}" width="${w}" height="35" rx="6" fill="#131313" stroke="${color}" stroke-width="1.2"/>`;const cols=Math.floor((w-10)/14),left=x-cols*14/2+1.5;for(let r=0;r<2;r++)for(let c=0;c<cols;c++)s+=`<rect x="${left+c*14}" y="${y+5+r*14}" width="11" height="11" fill="${color}" opacity=".22"/>`;s+=`<text x="${x}" y="${y+23}" text-anchor="middle" style="fill:${color};font-size:14px;paint-order:stroke;stroke:#131313;stroke-width:4px">${esc(label)}</text>`;return hit(label,desc||knowledge(label,'tensor'),s)}
function comm(x,y,label,w=260,desc=''){return hit(label,desc||knowledge(label,'comm'),`<rect x="${x-w/2}" y="${y+4}" width="${w}" height="46" rx="23" fill="#292929"/><rect x="${x-w/2-4}" y="${y}" width="${w+8}" height="54" rx="27" fill="none" stroke="white" stroke-width="2" stroke-dasharray="6 5"/><text class="op-label" x="${x}" y="${y+27}" text-anchor="middle">${esc(label)}</text>`)}
function path(d,color=B,dash=false){return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" ${dash?'stroke-dasharray="6 5"':''} marker-end="url(#${color===G?'gold':color===W?'white':'blue'}-${index})"/>`}
function arrow(x,y,a,b,c=B,d=false){return path(`M${x} ${y} L${a} ${b}`,c,d)}
function circle(x,y,mul=false){return hit(mul?'逐元素乘法':'残差／逐元素相加',mul?'将相同位置的元素相乘；路由系数为标量时，广播到该专家输出的全部特征。':'输入张量按对应位置相加，输出 shape 不变。残差路径保留当前子层的输入。',`<circle cx="${x}" cy="${y}" r="${mul?24:19}" fill="#111" stroke="#ddd" stroke-width="1.6"/>${tx(x,y+(mul?10:7),mul?'×':'＋',W,mul?30:24)}`)}
function frame(x,y,w,h,label,desc='',jump){return hit(label||'进程执行范围',desc||knowledge(label,'frame'),`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="#484848"/><text x="${x+16}" y="${y+27}" class="small">${esc(label)}</text>`,jump)}
function rankOwned(x,y,w,h,r,role='',desc=''){
let body=`<rect class="rank-outline" x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#393939"/>`;
for(const dx of [16,w-16])for(const dy of [16,h-16])body+=`<circle class="rank-pin" cx="${x+dx}" cy="${y+dy}" r="5" fill="#2b2b2b"/>`;
body+=`<text class="rank-label" x="${x+w/2}" y="${y+43}" text-anchor="middle">R${String(r).padStart(2,'0')}</text>`;
if(role)body+=tx(x+w/2,y+75,role,W,17);
return hit('R'+String(r).padStart(2,'0'),desc||'此容器内的参数、激活与操作属于这个进程。编号需结合副本或部署单元范围识别；设备绑定见本页说明。',body).replace('class="hit"','class="hit rank rank-container"')}
function rankNode(x,y,w,h,label,compact=false,desc='',jump,device=null){
const id=label.replace(/rank\s*0*(\d+)/i,(_,n)=>'R'+String(+n).padStart(2,'0'));
if(!compact)return rankOwned(x,y,w,h,+(label.match(/\d+/)||[0])[0],'',desc);
const rw=Math.min(w,h*1.5),rh=rw/1.5;x+=(w-rw)/2;y+=(h-rh)/2;w=rw;h=rh;
let body=`<rect class="rank-outline" x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#393939"/>`;
for(const px of [x+16,x+w-16])for(const py of [y+16,y+h-16])body+=`<circle class="rank-pin" cx="${px}" cy="${py}" r="5" fill="#2b2b2b"/>`;
body+=`<text class="rank-label" x="${x+w/2}" y="${y+h/2}" text-anchor="middle" dominant-baseline="middle">${esc(id)}</text>`;
return hit(id,(desc||'这是指定进程组中的进程编号；具体并行角色由所在组决定。')+(device===null||desc.includes('NPU')?'':' 本例绑定本地 NPU '+device+'。'),body,jump).replace('class="hit"','class="hit rank rank-compact"')}
function rankLane(x,y,w,h,r,device,role){return rankOwned(x,y,w,h,r,role,'Replica A / R'+String(r).padStart(2,'0')+' / '+role+'，绑定本例 NPU '+device+'。容器内展示本地输入、权重分片、中间结果和 AllReduce 后完整输出。')}
function matrix(x,y,rows,cols,color=B,label='',active=-1){let s='';const pitch=28;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<rect x="${x+c*pitch}" y="${y+r*pitch}" width="24" height="24" fill="${color}" opacity="${active<0?.3+((r+c)%3)*.18:r===active?.85:.22}"/>`;return hit(label||'展开张量',slides[index].id==='tp'?'本例 T=2、F=8。上方完整矩阵仅解释逻辑列坐标；各 Rank 内只有实际持有的 2×4 本地张量，由分片权重直接算出，不先生成完整结果再分发。':'每一行对应一个 Token 位置，每一列对应一个特征；本例 4 个 Token 各有 8 个特征，组成 [4,8] 激活矩阵。',s+tx(x+cols*pitch/2,y+rows*pitch+23,label,color,14))}

function render(){const s=slides[index];document.body.classList.toggle('cover',index===0);document.body.classList.toggle('rounds',s.id==='journey');$('hero').hidden=index!==0;document.querySelector('.heading').hidden=index===0;document.querySelector('.workspace').hidden=index===0;$('title').textContent=s.title;$('kicker').textContent='LLM COMPUTE / '+s.group;$('section').textContent=s.group;$('count').textContent=String(index).padStart(2,'0');$('thesis').textContent=s.thesis;$('copy').innerHTML=s.p.map(p=>'<p>'+p+'</p>').join('');$('formula').textContent=s.f;$('source').innerHTML=s.src?'依据：<a target="_blank" rel="noopener" href="'+sources[s.src][1]+'">'+sources[s.src][0]+'</a>':'范围：通用机制与明确标注的教学示例；不是实际部署或实测 Trace。';$('nodeTitle').textContent='点击图元查看含义';$('nodeText').textContent='带关联细节的节点可以从此处展开对应页面。';$('jump').hidden=true;$('steps').innerHTML=slides.map((s,i)=>`<button data-page="${i}" class="${i===index?'current':''}" aria-current="${i===index?'step':'false'}">${String(i).padStart(2,'0')}<br>${s.nav}</button>`).join('');$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'返回封面 ↺':index===0?'开始阅读 →':'下一页 →';info(false);draw(true);$('info').innerHTML=`<strong>图例与阅读范围</strong><svg viewBox="0 0 320 110"><defs><marker id="inf-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="${B}"/></marker><marker id="inf-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="${G}"/></marker></defs><path d="M10 20 H80" stroke="${B}" marker-end="url(#inf-a)"/><text x="100" y="25" style="font-size:13px">激活前向传递</text><path d="M80 50 H10" stroke="${G}" stroke-dasharray="5 4" marker-end="url(#inf-g)"/><text x="100" y="55" style="font-size:13px">固定参数读取</text><rect x="10" y="73" width="70" height="26" rx="13" fill="#505050" stroke="#858585"/><text x="100" y="91" style="font-size:13px">中灰实线：计算</text></svg><div>蓝色网格：激活与 KV 状态；金色网格：权重。深灰外虚线胶囊：通信；圆形 ＋／×：逐元素运算；四角定位点的板卡形：Rank；大容器容纳本地计算与数据，紧凑节点仅居中显示 Rank 编号，设备绑定见点击说明。普通细框仍表示 Layer、Stage 或集群边界。</div><p>Rank 是指定组内的进程编号；本例一个进程绑定一张 NPU。副本和部署单元的编号范围均在图中标出。四角圆点仅是系列识别特征；图元标识进程，设备绑定另行标注，不编码硬件型号或容量。</p><p>底纹格数不承诺真实 shape；带数值的维度、概率和时间均按本页说明解读。基线为自回归 decoder-only 推理，无反向与参数更新。普通 KV 与 MLA 分开处理。</p><p>点击或 Tab＋Enter 查看释义，使用 ± 放大缩小，拖动画布移动，Fit 恢复。左右方向键翻页。</p>`;let nav=$('steps'),b=nav.children[index];if(b)nav.scrollLeft=b.offsetLeft-nav.offsetLeft-nav.clientWidth/2+b.clientWidth/2}
function go(i){index=(i+slides.length)%slides.length;render()}
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('steps').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(+b.dataset.page)};$('fit').onclick=()=>{zoom=1;panX=panY=0;view()};function scale(f){let z=Math.max(.6,Math.min(5,zoom*f)),cx=bounds[0]/zoom/2-panX,cy=bounds[1]/zoom/2-panY;zoom=z;panX=bounds[0]/zoom/2-cx;panY=bounds[1]/zoom/2-cy;view()}$('plus').onclick=()=>scale(1.3);$('minus').onclick=()=>scale(1/1.3);$('infoBtn').onclick=()=>info($('info').hidden);document.addEventListener('click',e=>{if(!e.target.closest('#info')&&!e.target.closest('#infoBtn'))info(false)});
$('controls').onclick=e=>{let b=e.target.closest('[data-action]');if(!b)return;let[k,v]=b.dataset.action.split(':');if(k==='ds')dsPhase=+v;if(k==='journey')journeyLayers=!!+v;if(k==='query')query=+v;if(k==='sample')sampling=+v;if(k==='round')round=+v;if(k==='batch')batch=+v;if(k==='moe')moeToken=+v;if(k==='cluster')cluster=+v;if(k==='depth')depth=+v;if(k==='mode')mode=v;draw(k==='depth'||k==='journey'||k==='ds')};function values(e){const k=e.target.dataset.slider||e.target.dataset.select;if(!k)return;const v=+e.target.value;if(k==='memB')memB=v;if(k==='memS')memS=v;if(k==='queue')queue=v;if(k==='transfer')transfer=v;draw()}$('controls').addEventListener('change',values);
$('canvas').onclick=e=>{if(suppress){suppress=false;return}const g=e.target.closest('[data-node]');if(g)select(g.dataset.node)};$('canvas').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-node]');if(g){e.preventDefault();select(g.dataset.node)}}};document.addEventListener('keydown',e=>{if(e.key==='Escape')info(false);if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});
$('canvas').addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};suppress=false});$('canvas').addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)<5&&!drag.moved)return;drag.moved=true;const r=$('canvas').getBoundingClientRect(),factor=Math.max(bounds[0]/zoom/r.width,bounds[1]/zoom/r.height);panX=drag.px+dx*factor;panY=drag.py+dy*factor;view()});window.addEventListener('pointerup',()=>{if(drag)suppress=drag.moved;drag=null});window.addEventListener('pointercancel',()=>drag=null);render();
</script></html>
