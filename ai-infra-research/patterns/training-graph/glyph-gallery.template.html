<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵衢 · 物理图元优化</title><style>
/*__SOURCE_CSS__*/
:root{color-scheme:light;--paper:#F8F8F8;--surface:#F8F8F8;--ink:#292929;--muted:#777;--line:#ddd;--device-paper:#F8F8F8;--device-base:#999999;--device-surface:#eee;--device-ink:#303030;--device-muted:#999999;--device-chip:#555555;--device-die:#AAAAAA;--device-metal:#D6D6D6;--device-board:#E4E4E4;--device-contact:#898989}:root[data-theme=dark]{color-scheme:dark;--paper:#111;--surface:#1a1a1a;--ink:#eee;--muted:#aaa;--line:#333;--device-paper:#151515;--device-base:#777777;--device-surface:#292929;--device-ink:#ccc;--device-muted:#777;--device-chip:#333333;--device-die:#777777;--device-metal:#B2B2B2;--device-board:#232323;--device-contact:#AAAAAA}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"PingFang SC",sans-serif}header{padding:30px 36px 14px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:27px;font-weight:450}header p,footer{color:var(--muted);font-size:12px}header p{margin:4px 0 0}button,input{font:inherit;color:inherit;border:0}button{background:transparent;cursor:pointer;border-radius:24px;padding:7px 12px;white-space:nowrap}button:hover{background:var(--line)}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:focus-visible,input:focus-visible{outline:0;text-decoration:underline;background:var(--line);color:var(--ink)}nav{position:sticky;top:0;z-index:4;background:var(--paper);display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 36px}.pills{display:flex;gap:3px;background:var(--surface);border-radius:28px;padding:4px;max-width:100%;overflow-x:auto}input{background:var(--surface);border-radius:24px;padding:10px 14px;width:210px;max-width:100%}#count{font:11px ui-monospace,monospace;color:var(--muted);margin-left:auto}main{padding:0 36px 50px}.section{margin-bottom:40px}.section h2{font-size:16px;font-weight:450;padding:16px 0 12px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}article{min-width:0;padding:16px 0 24px;border-bottom:1px solid var(--line)}.card-button{display:block;width:100%;padding:0;border-radius:0;text-align:left;white-space:normal}.card-button:hover{background:transparent}.identity{display:flex;justify-content:space-between;align-items:baseline;gap:12px}h3{font-size:15px;font-weight:450;margin:0 0 12px}.identity small{font:10px ui-monospace,monospace;color:var(--muted)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.art{height:195px;display:grid;place-items:center;min-width:0;overflow:hidden;border-radius:4px}.art>svg{display:block;width:100%;height:100%;overflow:hidden}.art svg{display:block!important}.original-art{background:#111;color:#eee}.new-art{background:var(--surface)}.pair-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}.pair-labels span:last-child{color:var(--ink)}.hardware .art>svg{width:160px;height:160px}.new-art .review-structure{fill:none;stroke:var(--device-ink);stroke-width:1}.new-art .review-board{fill:var(--device-board);stroke:var(--device-muted);stroke-width:1}.new-art .review-label{fill:var(--device-ink);font:12px system-ui}.new-art :is(.p-plane,.b-plane){fill:none;stroke:var(--device-muted);stroke-width:.3}.new-art :is(.p-sp,.p-pod){fill:var(--device-paper);stroke:var(--device-muted);stroke-width:.2}.new-art :is(.p-npu,.p-board){fill:transparent;stroke:none}.new-art :is(.p-colhd text,.p-planelabel,.p-sw1label,.p-rocelabel,.p-splabel){fill:var(--device-ink);font-size:2px}.new-art :is(.p-links line,.p-links path,.b-links line,.b-links path,.rel line,.rel path){fill:none;stroke:var(--device-muted);stroke-width:.65}.new-art .lkc{display:none}.new-art .b-nodes rect{fill:transparent;stroke:none}.new-art :is(.b-lbl,.b-npul,.b-nodes text){fill:var(--device-ink);font-size:9px}.new-art :is(.b-pcie,.rel-pcie){stroke-dasharray:1 2}.new-art :is(.b-roce,.rel-roce){stroke-dasharray:3 3}.new-art :is(.b-ub,.rel-ub){stroke-dasharray:6 4}.new-art :is(.b-sw2,.p-npustrip){fill:var(--device-chip)}.original-art .rel line,.original-art .rel path{fill:none;stroke-width:1}dialog{padding:24px;border:0;border-radius:16px;background:var(--paper);color:var(--ink);width:min(1100px,calc(100vw - 28px));max-height:calc(100svh - 28px);overflow:auto}dialog::backdrop{background:#0008}dialog header{padding:0 0 18px}dialog h2{font-size:21px;font-weight:450;margin:0}dialog .art{height:330px}dialog p{font-size:13px;color:var(--muted)}dialog dt{font-size:11px;color:var(--muted);margin-top:12px}dialog dd{font-size:12px;margin:2px 0;overflow-wrap:anywhere}article.selected h3{background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:16px}footer{padding:0 36px 24px}#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:7px;max-width:270px;font-size:12px}[hidden]{display:none!important}@media(max-width:750px){header,nav{padding-left:18px;padding-right:18px}main{padding:0 18px 40px}.grid{grid-template-columns:1fr}.art{height:180px}nav{position:relative;gap:10px}h1{font-size:23px}dialog .art{height:200px}#count{margin-left:0}}

.hardware .art{height:196px}dialog.hardware-detail{width:min(620px,calc(100vw - 28px))}dialog.hardware-detail .art{height:196px}
@media(max-width:540px){dialog.hardware-detail .pair{grid-template-columns:1fr}}
.hardware .original-art,dialog.hardware-detail .original-art{background:var(--surface)}
.hardware[data-id="H-sw"]{grid-column:1/-1}:root{--glyph-dark-display:none;--glyph-light-display:inline}:root[data-theme="dark"]{--glyph-dark-display:inline;--glyph-light-display:none}[data-asset-theme="dark"]{display:var(--glyph-dark-display)}[data-asset-theme="light"]{display:var(--glyph-light-display)}dialog.switch-detail{width:min(1000px,calc(100vw - 24px))}@media(max-width:750px){.hardware[data-id="H-sw"] .pair,dialog.switch-detail .pair{grid-template-columns:1fr}dialog.switch-detail{width:calc(100vw - 12px);padding:12px}.hardware[data-id="H-sw"] .art>svg,dialog.switch-detail .art>svg{max-width:100%;height:auto!important;aspect-ratio:349/160}}
.demo-comparison{grid-column:1/-1}.demo-comparison .art{height:430px}.demo-art{--fg:#eee;--communication-color:#FF9500}.demo-art .physical-sections rect{fill:#ffffff05}.demo-comparison .new-art{background:#111}.demo-comparison .art .demo-art{color:#eee}dialog:has(.demo-art){width:min(1440px,calc(100vw - 28px))}dialog:has(.demo-art) .art{height:500px}.demo-comparison .art,dialog.demo-detail .art{background:var(--surface)}.demo-comparison .original-art .demo-art text,dialog.demo-detail .original-art .demo-art text{fill:var(--ink)!important}.single-specimen .pair{grid-template-columns:1fr}.single-specimen .pair>.original-art,.single-specimen .pair-labels{display:none}
:root[data-theme=light] .demo-art .lingqu-physical text{stroke:none!important;fill:#666!important}
:root[data-theme=light] .demo-art .lingqu-physical .physical-section-title,:root[data-theme=light] .demo-art .lingqu-physical .is-selected text{fill:#292929!important}
:root[data-theme=light] .demo-art .lingqu-physical .b-plane{fill:#E7E7E7!important;stroke:#D5D5D5!important}
:root[data-theme=light] .demo-art .lingqu-physical .b-sw2{fill:#999!important}
:root[data-theme=light] .demo-art .lingqu-physical :is(.b-links,.p-links,.rel) :is(line,path){stroke:rgba(0,0,0,.4)!important}
:root[data-theme=light] .demo-art .lingqu-physical :is(#b-lkp,#p-lkp) circle{fill:rgba(0,0,0,.4)!important}
</style></head><body><!--__HW_SYMBOLS__--><header><div><h1>灵衢 · 物理图元优化</h1><p>器件同倍率呈现 · 交换机保留横向比例 · 原版对比。</p></div><button id="theme" data-tip="切换浅色工程图与深色画布">深色预览</button></header><nav aria-label="图元筛选"><div id="filters" class="pills"></div><input id="search" type="search" aria-label="搜索灵衢图元" placeholder="搜索名称、用途或来源" data-tip="仅搜索灵衢引入的物理图元"><span style="font-size:11px;color:var(--muted)">器件基准 160</span><small id="count"></small></nav><main id="inventory"></main><p id="empty" hidden>没有匹配图元</p><footer>仅收录 lingqu-rank-map 的物理器件与结构；连线只在组合图中表达，不单独陈列。器件保留原版对比；Demo 最新组合直接复用当前实现。</footer><dialog id="inspector"><header><h2 id="detail-name"></h2><button id="close" aria-label="关闭详情" data-tip="关闭详情，返回原位置">×</button></header><div class="pair"><div id="detail-before" class="art original-art"></div><div id="detail-after" class="art new-art"></div></div><div class="pair-labels"><span>原版</span><span>优化版</span></div><p id="detail-meaning"></p><dl><dt>设计调整</dt><dd id="detail-change"></dd><dt>来源</dt><dd id="detail-source"></dd><dt>表达口径</dt><dd>轮廓与内部色块用于类别识别，不表示具体型号、内部数量或端口规格。</dd></dl></dialog><div id="tip" hidden></div><script>/*__RENDERER__*/</script><script>
const items=/*__ITEMS__*/;
let category='全部';const categories=['全部',...new Set(items.map(i=>i.category))];
function art(i,after=false){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');n.setAttribute('viewBox','0 0 8 8');n.setAttribute('role','img');n.setAttribute('aria-label',i.name+(after?'优化版':'原版'));if(i.notes.type){n.dataset.fixedIcon='';n.style.width='160px';n.style.height='160px';const f=after?LingquDeviceGlyphsV2.frame(i.notes.type):{width:160,height:160};n.style.width=f.width+'px';n.setAttribute('viewBox','0 0 '+f.width+' 160');}n.innerHTML='<g data-measure'+(i.notes.demo?' class="demo-art"':'')+'>'+(after?i.after:i.before)+'</g>';if(i.notes.demo){const prefix=i.id+'-'+(after?'after':'before')+'-'+Math.random().toString(36).slice(2);n.innerHTML=n.innerHTML.replaceAll('ep-copper-',prefix+'-ep-copper-');}n.querySelectorAll('title').forEach(t=>t.remove());n.querySelectorAll('[data-tip]').forEach(t=>t.removeAttribute('data-tip'));n.querySelectorAll('svg[viewBox]').forEach(s=>{if(s.hasAttribute('data-user-glyph'))return;const b=s.getAttribute('viewBox').split(/[ ,]+/).map(Number);s.setAttribute('width',b[2]);s.setAttribute('height',b[3]);s.style.display='block'});return n}
function fit(root=document){root.querySelectorAll('.art>svg').forEach(n=>{if(!n.getBoundingClientRect().width||n.dataset.fixedIcon!==undefined)return;try{const b=n.querySelector('[data-measure]').getBBox(),p=Math.max(b.width,b.height)*.07+1;n.setAttribute('viewBox',`${b.x-p} ${b.y-p} ${Math.max(8,b.width)+p*2} ${Math.max(8,b.height)+p*2}`)}catch{}})}
function filter(){const q=document.querySelector('#search').value.trim().toLowerCase();let count=0;document.querySelectorAll('article').forEach(a=>{const i=items.find(i=>i.id===a.dataset.id),show=(category==='全部'||i.category===category)&&(!q||[i.name,i.meaning,i.source].join(' ').toLowerCase().includes(q));a.hidden=!show;if(show)count++});document.querySelectorAll('.section').forEach(s=>s.hidden=![...s.querySelectorAll('article')].some(a=>!a.hidden));document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));document.querySelector('#count').textContent=count+' / '+items.length;document.querySelector('#empty').hidden=!!count;requestAnimationFrame(()=>fit())}
function show(i){document.querySelector('#inspector').classList.toggle('demo-detail',!!i.notes.demo);document.querySelector('#inspector').classList.toggle('single-specimen',!!i.notes.single);document.querySelector('#inspector').classList.toggle('hardware-detail',!!i.notes.type);document.querySelector('#inspector').classList.toggle('switch-detail',i.notes.type==='sw');document.querySelectorAll('article').forEach(a=>a.classList.toggle('selected',a.dataset.id===i.id));document.querySelector('#detail-name').textContent=i.name;document.querySelector('#detail-meaning').textContent=i.meaning;document.querySelector('#detail-change').textContent=i.notes.change;document.querySelector('#detail-source').textContent=i.source+(i.notes.replacementSource?'；优化版：用户提供 '+i.notes.replacementSource:'');document.querySelector('#detail-before').replaceChildren(art(i));document.querySelector('#detail-after').replaceChildren(art(i,true));document.querySelector('#inspector').showModal();document.querySelector('#tip').hidden=true;requestAnimationFrame(()=>fit(document.querySelector('#inspector')))}
document.querySelector('#filters').innerHTML=categories.map(c=>`<button data-category="${c}" aria-pressed="${c===category}" data-tip="查看${c}">${c}</button>`).join('');
for(const c of categories.slice(1)){const section=document.createElement('section');section.className='section';section.innerHTML=`<h2>${c}</h2><div class="grid"></div>`;for(const i of items.filter(i=>i.category===c)){const a=document.createElement('article');a.dataset.id=i.id;if(i.notes.type)a.className='hardware';if(i.notes.demo)a.className='demo-comparison';if(i.notes.single)a.classList.add('single-specimen');const b=document.createElement('button');b.className='card-button';b.setAttribute('aria-label','对比'+i.name);b.dataset.tip='放大对比图元与设计调整';b.innerHTML=`<div class="identity"><h3>${i.name}</h3><small>${i.notes.family||i.id}</small></div><div class="pair"><div class="art original-art"></div><div class="art new-art"></div></div><div class="pair-labels"><span>原版</span><span>优化版</span></div>`;b.querySelector('.original-art').append(art(i));b.querySelector('.new-art').append(art(i,true));b.onclick=()=>show(i);a.append(b);section.querySelector('.grid').append(a)}document.querySelector('#inventory').append(section)}
document.querySelector('#filters').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;filter()}};document.querySelector('#search').oninput=filter;document.querySelector('#close').onclick=()=>document.querySelector('#inspector').close();document.querySelector('#theme').onclick=()=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'light';document.querySelector('#theme').textContent=d?'浅色预览':'深色预览'};
function tip(e){const n=e.target.closest('[data-tip]'),t=document.querySelector('#tip');t.hidden=!n;if(n){const r=n.getBoundingClientRect();t.textContent=n.dataset.tip;t.style.left=Math.max(8,Math.min(innerWidth-280,r.left))+'px';t.style.top=Math.max(8,r.top-40)+'px'}}document.addEventListener('pointerover',tip);document.addEventListener('focusin',tip);document.addEventListener('focusout',()=>document.querySelector('#tip').hidden=true);window.addEventListener('resize',()=>fit());filter();document.fonts.ready.then(()=>fit());
</script></body></html>
