let category='全部';const categories=['全部',...new Set(items.map(i=>i.category))];
function art(i,after=false){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');n.setAttribute('viewBox','0 0 8 8');n.setAttribute('role','img');n.setAttribute('aria-label',i.name+(after?'优化版':'原版'));if(i.notes.type){n.dataset.fixedIcon='';n.style.width='160px';n.style.height='160px';const f=after?LingquDeviceGlyphsV2.frame(i.notes.type):{width:160,height:160};n.style.width=f.width+'px';n.setAttribute('viewBox','0 0 '+f.width+' 160');}n.innerHTML='<g data-measure'+(i.notes.demo?' class="demo-art"':'')+'>'+(after?i.after:i.before)+'</g>';if(i.notes.demo){const prefix=i.id+'-'+(after?'after':'before')+'-'+Math.random().toString(36).slice(2);n.innerHTML=n.innerHTML.replaceAll('ep-copper-',prefix+'-ep-copper-');}n.querySelectorAll('title').forEach(t=>t.remove());n.querySelectorAll('[data-tip]').forEach(t=>t.removeAttribute('data-tip'));n.querySelectorAll('svg[viewBox]').forEach(s=>{if(s.hasAttribute('data-user-glyph'))return;const b=s.getAttribute('viewBox').split(/[ ,]+/).map(Number);s.setAttribute('width',b[2]);s.setAttribute('height',b[3]);s.style.display='block'});return n}
function fit(root=document){root.querySelectorAll('.art>svg').forEach(n=>{if(!n.getBoundingClientRect().width||n.dataset.fixedIcon!==undefined)return;try{const b=n.querySelector('[data-measure]').getBBox(),p=Math.max(b.width,b.height)*.07+1;n.setAttribute('viewBox',`${b.x-p} ${b.y-p} ${Math.max(8,b.width)+p*2} ${Math.max(8,b.height)+p*2}`)}catch{}})}
function filter(){const q=document.querySelector('#search').value.trim().toLowerCase();let count=0;document.querySelectorAll('article').forEach(a=>{const i=items.find(i=>i.id===a.dataset.id),show=(category==='全部'||i.category===category)&&(!q||[i.name,i.meaning,i.source].join(' ').toLowerCase().includes(q));a.hidden=!show;if(show)count++});document.querySelectorAll('.section').forEach(s=>s.hidden=![...s.querySelectorAll('article')].some(a=>!a.hidden));document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));document.querySelector('#count').textContent=count+' / '+items.length;document.querySelector('#empty').hidden=!!count;requestAnimationFrame(()=>fit())}
function show(i){document.querySelector('#inspector').classList.toggle('demo-detail',!!i.notes.demo);document.querySelector('#inspector').classList.toggle('single-specimen',!!i.notes.single);document.querySelector('#inspector').classList.toggle('hardware-detail',!!i.notes.type);document.querySelector('#inspector').classList.toggle('switch-detail',i.notes.type==='sw');document.querySelectorAll('article').forEach(a=>a.classList.toggle('selected',a.dataset.id===i.id));document.querySelector('#detail-name').textContent=i.name;document.querySelector('#detail-meaning').textContent=i.meaning;document.querySelector('#detail-change').textContent=i.notes.change;document.querySelector('#detail-source').textContent=i.source+(i.notes.replacementSource?'；优化版：用户提供 '+i.notes.replacementSource:'');document.querySelector('#detail-before').replaceChildren(art(i));document.querySelector('#detail-after').replaceChildren(art(i,true));document.querySelector('#inspector').showModal();document.querySelector('#tip').hidden=true;requestAnimationFrame(()=>fit(document.querySelector('#inspector')))}
document.querySelector('#filters').innerHTML=categories.map(c=>`<button data-category="${c}" aria-pressed="${c===category}" data-tip="查看${c}">${c}</button>`).join('');
for(const c of categories.slice(1)){const section=document.createElement('section');section.className='section';section.innerHTML=`<h2>${c}</h2><div class="grid"></div>`;for(const i of items.filter(i=>i.category===c)){const a=document.createElement('article');a.dataset.id=i.id;if(i.notes.type)a.className='hardware';if(i.notes.demo)a.className='demo-comparison';if(i.notes.single)a.classList.add('single-specimen');const b=document.createElement('button');b.className='card-button';b.setAttribute('aria-label','对比'+i.name);b.dataset.tip='放大对比图元与设计调整';b.innerHTML=`<div class="identity"><h3>${i.name}</h3><small>${i.notes.family||i.id}</small></div><div class="pair"><div class="art original-art"></div><div class="art new-art"></div></div><div class="pair-labels"><span>原版</span><span>优化版</span></div>`;b.querySelector('.original-art').append(art(i));b.querySelector('.new-art').append(art(i,true));b.onclick=()=>show(i);a.append(b);section.querySelector('.grid').append(a)}document.querySelector('#inventory').append(section)}
document.querySelector('#filters').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;filter()}};document.querySelector('#search').oninput=filter;document.querySelector('#close').onclick=()=>document.querySelector('#inspector').close();document.querySelector('#theme').onclick=()=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'light';document.querySelector('#theme').textContent=d?'浅色预览':'深色预览'};
function tip(e){const n=e.target.closest('[data-tip]'),t=document.querySelector('#tip');t.hidden=!n;if(n){const r=n.getBoundingClientRect();t.textContent=n.dataset.tip;t.style.left=Math.max(8,Math.min(innerWidth-280,r.left))+'px';t.style.top=Math.max(8,r.top-40)+'px'}}document.addEventListener('pointerover',tip);document.addEventListener('focusin',tip);document.addEventListener('focusout',()=>document.querySelector('#tip').hidden=true);window.addEventListener('resize',()=>fit());filter();document.fonts.ready.then(()=>fit());
