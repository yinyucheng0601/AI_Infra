<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分布式训练 · 从模型到通信</title>
<link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="liquid-glass.css"><link rel="stylesheet" href="layer-stack-progress.css"><link rel="stylesheet" href="demo.css"></head><body>
<header><div><h1>分布式训练</h1><small>模型 → 计算 → 通信</small></div><div id="config"></div></header>
<div class="context-row"><div id="rankbar"></div><button id="info-icon" type="button" aria-label="图例与官方依据" aria-expanded="false" aria-controls="info-panel" data-tip="图例与官方依据"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></button></div>
<div id="impact" aria-live="polite"></div><main id="stage"><svg viewBox="0 0 1810 1830" aria-label="Transformer 训练推导图"><g id="world"></g></svg></main>
<div class="explanation-row"><div id="extension" hidden></div></div>
<footer><div class="evolution-bottom"><button id="play" aria-label="播放推导过程" aria-pressed="false" data-tip="播放七个推导阶段"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-symbol" d="M8 5L19 12L8 19Z"/></svg></button><div class="layer-scroll"><nav id="layer-list" class="layer-list" aria-label="推导进度，点击或拖动选择阶段"></nav><div id="stage-labels" aria-label="推导阶段"></div><div id="token-controls" aria-label="跟踪来源组 0 的 token" hidden></div><section id="secondary-control" hidden aria-label="当前步骤的参数"><div class="secondary-heading"><span id="secondary-title"></span><output id="secondary-value"></output></div><input id="secondary-input" type="range" min="0" max="2" step="1" value="2"><div id="secondary-labels"></div><small id="secondary-hint"></small></section></div></div><div id="tools" data-liquid-glass="control"><button id="minus" data-tip="缩小画布">−</button><button id="fit" data-tip="自动适配当前阶段">适应</button><button id="plus" data-tip="放大画布">＋</button></div></footer>
