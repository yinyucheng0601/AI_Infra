function baseSimulationState(t){

  if(local<3000){const q=local/3000;st={activation:PEAK_ACT*q,gradient:mb===1?0:FULL_GRAD,mb,phase:'前向',layer:Math.min(31,Math.floor(q*32)),detail:'保存激活；算子工作区和TP通信缓冲短时分配',active:'forward',q};}

  const pulse=Math.pow(Math.sin(Math.PI*st.q*4),2);

}

function makeRanks(){return Array.from({length:worldSize},(_,id)=>{const tp=id%TP,dp=Math.floor(id/TP)%DP,pp=Math.floor(id/(TP*DP));return {id,tp,dp,pp,ep:dp%EP,edp:Math.floor(dp/EP)};});}

function surfaceValue(i,z,h,free=false,a=cats[i]){

function validateConfig(c){
 if(Object.values(c).some(v=>!Number.isInteger(v)||v<1||v>512))return '所有输入必须是 1–512 的整数。';
 if(c.world!==c.tp*c.pp*c.dp)return 'World Size 必须等于 TP × PP × DP。';

 if(L%c.pp!==0)return 'PP 必须整除当前模型的 32 层。';
 if(![1,2].includes(c.ep)||c.dp%c.ep!==0)return '当前模型有 2 个专家：EP 为 1 或 2，且必须整除 DP。';
 if(c.rack%c.node!==0)return '每机柜卡数必须是每节点卡数的整数倍。';
