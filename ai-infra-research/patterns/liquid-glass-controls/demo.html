<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquid Glass · 控件与面板</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#eee;font:14px/1.6 system-ui,sans-serif}.backdrop{position:fixed;inset:0;overflow:hidden;z-index:-1;background:repeating-linear-gradient(135deg,transparent 0 78px,#ffffff24 79px 80px),radial-gradient(ellipse at 25% 25%,#8d89ee88,transparent 40%),radial-gradient(ellipse at 75% 70%,#79d4f288,transparent 40%)}.backdrop span{position:absolute;width:260px;height:320px;transform:skewY(-25deg);border:1px solid #ddd;background:linear-gradient(#444 0 40%,#8d89ee 40% 50%,#79d4f2 50% 65%,#b1ef6b 65% 80%,#222 80%)}.backdrop span:nth-child(1){left:8%;top:10%}.backdrop span:nth-child(2){left:40%;top:30%}.backdrop span:nth-child(3){right:3%;top:50%}header{padding:28px;max-width:420px}h1{font-size:26px;font-weight:500;margin:0}header p{color:#bbb}.toolbar{position:fixed;left:50%;top:36px;transform:translateX(-50%);padding:8px;display:flex;gap:6px;border-radius:999px}button{border:0;border-radius:999px;padding:10px 18px;background:transparent;color:inherit;cursor:pointer;font:inherit}button:hover{background:#ffffff20}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}button[aria-pressed=true]{background:#fff;color:#111}.icon{position:fixed;right:28px;top:36px;width:44px;height:44px;padding:0;border-radius:50%;font-size:22px}.panel{position:fixed;right:28px;top:100px;width:min(380px,calc(100vw - 56px));padding:24px;border-radius:20px}.panel h2{font-size:20px;margin:0 0 12px}.panel label{display:block;margin:18px 0 6px}.panel input{font:inherit;width:100%;padding:10px;border-radius:10px}.bottom{top:auto;bottom:28px;white-space:nowrap}.panel[hidden]{display:none}@media(max-width:850px){header{padding-top:110px}.toolbar{top:24px;left:28px;transform:none}.toolbar.bottom{top:auto;bottom:24px}.icon{top:24px}}
</style><link rel="stylesheet" href="liquid-glass.css"><script defer src="liquid-glass.js"></script></head>
<body><div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div><header><h1>Liquid Glass</h1><p>小控件保留折射，面板优先清晰阅读。背景为材质测试图形。</p></header>
<nav class="toolbar" data-liquid-glass="control" aria-label="示例模式"><button aria-pressed="true">总览</button><button aria-pressed="false">细节</button></nav>
<button class="icon" data-liquid-glass="icon" id="toggle" aria-expanded="true" aria-controls="panel" aria-label="显示或隐藏配置">⚙</button>
<aside class="panel" data-liquid-glass="panel" id="panel"><h2>配置面板</h2><p>94% 深色背板 · 18px 模糊 · 无色散。面板后有高对比图形时仍以文字读取为主。</p><label for="name">示例名称</label><input id="name" value="Liquid Glass Controls"><p>点击右上按钮测试面板开关。</p></aside>
<div class="toolbar bottom" data-liquid-glass="control"><button id="less" aria-label="减少示例读数">−</button><span data-liquid-readout id="readout">100%</span><button id="more" aria-label="增加示例读数">＋</button></div>
<script>
const toggle=document.getElementById('toggle'),panel=document.getElementById('panel');toggle.onclick=()=>{panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden));};
for(const button of document.querySelectorAll('nav button'))button.onclick=()=>{for(const item of document.querySelectorAll('nav button'))item.setAttribute('aria-pressed',String(item===button));};
let value=100;for(const [id,delta] of [['less',-10],['more',10]])document.getElementById(id).onclick=()=>{value=Math.max(10,value+delta);document.getElementById('readout').textContent=value+'%';};
</script></body></html>
