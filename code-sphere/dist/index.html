<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#252625"><title>Code Sphere — 字符球体</title>
<style>
:root{color-scheme:dark;--bg:#252625;--ink:#dedee3;--muted:#85858a;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}header{position:fixed;left:36px;top:32px;pointer-events:none}h1{font-size:12px;letter-spacing:3px;font-weight:500;margin:0 0 10px}header p{margin:0;color:var(--muted);font-size:11px;letter-spacing:1px}.topright{position:fixed;right:32px;top:28px;display:flex;gap:8px}button{color:#c9c9cf;background:transparent;border:1px solid #454647;border-radius:50%;width:36px;height:36px;cursor:pointer;font:16px monospace;transition:background 150ms ease,color 150ms ease}button:hover{background:#363737;color:white}button:focus-visible,input:focus-visible{outline:2px solid #c2b4e0;outline-offset:5px}button svg{width:14px;height:14px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.4}.bottom{position:fixed;bottom:28px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;pointer-events:none}.controls{pointer-events:auto;display:flex;align-items:center;gap:25px;padding:16px 22px;background:#292a29ed;border:1px solid #414241;border-radius:14px;backdrop-filter:blur(12px)}.separator{width:1px;height:25px;background:#454545}label{font-size:11px;color:#a1a1a5;display:grid;grid-template-columns:1fr auto;gap:9px 16px;width:112px}output{font:10px monospace;color:#c6c4cd}input[type=range]{grid-column:1/-1;width:112px;height:2px;margin:4px 0 2px;accent-color:#c4bad9;cursor:pointer}#pause{border:0;background:#3b3c3b;width:36px;height:36px;font-size:12px}.hint{font-size:10px;color:#808084;letter-spacing:1px}.hint kbd{font:10px monospace;color:#b3b1bb}.status{position:fixed;left:36px;bottom:32px;color:#78797b;font:9px monospace;letter-spacing:1px;line-height:1.9}.dot{display:inline-block;width:4px;height:4px;background:#aaa0bf;border-radius:50%;margin-right:7px}.hidden-ui header,.hidden-ui .topright,.hidden-ui .bottom,.hidden-ui .status{opacity:0;pointer-events:none}.hidden-ui canvas{cursor:none}header,.topright,.bottom,.status{transition:opacity 250ms var(--ease)}#error{display:none;position:fixed;inset:40%;text-align:center;color:#ddd}@media(max-width:700px){header{left:22px;top:24px}.topright{right:18px;top:20px}.status{display:none}.controls{gap:16px;padding:15px 18px}label{width:75px;font-size:10px;gap:9px 4px}input[type=range]{width:75px}.bottom{bottom:22px}.hint{font-size:9px;letter-spacing:0}.separator{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="sphere" aria-label="固定字符网格上的旋转球体，字符及位置永久固定，只改变显隐与透明度，可拖动旋转，空格暂停" role="img"></canvas>
<header><h1>CODE / SPHERE</h1><p>固定字符 · 仅透明度变化 · V3</p></header>
<div class="topright"><button id="reset" title="重置" aria-label="重置"><svg viewBox="0 0 20 20"><path d="M4 7a7 7 0 1 1-1 6M4 2v5h5"/></svg></button><button id="fullscreen" title="全屏 F" aria-label="全屏"><svg viewBox="0 0 20 20"><path d="M3 8V3h5m4 0h5v5M3 12v5h5m4 0h5v-5"/></svg></button></div>
<div class="status"><span class="dot"></span>LIVE CANVAS<br>PROCEDURAL ASCII · 01</div>
<div class="bottom"><div class="controls"><button id="pause" aria-label="暂停动画" title="空格暂停">Ⅱ</button><div class="separator"></div><label>转速<output id="speedOut">0.6×</output><input id="speed" aria-label="转速" type="range" min="0" max="2" step="0.1" value="0.6"></label><label>字符密度<output id="densityOut">1.0×</output><input id="density" aria-label="字符密度" type="range" min="0.6" max="1.8" step="0.1" value="1"></label><label>球体大小<output id="zoomOut">1.0×</output><input id="zoom" aria-label="球体大小" type="range" min="0.5" max="1.8" step="0.1" value="1"></label></div><div class="hint">拖动旋转 · 滚轮缩放 · <kbd>SPACE</kbd> 暂停 · <kbd>H</kbd> 隐藏界面</div></div>
<div id="error">当前浏览器无法启动 Canvas。</div>
<script src="sphere.js"></script>
</body></html>
