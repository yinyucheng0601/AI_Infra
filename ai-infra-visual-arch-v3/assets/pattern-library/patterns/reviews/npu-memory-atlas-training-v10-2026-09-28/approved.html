const $=s=>document.getElementById(s);// Reference configuration: Llama 3 8B, 32 layers, hidden=4096, FFN=14336,
// 32 query heads, 8 KV heads, head_dim=128, vocab=128256, untied embeddings.
// Reference configuration reproduced by AWS:
// https://aws.amazon.com/blogs/machine-learning/import-a-fine-tuned-meta-llama-3-model-for-sql-query-generation-on-amazon-bedrock/
// Mixed precision Adam memory accounting:
// https://huggingface.co/docs/transformers/v4.35.1/en/model_memory_anatomy
// This is a capacity illustration, not measured NPU performance or memory.
const H=4096,L=32,I=14336,V=128256,TP=2,PP=2,EP=2,ETP=2;
const baseGroups=[['attn.q','列切',L*H*H,'col'],['attn.kv','头切',L*2*H*1024,'col'],['attn.out','行切',L*H*H,'row'],['mlp.gate/up','列切',L*2*H*I,'col'],['mlp.down','行切',L*H*I,'row'],['embed','词表切分',V*H,'row'],['lm_head','词表切分',V*H,'row'],['norm','复制',(L*2+1)*H,'copy']];
let groups=baseGroups.map(t=>[...t]);
let localParams=groups.reduce((sum,t)=>sum+t[2],0);
const cats=[{name:'权重',value:localParams*2/1e9,color:'#D185E6',sub:'bf16 · 规格估算'},{name:'梯度',value:localParams*4/1e9,color:'#79D4F2',sub:'fp32 · 按需分配'},{name:'优化器态',value:localParams*12/1e9,color:'#8D89EE',sub:'含主权重 · fp32 ×3'},{name:'激活',value:3.8,color:'#B1EF6B',sub:'演示假设'},{name:'临时工作区',value:0,color:'#D0D0D0',sub:'算子临时内存'},{name:'通信缓冲',value:0,color:'#606060',sub:'独立申请 / 释放'},{name:'分配器可复用空间',value:2.3,color:'#858585',sub:'未被张量使用 · 非KV cache'}];
const stackOrder=[0,2,1,3,4,5,6,7];
const occupied=cats.reduce((sum,a)=>sum+a.value,0);
cats.push({name:'空余',value:64-occupied,color:'#282828',sub:'估算余量'});
let tensors=groups.map(t=>[t[0],t[1],t[2]*2/1e9<.01?'<0.01':(t[2]*2/1e9).toFixed(2),t[3]]);
let scope='all',selectedRank=2,renderRank=2;
let shardInfoOpen=false;
let mode='explode',labels=true,zoom=1,pan=[0,0];
let rankRatio=[3,3,4],labelMode='side';
// Aggregated module playback: illustrative order across a pass, not a layer trace.
const moduleOrder=[5,7,0,1,2,7,3,4,7,6];
function currentModule(st,id=selectedRank){if(st.active==='update'||st.active==='zero'||st.active==='idle')return null;const owned=rankGroups(id),forward=moduleOrder.filter(i=>owned[i][2]>0),order=st.active==='backward'?[...forward].reverse():forward;return order[Math.min(order.length-1,Math.floor(st.q*order.length))];}
const PEAK_ACT=3.8,BASE_RESERVE=2.3,CYCLE_MS=31000;
let simTime=0,step=1,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,lastFrame=null,lastPaint=0;
// Sources: https://pytorch.org/blog/activation-checkpointing-techniques/
// https://docs.pytorch.org/docs/stable/notes/cuda.html#memory-management
// https://docs.pytorch.org/docs/stable/generated/torch.optim.Optimizer.zero_grad.html
// Logical allocation model, not physical addresses. All runtime sizes and pulse
// timing are mock. Communication uses a separate transient allocator in this scenario.
let FULL_GRAD=localParams*4/1e9;
function baseSimulationState(t){
 t=Math.max(0,Math.min(CYCLE_MS,t));let st;
 if(t<28000){const mb=Math.floor(t/7000)+1,local=t%7000;
  if(local<3000){const q=local/3000;st={activation:PEAK_ACT*q,gradient:mb===1?0:FULL_GRAD,mb,phase:'前向',layer:Math.min(31,Math.floor(q*32)),detail:'保存激活；算子工作区和TP通信缓冲短时分配',active:'forward',q};}
  else{const q=(local-3000)/4000;st={activation:PEAK_ACT*(1-q),gradient:mb===1?FULL_GRAD*q:FULL_GRAD,mb,phase:'反向',layer:Math.max(0,31-Math.floor(q*32)),detail:mb===1?'逐步生成并分配梯度；释放已用激活':'复用已有梯度空间累积数值；不再叠加一整份梯度',active:'backward',q};}
  // Four visible aggregate bursts per pass, not a literal communication trace.
  const pulse=Math.pow(Math.sin(Math.PI*st.q*4),2);
  st.workspace=(st.active==='forward'?.3:.5)+pulse*.65;
  st.communication=pulse*(st.active==='forward'?.8:1.6);
 }else if(t<30000){const q=(t-28000)/2000;st={activation:0,gradient:FULL_GRAD,workspace:3*Math.sin(Math.PI*q),communication:0,mb:4,phase:'参数更新',layer:null,detail:'权重与Adam状态改变数值；更新临时工作区先申请后释放',active:'update'};}
 else st={activation:0,gradient:0,workspace:0,communication:0,mb:4,phase:'释放梯度',layer:null,detail:'set_to_none：梯度存储释放到分配器，可由下一步复用',active:'zero'};
 st.poolActive=st.activation+st.gradient+st.workspace;return st;
}
// Matrix convention from rank-topology-lite: rank = (pp * DP + dp) * TP + tp.
// ETP=TP=2: ep=dp%2, expert replica=floor(dp/2). Two half-width experts,
// top-1 routing, preserve the original aggregate FFN parameter budget.
const ranks=Array.from({length:16},(_,id)=>({id,tp:id%2,dp:Math.floor(id/2)%4,pp:Math.floor(id/8),ep:Math.floor(id/2)%2,edp:Math.floor(id/4)%2}));
// Dense modules: PP layer ownership + TP sharding; experts: additionally EP ownership.
// Two experts each have intermediate width I/2; ETP=2 splits each expert.
// Norms are replicated within TP; embeddings and output head are untied.
function rankGroups(id){
 const r=ranks[id],layers=L/PP;
 const counts=[layers*H*H/TP,layers*2*H*1024/TP,layers*H*H/TP,
  layers*2*H*(I/EP)/ETP,layers*H*(I/EP)/ETP,
  r.pp===0?V*H/TP:0,r.pp===PP-1?V*H/TP:0,(layers*2+(r.pp===PP-1?1:0))*H];
 return baseGroups.map((g,i)=>[g[0],g[1],counts[i],g[3]]);
}
function shardOwnership(index,id=renderRank){
 const r=ranks[id],present=rankGroups(id)[index][2]>0,expert=index===3||index===4;
 const layers='L'+r.pp*(L/PP)+'–'+((r.pp+1)*(L/PP)-1);
 const axis=index===0?'Q 头 '+r.tp*16+'–'+(r.tp*16+15):index===1?'K/V 头 '+r.tp*4+'–'+(r.tp*4+3):index===2?'输入列 '+r.tp*(H/TP)+'–'+((r.tp+1)*(H/TP)-1):expert?'专家中间维 '+r.tp*(I/EP/ETP)+'–'+((r.tp+1)*(I/EP/ETP)-1):index===5||index===6?'词表 '+r.tp*(V/TP)+'–'+((r.tp+1)*(V/TP)-1):'TP 内复制';
 return {present,expert,layers,axis,replica:expert?'专家副本 '+r.edp:'DP 副本 '+r.dp,
  identity:!present?'本阶段无此模块':(index===5?'输入嵌入':index===6?'输出头':layers)+(expert?' · E'+r.ep:'')+' · '+axis,
  key:!present?'absent':r.pp+':'+index+':'+(index===7?'replicated':r.tp)+(expert?':E'+r.ep:'')};
}
const params=ranks.map(r=>rankGroups(r.id).reduce((n,g)=>n+g[2],0));
const rankReserved=params.map(n=>n*18/1e9+PEAK_ACT+BASE_RESERVE);
function simulationState(t,id=renderRank){
 const r=ranks[id],grad=params[id]*4/1e9,mb=Math.min(4,Math.floor(t/7000)+1),u=t%7000;
 let st;
 if(t>=28000){st=baseSimulationState(t);st.gradient=t<30000?grad:0;}
 else {
  const f=r.pp*1200,b=r.pp===1?2400:4300;
  const forward=u>=f&&u<f+1200,backward=u>=b&&u<b+1900;
  const q=forward?(u-f)/1200:backward?(u-b)/1900:0;
  const load=r.ep===0?1.15:.85,peak=PEAK_ACT*load;
  const activation=u<f?0:u<f+1200?peak*q:u<b?peak:u<b+1900?peak*(1-q):0;
  st={mb,q,active:forward?'forward':backward?'backward':'idle',phase:forward?'前向':backward?'反向':'流水等待',layer:forward?r.pp*16+Math.min(15,Math.floor(q*16)):backward?r.pp*16+Math.max(0,15-Math.floor(q*16)):null,activation,gradient:mb>1?grad:u<b?0:u<b+1900?grad*q:grad,workspace:forward||backward?.3+.65*Math.sin(Math.PI*q)**2:0,communication:0,detail:'PP顺序前向、逆序反向；4个microbatch；教学调度，非真实trace'};
  const pulse=forward||backward?Math.sin(Math.PI*q*4)**2:0;
  st.tp=pulse*.4;st.ep=pulse*(q>.45&&q<.85?.6:0);
  st.pp=(u>=1200&&u<1400)||(u>=4100&&u<4300)?.35:0;
  st.dp=u>=6200&&u<6900&&mb===4?.6:0;
  st.communication=st.tp+st.ep+st.pp+st.dp;
 }
 // Transient categories share the approved 3.8 GB demo budget.
 // Freed gradient/activation bytes remain reserved and reusable on the device.
 const transient=st.activation+st.workspace+st.communication;
 const factor=transient>PEAK_ACT?PEAK_ACT/transient:1;
 st.activation*=factor;st.workspace*=factor;st.communication*=factor;
 st.poolActive=st.activation+st.gradient+st.workspace;return st;
}
const histories=ranks.map(r=>{let high=0;const values=[];for(let t=0;t<=CYCLE_MS;t+=10){high=Math.max(high,simulationState(t,r.id).poolActive);values.push(high);}return {values,high};});
function setRankData(id){renderRank=id;groups=rankGroups(id);localParams=params[id];FULL_GRAD=localParams*4/1e9;cats[0].value=localParams*2/1e9;cats[2].value=localParams*12/1e9;tensors=groups.map(g=>[g[0],g[1],(g[2]*2/1e9).toFixed(2),g[3]]);}
function applySimulation(){const st=simulationState(simTime);
 cats[0].sub=st.active==='update'?'bf16 · 更新数值':'bf16 · 常驻';
 cats[1].value=st.gradient;cats[1].sub=st.active==='zero'?'已释放 · set_to_none':st.active==='backward'?(st.mb===1?'首次分配 · fp32':'原位累积 '+st.mb+'/4 · fp32'):st.gradient>0?'保留累积结果 · fp32':'尚未分配';
 cats[2].sub=st.active==='update'?'fp32 ×3 · 更新数值':'含主权重 · fp32 ×3';
 cats[3].value=st.activation;cats[3].sub=st.active==='forward'?'保存中 · μb '+st.mb:st.active==='backward'?'释放中 · μb '+st.mb:'已释放';
 cats[4].value=st.workspace;cats[4].sub=st.active==='update'?'参数更新工作区 · 模拟':'算子工作区 · 模拟';
 cats[5].value=st.communication;cats[5].sub=st.communication>.01?'TP / PP / EP / DP通信 · 模拟':'独立缓冲已释放';
 const live=cats.slice(0,6).reduce((sum,c)=>sum+c.value,0);
 cats[6].value=rankReserved[renderRank]-live;cats[6].sub='本卡预留池 · 释放后复用';
 const total=rankReserved[renderRank];cats.at(-1).value=64-total;
 $('phase').textContent='Step '+step+' · '+st.phase+(st.layer===null?'':' · μb '+st.mb+'/4'+(mode==='shard'?'':' · L'+st.layer));

 $('phase').title=st.detail;$('timeline').value=Math.round(simTime);$('timeline').setAttribute('aria-valuetext',st.phase+'，'+(simTime/1000).toFixed(1)+'秒');
 $('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-label',playing?'暂停模拟':'播放模拟');
}

// Normalize the logical memory box to the selected physical aspect ratio.
function P(x,y,z){const unit=245/rankRatio[0];x=x/245*rankRatio[0]*unit;y=y/155*rankRatio[1]*unit;z=z/(64*6.7)*rankRatio[2]*unit;return[575+(x-y)*Math.sqrt(3)/2,510+(x+y)*.5-z]};function pts(a){return a.map(p=>P(...p).join(',')).join(' ')}function polygon(a,c,stroke='#FFFFFF',width=.8){return `<polygon points="${pts(a)}" fill="${c}" stroke="${stroke}" stroke-width="${width*(scope==='all'?2:1)}" stroke-linejoin="round"/>`};function shade(color,factor){const n=parseInt(color.slice(1),16);return '#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.min(255,Math.round(v*factor)).toString(16).padStart(2,'0')).join('');}
function block(x,y,z,w,d,h,c,top=true){let a='';const stroke='none';
 a+=polygon([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],shade(c,.82),stroke);
 a+=polygon([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],shade(c,1.04),stroke);
 if(top)a+=polygon([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],shade(c,.94),stroke);return a;}

function text(x,y,s,size=16,c='#e8e8e8',extra=''){return `<text x="${x}" y="${y}" fill="${c}" font-size="${size-2}" ${extra}>${s}</text>`}function label(p,y,title,sub,c='#e8e8e8'){const x=p[0]+18;return `<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#FFFFFF"/>`+text(x,y,title,17,c)+text(x,y+24,sub,14,'#ababab')}

function backFaces(){const h=64*6.7;return `<g class="rank-back-faces" fill="#000" fill-opacity=".8"><polygon points="${pts([[0,0,0],[245,0,0],[245,155,0],[0,155,0]])}"/><polygon points="${pts([[0,0,0],[245,0,0],[245,0,h],[0,0,h]])}"/><polygon points="${pts([[0,0,0],[0,155,0],[0,155,h],[0,0,h]])}"/></g>`;}
function surfaceValue(i,z,h,free=false,a=cats[i]){
 const x=free?245:239,y=free?155:149;
 const top=P(x,y,z+h),bottom=P(x,y,z),height=bottom[1]-top[1];
 if(height<1)return '';
 const size=20,anchor=P(x,y-7,z+h/2);
 return `<g class="surface-value" aria-label="${a.name} ${a.value.toFixed(2)} GB"><title>${a.name}：${a.value.toFixed(2)} GB</title><text transform="matrix(0.8660254 -.5 0 1 ${anchor[0]} ${anchor[1]})" dominant-baseline="middle" fill="#fff" font-size="${size-2}" font-weight="700" style="pointer-events:none"><tspan>${a.value.toFixed(2)}</tspan><tspan dx="4" font-size="${size*.64-2}" font-weight="400">GB</tspan></text></g>`;
}
function outline(z,h){return `<path d="M${P(0,155,z+h)} L${P(0,0,z+h)} L${P(245,0,z+h)} L${P(245,155,z+h)} Z M${P(0,155,z+h)} L${P(0,155,z)} L${P(245,155,z)} L${P(245,0,z)} L${P(245,0,z+h)} M${P(245,155,z+h)} L${P(245,155,z)}" fill="none" stroke="#FFFFFF" stroke-width="${scope==='all'?4.8:2.4}"/>`}
function sideMemoryLabels(rows){
 let previous=-Infinity;
 for(const r of rows){r.y=Math.max((r.top+r.bottom)/2,previous+30);previous=r.y;}
 return rows.map(({a,top,bottom,y,free=false})=>{
  const x=P(245,0,0)[0]+26;
  return `<g class="memory-label"><title>${a.name}：${memorySize(a.value)} · ${a.sub||''}</title><rect x="${x}" y="${top}" width="5" height="${Math.max(1,bottom-top)}" fill="${free?'none':a.color}" stroke="${free?'#484848':'none'}"/><text x="${x+16}" y="${y}" dominant-baseline="middle" fill="#f5f5f5"><tspan font-size="20" font-weight="700">${a.value>=.01?a.value.toFixed(2):(a.value*1000).toFixed(2)}</tspan><tspan dx="6" font-size="12">${a.value>=.01?'GB':'MB'}</tspan><tspan dx="8" font-size="13" fill="#bdbdbd">${a.name}</tspan></text></g>`;
 }).join('');
}
function drawRank(){applySimulation();let s='';if(mode==='shard'){s=drawShards()}else{const exploded=mode==='explode',frameHeight=64*6.7,inset=6;let z=inset;
// Fixed separation uses part of free capacity; the remainder stays above the stack.
const gap=exploded?8:0;
let drawn=0,anchors=[],labelBands=[],surfaceLabels='';
s+=`<path d="M${P(0,0,0)} L${P(0,0,frameHeight)}" fill="none" stroke="#505050" stroke-width="${scope==='all'?4.8:2.4}"/>`;
stackOrder.forEach(i=>{const a=cats[i],free=i===cats.length-1,h=a.value*6.7;
 if(exploded&&free){if(labels&&labelMode==='surface')surfaceLabels+=surfaceValue(i,z,frameHeight-z,true);anchors.push(P(245,0,z+(frameHeight-z)/2));labelBands[i]={top:P(245,0,frameHeight)[1],bottom:P(245,0,z)[1]};return;}
 if(exploded&&h>.01&&drawn>0)z+=gap;
 anchors.push(P(245,0,z+h/2));labelBands[i]={top:P(245,0,z+h)[1],bottom:P(245,0,z)[1]};
 if(h>.01&&!free)s+=block(inset,inset,z,245-inset*2,155-inset*2,h,a.color,true);
 if(labels&&labelMode==='surface'&&!free&&h>.01)surfaceLabels+=surfaceValue(i,z,h);
z+=h;if(!free&&h>.01)drawn++;
});
s+=surfaceLabels+outline(0,frameHeight);
if(labels&&labelMode==='side'){const names=['权重','梯度','优化器态','激活','临时工作区','通信缓冲','分配器可复用','空余'];
const rows=stackOrder.map(i=>({a:cats[i],i,...labelBands[i]})).filter(r=>r.bottom-r.top>.01).reverse();
// Keep swatches at their physical layer bounds; only text shifts to avoid collisions.
let previous=-Infinity;
rows.forEach(r=>{r.y=Math.max((r.top+r.bottom)/2,previous+30);previous=r.y;});
for(let j=rows.length-2;j>=0;j--)rows[j].y=Math.min(rows[j].y,rows[j+1].y-30);
s+=sideMemoryLabels(rows.map(r=>({...r,free:r.i===cats.length-1})));
}}
return backFaces()+rankWallLabel()+s;}
function rankWallLabel(){
 const r=ranks[renderRank],p=P(0,140,64*6.7),owner=shardOwnership(+$('tensor').value);
 const detail=mode==='shard'?owner.identity+' · '+owner.replica:'64 GB · PP'+r.pp+' · TP'+r.tp+' · EP'+r.ep+' · DP'+r.dp;
 // Keep the isometric text orientation, lifted above the upper left edge.
 return `<g class="rank-wall-label" transform="matrix(0.8660254 -.5 0 1 ${p[0]} ${p[1]-40})" fill="#f5f5f5" style="pointer-events:none"><title>Rank ${renderRank} · ${detail}</title><text font-size="26" font-weight="700">Rank ${String(renderRank).padStart(2,'0')}</text><text y="22" font-size="11" fill="#bdbdbd">L${r.pp*16}–${r.pp*16+15} · TP${r.tp}${mode==='shard'&&owner.expert?' · E'+r.ep:''}</text></g>`;
}
// Two PP floors; each floor is a 2 (TP) × 4 (DP) isometric array.
const RANK_SCALE=.36;
const rankSpacing={x:480,y:700,z:900};
function rankPosition(r){
 // Shared isometric axes: X=DP (4), Y=TP (2), Z=PP (2).
 const x=r.dp*rankSpacing.x,y=r.tp*rankSpacing.y,z=r.pp*rankSpacing.z;
 return [537+(x-y)*Math.sqrt(3)/2*RANK_SCALE,325+((x+y)*.5-z)*RANK_SCALE];
}
// Paint back to front, lower floor first, so foreground ranks occlude correctly.
function rankPaintOrder(){return [...ranks].sort((a,b)=>a.pp-b.pp||(a.dp*rankSpacing.x+a.tp*rankSpacing.y)-(b.dp*rankSpacing.x+b.tp*rankSpacing.y));}
function drawRelations(){
 const dim=$('relations').value;if(dim==='none')return '';
 const point=r=>{const [x,y]=rankPosition(r);return [x+RANK_SCALE*202,y+RANK_SCALE*665];};
 let out='';for(const a of ranks)for(const b of ranks){if(b.id<=a.id)continue;
  const same=dim==='tp'?a.pp===b.pp&&a.dp===b.dp:dim==='pp'?a.tp===b.tp&&a.dp===b.dp:dim==='ep'?a.pp===b.pp&&a.tp===b.tp&&a.edp===b.edp:dim==='edp'?a.pp===b.pp&&a.tp===b.tp&&a.ep===b.ep:a.pp===b.pp&&a.tp===b.tp&&b.dp===a.dp+1;
  if(!same)continue;const st=simulationState(simTime,a.id),active=st[dim==='edp'?'dp':dim]>.01;
  const [x,y]=point(a),[xx,yy]=point(b);
  out+=`<path data-relation="${dim}" d="${x===xx?`M${x} ${y} H${x+70} V${yy} H${xx}`:`M${x} ${y} L${xx} ${yy}`}" fill="none" stroke="${active?'#e8e8e8':'#505050'}" stroke-width="${active?1.2:.8}" stroke-dasharray="${dim==='pp'?'6 4':dim==='ep'?'2 4':'none'}"><title>${dim.toUpperCase()} · Rank ${a.id} ↔ ${b.id}</title></path>`;
 }return out;
}
function render(){setRankData(selectedRank);if(mode==='shard'&&playing){const active=currentModule(simulationState(simTime,selectedRank));if(active!==null)$('tensor').value=String(active);}let s='';const savedLabels=labels,savedTensor=$("tensor").value;if(scope==='all'){labels=savedLabels&&labelMode==='surface';for(const r of rankPaintOrder()){setRankData(r.id);const [x,y]=rankPosition(r);const geom=drawRank();s+=`<g data-rank="${r.id}" role="button" tabindex="0" aria-label="Rank ${r.id}, TP ${r.tp}, PP ${r.pp}, DP ${r.dp}, EP ${r.ep}" transform="translate(${x} ${y}) scale(${RANK_SCALE}) translate(-440 0)">${geom}</g>`;}labels=savedLabels;$("tensor").value=savedTensor;setRankData(selectedRank);applySimulation();}else{s=drawRank();}
$('world').innerHTML=s;
renderShardInspector();
$('memory-legend').hidden=!(labels&&labelMode==='surface');
$('memory-legend').innerHTML=(mode==='shard'?[0,2]:stackOrder).map(i=>{const a=cats[i];return `<span><i style="background:${i===7?'transparent':a.color};${i===7?'border:1px solid #555':''}"></i>${a.name}</span>`;}).join('');
syncTensorMenu();transform();document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));$('tensor').classList.toggle('hidden',mode!=='shard');$('labels').setAttribute('aria-pressed',labels&&(scope==='single'||labelMode==='surface'));$('labels').disabled=scope==='all'&&labelMode==='side';$('relations').classList.toggle('hidden',true);$('single').setAttribute('aria-pressed',scope==='single');$('all').setAttribute('aria-pressed',scope==='all');$('rank').classList.toggle('hidden',scope==='all');$('rank').value=selectedRank;$('scene').setAttribute('aria-label',scope==='all'?'16 rank 内存总览':'Rank '+selectedRank+' 内存细节')}
function memorySize(gb){return gb>=1?gb.toFixed(3)+' GB':(gb*1000).toFixed(2)+' MB';}
const shardStates=[{name:'BF16 权重',bytes:2,cat:0},{name:'FP32 主权重',bytes:4,cat:2},{name:'FP32 一阶动量 m',bytes:4,cat:2},{name:'FP32 二阶动量 v',bytes:4,cat:2}];
function drawShards(){
 const g=groups[+$('tensor').value],owner=shardOwnership(+$('tensor').value),rank=ranks[renderRank];
 const w=233,d=143,fraction=g[2]/localParams;
 let s='',z=6,callouts=[];
 if(owner.present){
  const row=g[3]==='row',sw=row?w:w*fraction,sd=row?d*fraction:d;
  const x=6+(row||g[3]==='copy'?w-sw:rank.tp*(w-sw)),y=6+(!row?d-sd:rank.tp*(d-sd));
  for(const state of shardStates){
   const a=cats[state.cat],h=localParams*state.bytes/1e9*6.7;
   s+=block(6,6,z,w,d,h,shade(a.color,.28));
   const value={name:state.name,color:a.color,value:g[2]*state.bytes/1e9,sub:g[0]+' · '+owner.identity};
   s+=`<g data-state="${state.name}" data-shard="${owner.key}"><title>${g[0]} · ${owner.identity} · ${state.name} · ${memorySize(value.value)}</title>`+block(x,y,z,sw,sd,h,a.color)+`<path d="M${P(x,y,z+h)} L${P(x+sw,y,z+h)} L${P(x+sw,y+sd,z+h)} L${P(x,y+sd,z+h)} Z" fill="none" stroke="#fff" stroke-width="${scope==='all'?2:1}"/></g>`;
   if(labels&&labelMode==='surface')s+=surfaceValue(state.cat,z,h,false,value);
   callouts.push({a:value,top:P(245,0,z+h)[1],bottom:P(245,0,z)[1]});
   z+=h+8;
  }
  if(labels&&labelMode==='side')s+=sideMemoryLabels(callouts.reverse());
 }else if(scope==='single')s+=text(575,460,'本阶段无 '+g[0],20,'#bdbdbd','text-anchor="middle"');
 return s+outline(0,64*6.7);
}
function renderShardInspector(){
 const panel=$('shard-inspector');panel.hidden=mode!=='shard'||!shardInfoOpen;$('shard-info').classList.toggle('hidden',mode!=='shard');$('shard-info').setAttribute('aria-expanded',String(!panel.hidden));document.body.classList.toggle('shard-view',mode==='shard');
 if(mode!=='shard')return;
 const g=groups[+$('tensor').value],owner=shardOwnership(+$('tensor').value,selectedRank);
 const markup=`<div class="eyebrow">Rank ${selectedRank} · 权重分片及优化器态</div><h2>${g[0]}</h2><p>${owner.identity}<br>${owner.replica}</p><table><tbody>${shardStates.map(a=>`<tr><td><i style="background:${cats[a.cat].color}"></i>${a.name}</td><td>${memorySize(g[2]*a.bytes/1e9)}</td></tr>`).join('')}</tbody></table><div class="total">${memorySize(g[2]*14/1e9)}</div><p>${g[2].toLocaleString('en-US')} 个本地参数 × 14 字节<br>权重 2 B + 主权重 / m / v 各 4 B</p><p class="note">亮色：所选模块的权重及对应优化器态。暗色：本卡其他模块的同类数据。主权重、m、v 计入优化器态。左右位置区分 TP 分片身份，体积表示内存份额，不代表物理地址。</p><p class="note">TP2 × PP2 × DP4；EP2、ETP2、专家副本2；ZeRO 关闭。PP0 持有 L0–15 和 embed，PP1 持有 L16–31、最终 norm 和 lm_head。两个专家各为半宽 FFN；教学配置未计 router 参数。</p><p class="note">不同 TP、PP、专家可持有等大但不同的权重；DP 副本持有相同权重分片。</p>`;
 if(panel.innerHTML!==markup)panel.innerHTML=markup;
}

function rankSceneCenterX(){
 const left=P(0,155,0)[0],right=P(245,0,0)[0];
 if(scope==='single')return (left+right)/2;
 const origins=ranks.map(r=>rankPosition(r)[0]);
 return (Math.min(...origins)+RANK_SCALE*(left-440)+Math.max(...origins)+RANK_SCALE*(right-440))/2;
}
function transform(){let fit=1,cy=425;if(scope==='all'){const r=$('scene').getBoundingClientRect(),unit=Math.min(r.width/1400,r.height/900),offset=(r.height-900*unit)/2;const bottom=Math.min(880,(document.querySelector('nav[aria-label="视图操作"]').getBoundingClientRect().top-r.top-offset)/unit-24);fit=Math.min(1,(bottom-24)/969);cy=(bottom+24)/2;}$('world').setAttribute('transform',`translate(${700+pan[0]} ${cy+pan[1]}) scale(${zoom*fit}) translate(-${rankSceneCenterX()} -${scope==='all'?497:425})`);$('zoom').textContent=Math.round(zoom*100)+'%'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('labels').onclick=()=>{labels=!labels;render()};$('plus').onclick=()=>{zoom=Math.min(2.5,zoom+.15);transform()};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.15);transform()};$('fit').onclick=()=>{zoom=1;pan=[0,0];render()};let drag=null;$('scene').onpointerdown=e=>{drag=[e.clientX,e.clientY,...pan];$('scene').setPointerCapture(e.pointerId)};$('scene').onpointermove=e=>{if(!drag)return;let r=$('scene').getBoundingClientRect(),scale=Math.min(r.width/1400,r.height/900);pan=[drag[2]+(e.clientX-drag[0])/scale,drag[3]+(e.clientY-drag[1])/scale];transform()};$('scene').onpointerup=$('scene').onpointercancel=()=>drag=null;
const cameras={single:{zoom:1,pan:[0,0]},all:{zoom:1,pan:[0,0]}};
function switchScope(next){cameras[scope]={zoom,pan:[...pan]};scope=next;({zoom,pan}=cameras[scope]);render();}
const settingsToggle=$('rank-settings-toggle'),settingsPanel=$('rank-settings-panel');
function setSettingsOpen(open){settingsPanel.hidden=!open;settingsToggle.setAttribute('aria-expanded',String(open));}
settingsToggle.onclick=()=>setSettingsOpen(settingsPanel.hidden);
$('label-mode').onchange=e=>{labelMode=e.target.value;render();};
for(const axis of ['x','y','z']){
 const input=$('rank-spacing-'+axis);
 input.oninput=()=>{const value=Number(input.value);if(input.value.trim()===''||!Number.isFinite(value)||value<0||value>3000)return;rankSpacing[axis]=value;render();};
 input.onchange=()=>{input.value=rankSpacing[axis];};
}
$('rank-ratio').onchange=e=>{rankRatio=e.target.value.split(':').map(Number);render();};
document.addEventListener('click',e=>{if(!e.target.closest('.rank-settings'))setSettingsOpen(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!settingsPanel.hidden){setSettingsOpen(false);settingsToggle.focus();}});
$('relations').onchange=()=>render();
$('single').onclick=()=>switchScope('single');$('all').onclick=()=>switchScope('all');
$('rank').innerHTML=ranks.map(r=>`<option value="${r.id}">Rank ${r.id} · tp${r.tp} pp${r.pp} ep${r.ep}</option>`).join('');
$('rank').onchange=()=>{selectedRank=+$('rank').value;render();};
$('scene').addEventListener('dblclick',e=>{const g=e.target.closest('[data-rank]');if(g){selectedRank=+g.dataset.rank;switchScope('single');}});
$('scene').addEventListener('keydown',e=>{const g=e.target.closest('[data-rank]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectedRank=+g.dataset.rank;switchScope('single');}});
$('config').title='TP2 × PP2 × DP4 = 16；EP2 折入 DP，ETP2，专家副本2。按每卡层段、矩阵分片、专家归属计算参数；ZeRO 关闭。沿用8B尺寸的双半宽专家教学配置，未计router参数。';
function syncTensorMenu(){
 const index=+$('tensor').value,g=baseGroups[index];
 $('tensor').title=playing?'播放中：按前向 / 反向顺序遍历；手动选择会暂停':'手动查看；点击播放恢复模块遍历';
 $('tensor').textContent=g[0]+' · '+g[1]+(g[3]==='copy'?'':' ×2')+' ▾';
 for(const option of $('tensor-list').querySelectorAll('[role="option"]'))option.setAttribute('aria-selected',String(+option.dataset.index===index));
 if(mode!=='shard')closeTensorMenu(false);
}
function closeTensorMenu(focus=true){$('tensor-list').hidden=true;$('tensor').setAttribute('aria-expanded','false');if(focus)$('tensor').focus();}
function openTensorMenu(){
 const list=$('tensor-list'),r=$('tensor').getBoundingClientRect();list.hidden=false;
 list.style.left=Math.max(8,Math.min(r.left,window.innerWidth-248))+'px';list.style.bottom=(window.innerHeight-r.top+8)+'px';
 $('tensor').setAttribute('aria-expanded','true');list.querySelectorAll('[role="option"]')[+$('tensor').value].focus();
}
$('tensor-list').innerHTML=baseGroups.map((g,i)=>`<button role="option" tabindex="-1" data-index="${i}" aria-selected="${i===0}">${g[0]} · ${g[1]}${g[3]==='copy'?'':' ×2'}</button>`).join('');
$('tensor').onclick=()=>{$('tensor-list').hidden?openTensorMenu():closeTensorMenu();};
$('tensor').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openTensorMenu();}};
$('tensor-list').onclick=e=>{const option=e.target.closest('[data-index]');if(!option)return;$('tensor').value=option.dataset.index;playing=false;lastFrame=null;closeTensorMenu();render();};
$('tensor-list').onkeydown=e=>{
 const options=[...$('tensor-list').querySelectorAll('[role="option"]')],index=options.indexOf(document.activeElement);

 else if(e.key==='Tab')closeTensorMenu(false);
 else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?options.length-1:(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[next].focus();}
};
document.addEventListener('click',e=>{if(!e.target.closest('#tensor')&&!e.target.closest('#tensor-list'))closeTensorMenu(false);});
$('shard-info').onclick=()=>{shardInfoOpen=!shardInfoOpen;renderShardInspector();};
$('play').onclick=()=>{playing=!playing;lastFrame=null;render()};

function tick(now){if(lastFrame!==null&&playing&&!document.hidden){simTime+=(now-lastFrame)*Number($('speed').value);while(simTime>=CYCLE_MS){simTime-=CYCLE_MS;step++;}}lastFrame=now;if(playing&&now-lastPaint>32){render();lastPaint=now;}requestAnimationFrame(tick)}
