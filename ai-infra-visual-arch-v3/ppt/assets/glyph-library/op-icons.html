<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OP Icons · 已确认</title><style>:root{--background:#101010;--foreground:#eee;--foreground-secondary:#aaa;--surface-1:#161616;--surface-4:#4f4f4f;--radius-lg:12px;--font-size-display-lg:28px;--font-size-title-md:20px;--font-size-body-md:14px;--font-size-body-sm:12px}html[data-theme=light]{--background:#f8f8f8;--foreground:#222;--foreground-secondary:#666;--surface-1:white;--surface-4:#ddd}.btn{background:var(--surface-4);color:var(--foreground);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-family-sans,sans-serif)}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;align-items:center;gap:16px}h1{font-size:var(--font-size-display-lg);margin:0 auto 0 0}p{color:var(--foreground-secondary);line-height:1.6}h2{font-size:var(--font-size-title-md);margin:32px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}.item{padding:16px;background:var(--surface-1);border-radius:var(--radius-lg)}.op{height:64px;border-radius:32px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface-4);font-size:var(--font-size-body-md);font-weight:500}.op:hover{background:color-mix(in srgb,var(--surface-4) 90%,white)}.badge{width:44px;height:44px;border-radius:50%;background:var(--background);display:grid;place-items:center;flex:none}.badge svg{width:30px;height:30px}.op .fold{margin-left:auto;color:var(--foreground-secondary)}.caption{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--foreground-secondary);font-size:var(--font-size-body-sm)}.large{max-width:440px}.flow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.flow .op{min-width:270px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}.spec{font-size:var(--font-size-body-sm)}@media(max-width:680px){.comparison{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><header><h1>OP 节点图标库</h1><span>方案 A · 已确认</span><button class="btn btn-ghost btn-sm" id="theme">浅色模式</button></header><p>统一 30 × 30 线性图标，放入节点左侧 44 px 圆形底座。节点保持 64 px 高；计算图标与右侧展开控件独立。</p><h2>Residual Add · 加法图标</h2><div class="comparison"><div><p>当前：文字前缀</p><div class="op large" style="justify-content:center">+ HC Post / Residual Merge</div></div><div><p>修正：独立圆形加法节点，直接连接主干与残差</p><div id="residual"></div></div></div><h2>节点组合效果</h2><div class="flow" id="flow"></div><h2>完整图标集 · 24 个</h2><div class="grid" id="icons"></div><p class="spec">复用 PTO 字体、主题、surface、按钮与圆角 token。新增提案：算子语义 SVG 与左侧圆形底座，拟收录为共享数据可视化图元。颜色保持中性，暂不按算子分类染色。</p></main><script src="./op-icons.js"></script><script>
const icon=i=>`<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${i.path}"/></svg></span>`;
const node=(i,label=i.name,fold=false)=>`<div class="op">${icon(i)}<span>${label}</span>${fold?'<span class="fold" aria-label="展开控件示意">⊕</span>':''}</div>`;
document.querySelector('#residual').innerHTML='<svg width="64" height="64" viewBox="0 0 64 64" aria-label="Residual Add"><circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 32h24M32 20v24" stroke="currentColor" stroke-width="2.5"/></svg>';
document.querySelector('#flow').innerHTML=node(PtoOpIcons[1])+ '<span>→</span>'+node(PtoOpIcons[3])+ '<span>→</span>'+node(PtoOpIcons[5],'Attention · CSA2',true);
document.querySelector('#icons').innerHTML=PtoOpIcons.map(i=>`<article class="item">${node(i)}<div class="caption"><span>${i.description}</span><code>${i.id}</code></div></article>`).join('');
document.querySelector('#theme').onclick=()=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';document.querySelector('#theme').textContent=light?'深色模式':'浅色模式'};
</script></body></html>
