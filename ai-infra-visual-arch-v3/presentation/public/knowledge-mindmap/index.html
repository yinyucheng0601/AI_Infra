svg.addEventListener('click',e=>{if(current&&!e.target.closest('g[data-has-legend="true"]'))hide()});
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='knowledge-map-reset')hide()});
const warm=()=>['0:1','0:2','2:2'].forEach(key=>{const e=window.KnowledgeLegend[key]?.[0];if(e)preload(e)});
if('requestIdleCallback' in window)requestIdleCallback(warm);else setTimeout(warm,250);
function download(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function svgText(){const c=svg.cloneNode(true);c.setAttribute('xmlns',NS);c.setAttribute('width',1920);c.setAttribute('height',1080);c.setAttribute('font-family','Arial, PingFang SC, sans-serif');return new XMLSerializer().serializeToString(c)}document.getElementById('svgBtn').onclick=()=>download(new Blob([svgText()],{type:'image/svg+xml;charset=utf-8'}),'ai-compute-six-object-mindmap-light.svg');document.getElementById('pngBtn').onclick=()=>{const u=URL.createObjectURL(new Blob([svgText()],{type:'image/svg+xml;charset=utf-8'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=3840;c.height=2160;c.getContext('2d').drawImage(im,0,0,3840,2160);c.toBlob(b=>{if(b)download(b,'ai-compute-six-object-mindmap-light-4k.png');URL.revokeObjectURL(u)},'image/png')};im.src=u};
</script><script>document.addEventListener("keydown",e=>{if(!e.target.closest(".legend-tabs")&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!e.altKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();parent.postMessage({type:"knowledge-map-slide-nav",direction:e.key==="ArrowRight"?1:-1},location.origin)}});</script><script>if(new URLSearchParams(location.search).get('mode')==='stage1'){svg.setAttribute('viewBox','0 145 1920 850');document.querySelectorAll('#drawing>text').forEach(n=>{if(Number(n.getAttribute('y'))<145)n.remove()})}</script><script>
window.getKnowledgeAnchors=()=>{
 const definitions={Layer:[0,1,'Layer'],Operator:[0,3,'MatMul'],Tensor:[1,1,'Tensor'],Kernel:[2,2,'Kernel'],Task:[4,1,'Task'],Rank:[4,1,'Rank'],GPU:[3,0,'GPU'],Core:[3,0,'Core'],Event:[4,4,'Event'],Trace:[5,0,'Trace']},out={};
 for(const [id,[i,j,term]] of Object.entries(definitions)){
  const text=document.querySelector('g[data-domain="'+i+'"][data-row="'+j+'"] .leaf-terms');if(!text)continue;
  const walker=document.createTreeWalker(text,NodeFilter.SHOW_TEXT);let child;
  while(child=walker.nextNode()){const index=child.textContent.indexOf(term);if(index<0)continue;
   const range=document.createRange();range.setStart(child,index);range.setEnd(child,index+term.length);const b=range.getBoundingClientRect();
   out[id]={x:b.x+b.width/2,y:b.y+b.height/2,width:b.width,height:b.height,label:term};break;
  }
 }
 return out;
};
</script></body></html>
