<main><section class="cover" id="cover" aria-labelledby="cover-title"><div class="cover-copy"><span class="brand-mark cover-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><div class="eyebrow">A VISUAL GUIDE TO TRANSFORMER</div><h1 id="cover-title">Transformer<br>层内图解</h1><p>从 token 的数值表示出发，理解两个计算子层、残差与梯度，逐步读懂一个完整 Layer。</p><div class="cover-note">11 节图解 · 由浅入深<br>Token → Attention / FFN → 残差与 mHC → 输出与训练</div></div><div class="cover-visual" id="cover-visual" aria-label="两个子层的结构预览"></div></section><div class="heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="step-num" id="step-num" aria-hidden="true"></div></div><div class="workspace" id="workspace"><section class="visual" aria-label="架构示意图"><div class="info-wrap"><button id="info-toggle" class="info-toggle" aria-label="图例与阅读说明" aria-expanded="false" aria-controls="info-panel">i</button><section id="info-panel" class="info-panel" hidden aria-label="图例与阅读说明"><h3>图例与阅读说明</h3><div class="legend"><span><i></i>激活 · 传递的数据</span><span><i></i>权重 · 参与计算</span><span><i></i>梯度 · 反向得到</span></div><p id="caption"></p><p>点击图元，查看定义。也可使用 Tab 选中图元，再按 Enter。</p></section></div><div id="diagram"></div><div class="controls" id="controls"></div></section><article class="explanation"><div class="section-label">原理与解释</div><h2 id="explain-title"></h2><div id="copy"></div><div class="formula" id="formula"></div><div class="inspector" aria-live="polite"><span class="inspector-label">图元释义</span><h3 id="node-title"></h3><p id="node-copy"></p></div><div class="source" id="source"></div></article></div><footer class="bottom"><button id="prev" aria-label="上一页">← 上一页</button><div class="progress" aria-label="全部页面"></div><button class="next" id="next">下一页 →</button></footer></main>

const B='#8cbdff',G='#e8c66e',P='#bca3e8';
const sources={attn:'<a href="https://arxiv.org/abs/1706.03762" target="_blank" rel="noopener">Vaswani et al. · Attention Is All You Need</a>',norm:'<a href="https://arxiv.org/abs/2002.04745" target="_blank" rel="noopener">Xiong et al. · On Layer Normalization</a>',res:'<a href="https://arxiv.org/abs/1603.05027" target="_blank" rel="noopener">He et al. · Identity Mappings in Deep Residual Networks</a>',mhc:'<a href="https://arxiv.org/abs/2512.24880" target="_blank" rel="noopener">DeepSeek-AI · mHC 原始论文，§3–4</a>'};
const glossary={token:['Token · 离散符号','分词器把文本转成词表中的编号。一个 token 可能是字、词的一部分或标点；图中的中文分词只作示例，实际结果取决于分词器。'],x:['激活 X · 当前输入的数据表示','这里的激活泛指计算中产生和传递的中间张量，包括投影、归一化、非线性变换等运算的结果。每行对应一个 token，每列对应一个隐藏维度；数值随输入和层内计算改变。'],matrix:['T × H · 张量的形状','T 是序列中的 token 数，H 是隐藏维度。图中省略了 batch 维；实际张量常写作 B × T × H，也可能因并行切分而只保留局部分片。格子亮度为教学示意。'],weight:['W · 可训练权重','模型在训练中学到的参数。普通推理时，同一套参数用于不同输入；训练时，优化器根据梯度与自身状态更新参数。金色图元可以概括多张权重矩阵，用于说明它们参与哪项计算。'],norm:['Norm · 归一化','沿每个 token 的特征维调整数值尺度，以改善后续计算的数值条件。LayerNorm 与 RMSNorm 是两种具体实现，各自使用不同的归一化公式；本教程用 Norm 统称。归一化操作本身也可能带有可训练参数。'],attn:['Attention · 因果自注意力','依据当前表示计算 Q、K、V，在可见位置之间聚合信息。多头结果合并后经过输出投影，分支输出重新回到 T × H，以便进行残差相加。'],ffn:['FFN · 逐位置前馈网络','对每个 token 使用同一组参数，沿特征维做非线性变换。每一行独立完成计算；输入的特征向量已经可以包含 Attention 汇入的上下文信息。'],add:['＋ · 逐元素相加','相同位置的两个数相加。普通残差要求两侧形状一致；相加后的形状仍为 T × H。加法节点直接合并数据，本身无需学习参数。'],residual:['旁路线 · 恒等残差路径','将本子层输入直接送到加法节点。分支学习对输入特征的更新量，相加后的特征向量继续传给下一阶段；旁路在前向中传数据，在反向中也参与梯度传播。'],branch:['R_Attn / R_FFN · 分支输出','这是计算分支产生的激活。本图用 R 标记分支结果；它与旁路输入相加后，才形成完整的子层输出。'],y:['Y · 两个子层之间传递的激活','Y = X + R_Attn，已经包含第一次残差相加的结果。它既是 Attention 子层的输出，也是 FFN 子层的输入。'],z:['Z · 当前 Layer 的输出','Z = Y + R_FFN。它会传给下一层，通常仍为 T × H；下一层拥有自己的参数，并继续更新每个 token 的表示。'],grad:['∂L/∂W · 参数梯度','描述损失 L 对每个参数的局部敏感程度，形状与对应参数相同。反向传播通过链式法则计算梯度，优化器再利用梯度决定参数如何更新。'],loss:['Loss · 训练目标的数值评价','语言模型训练常比较预测分布与真实的下一个 token，计算交叉熵损失。反向传播从损失开始，优化器随后更新权重。普通生成过程则根据预测分布选择下一个 token。'],head:['LM Head · 词表投影','将最终隐藏表示从 H 维映射到词表大小 V 的分数 logits。Softmax 可将分数转换为概率；生成时按解码策略选出下一个 token。'],pre:['H_pre · 四路读成一路','对同一 token 的四个 H 维特征向量加权读取，得到送入计算分支的一个 H 维向量。这里沿残差流维度进行组合；Attention 则沿 token 位置聚合上下文信息。'],mix:['H_res · 四路之间的残差混合','一个 4 × 4 的连接系数矩阵作用在流维度。mHC 将其约束为非负、行和与列和均为 1 的双随机矩阵；这些连接系数可由可训练参数结合当前输入动态生成。'],post:['H_post · 一路写回四路','将分支的一路输出按四个写回系数分配给四路，再分别与混合后的旁路结果相加。四路输出共同使用这一次 Attention 或 FFN 分支计算的结果。'],stream:['四路残差流 · n = 4','每个 token 同时保留四个 H 维特征向量，整段序列的残差状态可写作 T × 4 × H。T 计量 token 数，4 计量残差流数，H 计量每路的特征维度。'],op:['矩形节点 · 一项计算','矩形表示对张量执行的计算；带网格的矩形表示数据或参数。箭头用于说明哪个节点的输出会作为后续节点的输入，以及数据沿什么方向传递。']};
const slides=[
{nav:0,kicker:'01 / TOKEN & REPRESENTATION',title:'Token 进入模型后，变成了什么？',sub:'从文本输入到 token 输出，先了解各个计算阶段在模型中的位置。',h:'模型处理的是向量序列',p:['分词器先把文本转换成 <strong>token ID</strong>。Embedding 再根据这些编号查出向量，将离散符号变成模型可以计算的数值表示。位置关系也需要被编码；具体模型可能使用位置嵌入或在 Attention 中引入 RoPE。','把一段文本的向量按位置排列，就得到蓝色矩阵 <strong>X：T × H</strong>。T 表示 token 数，H 表示每个 token 的隐藏维度。这里省略 batch 维；后续图中的蓝色网格也用于标识激活，具体形状随计算阶段而变化。','本教程以<strong>用于文本生成的 decoder-only、Pre-Norm Transformer</strong>为主线。各层逐步更新 token 的特征向量，输出端再将最终向量转换为词表分数，用于选择下一个 token。'],f:'文本 → token ID → X ∈ ℝᵀˣᴴ',g:'token',s:'attn',caption:'分词及矩阵均为教学示意，具体形状以模型配置为准。'},
{nav:0,kicker:'02 / VISUAL VOCABULARY',title:'区分数据、参数和计算节点',sub:'同样是矩阵，角色不同；先读懂图元，再跟随箭头。',h:'激活承载输入信息，权重决定计算方式',p:['<strong>蓝色网格是激活，金色网格是权重。</strong>激活是这次输入在网络中的中间表示；权重是模型学到的计算参数。激活随输入和计算阶段变化，权重则通过训练逐步调整。','深色矩形表示计算，例如归一化、Attention 和 FFN。圆圈里的 <strong>＋</strong> 表示逐元素相加；实线箭头表示前向数据依赖，旁路也是一条真实的数据路径。','<strong>紫色网格是参数梯度，紫色虚线表示反向关系。</strong>训练时，反向传播根据损失求出梯度，优化器再利用梯度更新权重。'],f:'线性投影示例：激活 × 权重 → 新的激活\nLoss 反向求导 → 参数梯度',g:'matrix',s:'',caption:'网格用于标识张量及其角色；格数与亮度均为教学示意。'},
{nav:1,kicker:'03 / ATTENTION',title:'Attention：让 token 读取上下文',sub:'同一层中，信息如何从一个 token 传到另一个 token？',h:'根据内容相关性，聚合可见位置的信息',p:['在自注意力中，归一化后的表示通过可训练投影生成 <strong>Q、K、V</strong>。Q 与 K 的匹配分数经过缩放、掩码和 Softmax，得到每个位置对可见位置的注意力系数，再据此加权汇总 V。','对于因果语言模型，每个位置的可见范围限定为<strong>自己和之前的位置</strong>，从而符合根据已有上下文预测下一个 token 的任务。左图可选择目标 token，查看它允许读取的范围；实际聚合时，各位置还会获得不同的注意力系数。','多头机制在多个投影空间中进行这种聚合，随后合并并做输出投影。因此分支输出 <strong>R_Attn 仍为 T × H</strong>，每行对应原来的一个位置，只是它的表示已经融入上下文。'],f:'A = softmax(mask(QKᵀ / √dₖ))\n单头输出 = AV',g:'attn',s:'attn',caption:'高亮标识因果掩码允许读取的位置；注意力系数及多头内部结构在此折叠。'},
{nav:1,kicker:'04 / FEED-FORWARD',title:'FFN：在每个 token 内变换特征',sub:'有了 Attention，为什么还要再接一个子层？',h:'上下文聚合之后，还需要非线性变换',p:['Attention 让不同位置交换信息；FFN 则对<strong>每个位置的特征向量</strong>进行非线性加工。两者交替使用，让来自上下文的信息能够被进一步转换成后续层可利用的表示。','典型 FFN 先将特征从 H 维扩展到 D 维，经过非线性函数，再投影回 H 维。各 token 使用同一组 FFN 参数，<strong>每一行独立完成特征变换</strong>。中间的非线性函数使网络能够表达比单次线性变换更复杂的特征关系。','这种分工构成了常见 Transformer 层的基本结构。现代模型会在此基础上采用门控 FFN（如 SwiGLU），或用 MoE 组织多个前馈专家；这里先讲普通稠密 FFN。'],f:'T × H → T × D → T × H\nFFN(u) = φ(uW₁ + b₁)W₂ + b₂',g:'ffn',s:'attn',caption:'D 通常大于 H；网格宽度只表达升维／降维关系。'},
{nav:2,kicker:'05 / NORM & RESIDUAL',title:'残差连接如何保留输入并叠加更新？',sub:'Norm 调整数值尺度，残差保留直通路径；两者承担不同任务。',h:'在已有特征向量上叠加分支输出',p:['普通残差写作 <strong>Y = X + F(Norm(X))</strong>。分支负责计算一次更新，旁路将本子层输入 X 原样送到加法节点；两侧逐元素相加，形成下一阶段的表示。更新量中的各元素可以为正或负，因此相加后，原向量中的对应数值可以增大或减小。','分支可以集中学习在当前特征向量上需要做出的调整。当分支输出接近零时，子层输出便接近输入，这称为恒等映射。旁路还为反向梯度提供直通路径，有助于深层网络优化；<strong>实际训练稳定性同时取决于归一化、初始化和学习率等因素</strong>。','Pre-Norm 指归一化位于分支计算之前。Norm 沿每个 token 的特征维调整数值尺度，为后续计算提供较稳定的输入条件；旁路则将原始输入直接送到加法节点。'],f:'R = F(Norm(X))\nY = X + R',g:'residual',s:'norm',caption:'此处 F 可替换为 Attention 或 FFN；只画一个子层。'},
{nav:2,kicker:'06 / TWO SUBLAYERS',title:'把两个子层接起来，得到一个 Layer',sub:'每个子层以残差相加后的结果作为输出，继续传给下一阶段。',h:'X、Y、Z 分别对应层输入、子层间数据和层输出',p:['输入 X 先经过 Attention 分支，得到 <strong>R_Attn</strong>，再与 X 相加得到 Y。Y 是第一个子层的完整输出，同时包含原输入 X 和分支计算得到的更新 R_Attn。','第二个子层以 <strong>Y 为输入</strong>，经过自己的 Norm 和 FFN 得到 R_FFN，再与 Y 相加得到 Z。因此，第二条旁路以 Y 为起点，保留的是第一个子层处理后的结果。','<strong>Z 是当前 Layer 的输出，也是下一层的输入。</strong>这一层有两个 Norm、两个计算分支和两次残差合并。图中突出子层之间及层与层之间的数据边界，内部计算产生的其他张量暂时折叠。'],f:'Y = X + Attn(Norm₁(X))\nZ = Y + FFN(Norm₂(Y))',g:'y',s:'norm',caption:'普通 Pre-Norm 主干；内部激活与参数暂时折叠。'},
{nav:3,kicker:'07 / NEXT-TOKEN PREDICTION',title:'矩阵如何变成下一个 token？',sub:'层输出仍是隐藏表示，文字选择发生在模型的输出端。',h:'从隐藏维度映射到整个词表',p:['输入依次经过多层 Transformer 后，每个位置获得最终隐藏表示。经模型配置中的末端 Norm，再由 <strong>LM Head</strong> 将 H 维表示投影成 V 个 logits；V 是词表大小，每个数对应一个候选 token。','生成下一 token 时，通常取<strong>当前最后一个位置</strong>的 logits。Softmax 可得到概率分布，再根据贪心选择或采样等解码策略选择一个 token，将它接回序列，继续下一轮。左图概率是教学示例。','初次处理提示词称为 prefill；后续 decode 通常借助 <strong>KV cache</strong> 复用历史 K、V，只计算新增位置所需的部分。训练时则可在因果掩码下并行计算多个位置的下一个 token 预测。'],f:'最后位置 h ∈ ℝᴴ → logits ∈ ℝⱽ\n选择 token → 接回上下文 → 再预测',g:'head',s:'attn',caption:'示例概率人为设定；未表示任何真实模型预测。'},
{nav:3,kicker:'08 / BACKPROPAGATION',title:'训练时，梯度沿什么方向返回？',sub:'前向计算预测，反向计算敏感度，优化器再更新参数。',h:'反向传播计算梯度，优化器据此更新权重',p:['训练时，将预测与真实的下一个 token 比较得到损失 <strong>L</strong>。反向传播按计算依赖的反方向应用链式法则，从后续计算回到 FFN，再回到 Attention 和更早的层。','图中的 <strong>∂L/∂W</strong> 是参数梯度。与此同时，反向过程还要计算激活梯度，才能继续传到上一节点；总览图将激活梯度的细节折叠，使用紫色虚线突出反向传播的方向及参数梯度的来源。','在残差加法处，输出梯度同时传给分支与旁路，之后在共同输入处汇合。<strong>优化器在得到梯度后才更新权重</strong>；普通文本生成使用已训练好的权重，通过前向计算逐个预测 token。'],f:'前向：X → Y → Z → Loss\n反向：Loss → Z → Y → X\n参数更新：由优化器使用 ∂L/∂W 完成',g:'grad',s:'res',caption:'紫色箭头向上回传、横向指向参数梯度；路径已简写。'},
{nav:4,kicker:'09 / MULTI-STREAM RESIDUAL',title:'mHC 如何将残差流扩展为四路？',sub:'每个 token 保留四组特征向量，通过读取、混合与写回连接到同一个计算分支。',h:'四路残差流共用一个计算分支',p:['普通残差流为每个 token 保留一个 H 维特征向量；<strong>n = 4 的 mHC 为每个 token 保留四个 H 维特征向量</strong>。H_pre 对这四路数据加权读取，得到一个 H 维向量，再送入包含 Norm 的 Attention 或 FFN 分支。','在旁路上，H_res 对四路输入进行加权混合。分支完成计算后，H_post 将其输出按系数分配到四路，再与各路混合后的旁路结果相加，得到四路输出，继续传给下一子层。','<strong>四路扩展的是每个 token 在子层之间传递的特征状态</strong>，让模型能够保留和组合多组特征。Attention 与 FFN 两个子层都可以采用这种连接方式；相应地，需要存储更多残差数据，并承担额外的映射计算、访存，以及涉及残差状态传递时的通信开销。'],f:'U = H_pre · X\nX′ = H_res · X + H_postᵀ · F(U)',g:'stream',s:'mhc',caption:'此处只展开一个子层；X 的形状为 T × 4 × H。'},
{nav:4,kicker:'10 / MANIFOLD CONSTRAINT',title:'为什么 mHC 还要约束四路混合？',sub:'多路连接增加灵活性，也会引入信号被反复放大的风险。',h:'让残差混合保持受控',p:['如果每个子层的混合系数都能任意放大输入，这种放大会在连续传递中累积，使残差路径上的信号幅度难以控制。mHC 将 <strong>H_res 约束为双随机矩阵</strong>：元素非负，每行与每列的和都是 1。','这使每路输出成为输入各路的加权组合，并让多层残差混合的组合仍具有这一性质。论文采用 Sinkhorn-Knopp 迭代近似实现约束。这里的滑块演示一组满足约束的矩阵，便于观察从原样传递到均匀混合的变化。','这一约束允许四路数据相互混合，同时限制残差混合路径对信号幅度的放大。<strong>分支写回会继续更新特征向量</strong>，流之间的差异也可能因混合而缩小；完整模型的训练稳定性还取决于计算分支及其他训练设置。'],f:'H_res ≥ 0\n每行之和 = 1；每列之和 = 1',g:'mix',s:'mhc',caption:'交互示例：M = (1 − α)I + αJ/4；J 的所有元素均为 1。'},
{nav:5,kicker:'11 / COMPLETE LAYER MAP',title:'回到完整图：一个 Layer 内，矩阵在哪里？',sub:'现在把激活、权重、梯度和两条残差路径放回同一张图。',h:'先沿蓝线读，再沿紫线回看',p:['沿蓝线从上往下：<strong>X → Norm₁ → Attention → R_Attn → ＋ → Y → Norm₂ → FFN → R_FFN → ＋ → Z</strong>。每个加法节点还接收自己的旁路输入，分别是 X 和 Y。','金色表示参与分支计算的参数集合；紫色表示训练反向得到的参数梯度。这张结构图重点呈现数据流、参数及梯度之间的关系；Norm 参数、分支内部激活和激活梯度的细节暂时折叠。','这张图展示普通 Pre-Norm 层的单路残差结构；可从底部导航返回“四路 mHC”，对照残差连接的变化。'],f:'最需要区分的边界\n分支结果 R_Attn ≠ 子层输出 Y\n分支结果 R_FFN ≠ 层输出 Z',g:'z',s:'',caption:'保留参考原图。点击“放大原图”可阅读全文与细节。'}
];
slides.forEach((s,i)=>s.diagramId=i);
const ordered=[0,1,2,3,4,8,9,5,6,7,10].map(i=>slides[i]);
slides.splice(0,slides.length,{diagramId:-1,title:'Transformer 层内图解'},...ordered);
slides.at(-1).sub='沿用参考图的结构，用可点击的图元串起完整计算过程。';
slides.at(-1).p[2]='这张图展示<strong>普通 Pre-Norm 层的单路残差结构</strong>。采用 mHC 时，Attention 与 FFN 各自的残差连接会扩展为四路读取、混合和写回结构；可从底部导航返回“四路 mHC”，对照连接方式的变化。';
slides.at(-1).caption='默认适应画布，使用下方按钮缩放，放大后拖动查看，点击图元查看定义。普通 Pre-Norm 示意，省略内部激活、Norm 参数及完整激活梯度。';
let current=0,tokenIndex=2,mixAlpha=.4;
Object.assign(glossary,{
 norm1:['Norm 1 · Attention 前的归一化','对层输入 X 的每个 token 调整特征尺度，结果送入 Attention。左侧残差路径仍传递原输入 X。Norm 1 与 Norm 2 是两个独立节点，通常有各自的参数。'],
 norm2:['Norm 2 · FFN 前的归一化','输入是第一次残差相加之后的 Y，归一化结果送入 FFN。第二条残差路径传递未经过这个 Norm 2 的 Y。'],
 wattn:['W_Attn · Attention 参数集合','通常包括生成 Q、K、V 的投影权重，以及合并多头后的输出投影权重。这里用一个金色网格概括多张矩阵，实际参数量由各张矩阵的形状决定。'],

document.querySelector('.progress').innerHTML=slides.map((s,i)=>`<button data-step="${i}" aria-label="${i===0?'封面':'第 '+i+' 页：'+s.title}" title="${s.title}">${labels[i]}</button>`).join('');
document.getElementById('cover-visual').innerHTML=diagram(5).replace(/class="hit" data-node="[^"]+" role="button" tabindex="0"/g,'class="cover-node"');
document.addEventListener('click',e=>{if(suppressDiagramClick&&e.target.closest('#diagram'))return;const n=e.target.closest('#diagram [data-node]');if(n)selectNode(n.dataset.node);const p=e.target.closest('[data-step]');if(p)go(+p.dataset.step);const t=e.target.closest('[data-token]');if(t){tokenIndex=+t.dataset.token;render();document.querySelector(`[data-token="${tokenIndex}"]`).focus()}if(e.target.closest('#zoom-in'))setZoom(zoomState.scale*1.3);if(e.target.closest('#zoom-out'))setZoom(zoomState.scale/1.3);if(e.target.closest('#zoom-fit'))setZoom(1);if(e.target.closest('#prev'))go(current-1);if(e.target.closest('#next'))go(current===slides.length-1?0:current+1);if(e.target.closest('#info-toggle'))setInfo(document.getElementById('info-panel').hidden);else if(!e.target.closest('.info-wrap'))setInfo(false)});
document.addEventListener('input',e=>{if(e.target.id==='mix'){mixAlpha=+e.target.value;document.getElementById('diagram').innerHTML=diagram(9);document.getElementById('mix-value').textContent=mixAlpha.toFixed(2)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('info-panel').hidden){setInfo(false);document.getElementById('info-toggle').focus();return}if(e.target.matches('input'))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if((e.key==='Enter'||e.key===' ')&&e.target.closest('#diagram [data-node]')){e.preventDefault();selectNode(e.target.closest('[data-node]').dataset.node)}});
let touchX=null;document.getElementById('diagram').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.getElementById('diagram').addEventListener('touchend',e=>{if(touchX===null||slides[current].diagramId===10)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>80)go(current+(dx<0?1:-1));touchX=null},{passive:true});
let zoomState={scale:1,x:0,y:0},dragState=null,suppressDiagramClick=false;
function applyZoom(){const svg=document.querySelector('#diagram svg');if(slides[current].diagramId!==10||!svg)return;const w=1000/zoomState.scale,h=1200/zoomState.scale;zoomState.x=Math.max(0,Math.min(1000-w,zoomState.x));zoomState.y=Math.max(0,Math.min(1200-h,zoomState.y));svg.setAttribute('viewBox',`${zoomState.x} ${zoomState.y} ${w} ${h}`);document.getElementById('zoom-level').textContent=Math.round(zoomState.scale*100)+'%';document.getElementById('zoom-out').disabled=zoomState.scale<=1;document.getElementById('zoom-in').disabled=zoomState.scale>=5;document.getElementById('diagram').classList.toggle('zoomed',zoomState.scale>1)}
function setZoom(scale){const old=zoomState.scale;scale=Math.max(1,Math.min(5,scale));zoomState.x+=500/old-500/scale;zoomState.y+=600/old-600/scale;zoomState.scale=scale;applyZoom()}
const canvas=document.getElementById('diagram');
canvas.addEventListener('pointerdown',e=>{if(slides[current].diagramId!==10||zoomState.scale<=1||e.button!==0)return;dragState={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:zoomState.x,y:zoomState.y,moved:false};suppressDiagramClick=false});
canvas.addEventListener('pointermove',e=>{if(!dragState||e.pointerId!==dragState.id)return;const dx=e.clientX-dragState.sx,dy=e.clientY-dragState.sy;if(!dragState.moved&&Math.hypot(dx,dy)<4)return;dragState.moved=true;suppressDiagramClick=true;if(!canvas.hasPointerCapture(e.pointerId))canvas.setPointerCapture(e.pointerId);const rect=canvas.querySelector('svg').getBoundingClientRect(),unit=Math.min(rect.width/(1000/zoomState.scale),rect.height/(1200/zoomState.scale));zoomState.x=dragState.x-dx/unit;zoomState.y=dragState.y-dy/unit;applyZoom();canvas.classList.add('dragging')});
function endDrag(e){if(!dragState||e.pointerId!==dragState.id)return;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);dragState=null;canvas.classList.remove('dragging');setTimeout(()=>suppressDiagramClick=false,0)}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);

const initial=Number(location.hash.replace('#step-',''));if(initial>=1&&initial<slides.length)current=initial;render();

</script></body></html>
