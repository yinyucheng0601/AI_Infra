<style>
:root{color-scheme:dark;--bg:#111;--panel:#131313;--line:#353535;--fg:#e8e8e8;--muted:#ababab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #BCA0F3;outline-offset:4px}[hidden]{display:none!important}.shell{max-width:1560px;margin:auto;padding:0 42px}.top{display:flex;align-items:center;justify-content:space-between;padding:23px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1.5px;color:var(--muted)}.top a{text-decoration:none;letter-spacing:0}.intro{padding:42px 0 30px}.intro h1{font-size:42px;font-weight:450;line-height:1.2;margin:0 0 18px;letter-spacing:-1px}.intro p{max-width:850px;color:var(--muted);margin:0}.stats{font:13px ui-monospace,monospace;color:var(--muted);margin-top:20px}.toolbar{position:sticky;top:0;background:#111f;z-index:2;padding:18px 0 12px;border-bottom:1px solid var(--line)}.search-row{display:flex;gap:14px;align-items:center;margin-bottom:15px}.search-row input{flex:1;min-width:0;background:#191919;border:1px solid #454545;padding:11px 14px;border-radius:4px}.search-row select{background:#191919;border:1px solid #454545;padding:11px 12px;max-width:350px;border-radius:4px}.categories{display:flex;gap:24px;overflow:auto}.categories button{white-space:nowrap;padding:7px 0 10px;color:var(--muted);border-bottom:2px solid transparent}.categories button[aria-pressed=true]{color:#fff;border-color:#e8e8e8}.results{display:flex;justify-content:space-between;align-items:center;padding:19px 0;color:var(--muted);font-size:12px}.results button{text-decoration:underline;text-underline-offset:4px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.card{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:25px;background:#131313;display:flex;flex-direction:column}.card:hover{background:#181818}.card-top{display:flex;gap:12px;align-items:baseline}.number{font:12px ui-monospace,monospace;color:#888}.card h2{font-size:17px;font-weight:500;margin:0}.preview{width:100%;padding:0;margin:10px 0 8px;display:block;position:relative}.preview img{width:100%;height:185px;object-fit:contain;display:block}.preview span{position:absolute;right:0;bottom:0;font-size:11px;color:#aaa;opacity:0}.preview:hover span,.preview:focus-visible span{opacity:1}.card-bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:#888}.card-bottom button{color:#bbb;padding:0}.empty{padding:90px 0;text-align:center;color:var(--muted)}details.scope{margin:30px 0 50px;color:#aaa;font-size:13px;border-top:1px solid var(--line);padding-top:20px}.scope summary{cursor:pointer}.scope ul{padding-left:20px}.scope p{max-width:1000px}dialog{color:var(--fg);background:#171717;border:1px solid #555;border-radius:6px;width:min(1050px,92vw);max-height:90svh;padding:0}dialog::backdrop{background:#000b}.dialog-top{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--line)}.dialog-top h2{font-size:20px;font-weight:500;margin:0}.close{font-size:24px;padding:0 5px}.dialog-body{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;padding:26px}.dialog-art{background:#131313;display:flex;align-items:center;min-height:300px}.dialog-art img{width:100%;height:340px;object-fit:contain}.detail-copy{font-size:14px;color:#ccc}.detail-copy p{margin:0 0 20px}.detail-copy h3{font-size:12px;font-weight:400;color:#888;margin:24px 0 10px}.detail-copy a{display:block;font-size:13px;margin:9px 0}.note{font-size:12px;color:#aaa;border-left:2px solid #555;padding-left:12px}.dialog-bottom{padding:15px 26px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#aaa}.dialog-bottom button,.download{border:1px solid #555;border-radius:4px;padding:7px 12px;text-decoration:none}.dialog-bottom button:disabled{opacity:.3;cursor:default}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}@media(min-width:1500px){.preview img{height:205px}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:0 24px}.dialog-body{grid-template-columns:1fr}.dialog-art{min-height:200px}.dialog-art img{height:230px}}@media(max-width:600px){.shell{padding:0 16px}.intro{padding-top:28px}.intro h1{font-size:34px}.search-row{flex-wrap:wrap}.search-row input,.search-row select{width:100%;max-width:none}.categories{gap:18px}.grid{grid-template-columns:1fr}.card{padding:22px}.dialog-bottom{flex-wrap:wrap}.dialog-body{padding:20px}.top{font-size:10px}}
.layers{display:flex;gap:24px;border-bottom:1px solid #555}.layers button{padding:12px 0;color:#999;border-bottom:2px solid transparent}.layers button[aria-pressed=true]{color:white;border-color:white}.variant-controls{display:flex;gap:12px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid #353535}.variant-controls label{font-size:12px;color:#aaa;display:flex;gap:7px;align-items:center}.variant-controls select{background:#252525;border:1px solid #555;padding:5px}.dialog-body.pattern{grid-template-columns:1fr}.dialog-body.pattern .dialog-art img{height:auto;max-height:420px}.dialog-body.pattern .detail-copy{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-body.pattern .detail-copy h3{margin:0}.variant-controls:empty{display:none}#legacyLinks{font-size:12px;margin-top:20px}#legacyLinks button{color:#bbb;text-decoration:underline;padding:4px 10px 4px 0}@media(max-width:600px){.dialog-body.pattern .detail-copy{display:block}}
.intro{padding:24px 0 18px}.intro h1{font-size:28px;margin:0}.pattern-card{grid-column:1/-1}.pattern-card .preview img{height:300px}.card:not(.pattern-card):not(.data-card) .preview img{height:240px}.data-card{grid-column:1/-1}.data-card .preview img{height:auto;max-height:560px}.dialog-body.data-detail{grid-template-columns:1fr}.dialog-body.data-detail .dialog-art img{height:auto;max-height:none}.card-bottom>span{display:none}#detailDesc{white-space:pre-line}.card .preview{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}.card .preview img,.card:not(.pattern-card):not(.data-card) .preview img,.pattern-card .preview img{width:100%;height:100%;max-height:none;object-fit:contain}.pattern-card .preview{max-height:420px}
</style></head><body><main class="shell"><header class="top"><span>AI INFRA / VISUAL VOCABULARY</span><a href="../../../index.html">返回 Library ↗</a></header><section class="intro"><h1>图例库</h1></section>
<nav class="layers" id="layers" aria-label="图例与组合模式"></nav>
<section class="toolbar" aria-label="图例筛选"><div class="search-row"><label for="search" class="sr">搜索图例</label><input id="search" type="search" placeholder="搜索图元、语义、报告名称…" autocomplete="off"><label for="source" class="sr">按来源报告筛选</label><select id="source"><option value="all">全部来源报告</option></select></div></section>
<section id="grid" class="grid" aria-label="图例宫格"></section><div class="empty" id="empty" hidden>没有匹配的图例。请调整关键词或来源筛选。</div>
</main>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-top"><h2 id="detailTitle"></h2><button class="close" id="close" aria-label="关闭详情">×</button></div><div id="variantControls" class="variant-controls"></div><div class="dialog-body"><div class="dialog-art"><img id="detailImg" alt=""></div><div class="detail-copy"><p id="detailDesc"></p><p id="detailNote" class="note"></p><h3>来源报告</h3><div id="detailSources"></div></div></div><div class="dialog-bottom"><div><button id="previous">← 上一个</button> <button id="next">下一个 →</button></div><span>← → 切换 · Esc 关闭</span><a class="download" id="download" download>下载 SVG</a></div></dialog>
<script>/* VISUAL_SYSTEM */</script><script id="legendData" type="application/json">/* LEGEND_DATA */</script><script>
'use strict';
const DATA=JSON.parse(document.getElementById('legendData').textContent),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let layer='system';const categoriesByLayer={system:['全部','对象','关系'],pattern:['全部']};let category='全部',shown=[],selected=-1,currentOptions={},currentUrl=null;
const sourceMap=Object.fromEntries(DATA.sources.map(s=>[s.id,s]));
const images=Object.fromEntries(DATA.items.map(e=>[e.id,URL.createObjectURL(new Blob([e.svg],{type:'image/svg+xml'}))]));
for(const e of DATA.items)for(const [i,t] of (e.tiles||[]).entries())images[e.id+'-'+i]=URL.createObjectURL(new Blob([t.svg],{type:'image/svg+xml'}));
// Card previews share a 320 × 180 minimum coordinate frame. Dense content
// expands that frame at the same aspect ratio and is fitted as a whole.
function previewImage(svg){
 const m=svg.match(/viewBox="([^"]+)"/);if(!m)return URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
 const [x,y,w,h]=m[1].trim().split(/\s+/).map(Number),W=Math.max(320,w,h*320/180),H=W*180/320;
 const framed=svg.replace(m[0],`viewBox="${x-(W-w)/2} ${y-(H-h)/2} ${W} ${H}"`);
 return URL.createObjectURL(new Blob([framed],{type:'image/svg+xml'}));
}
const previews=Object.fromEntries(DATA.items.map(e=>[e.id,previewImage(e.svg)]));
for(const e of DATA.items)for(const [i,t] of (e.tiles||[]).entries())previews[e.id+'-'+i]=previewImage(t.svg);
function href(id,anchor=''){const s=sourceMap[id];return s.url?s.url+(anchor?'#'+encodeURIComponent(anchor):''):'../'+s.file.replace('reports/llm-compute/','')+(anchor?'#'+encodeURIComponent(anchor):'')}
function matches(e){const q=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),source=$('source').value;return e.layer===layer&&(category==='全部'||e.cat===category)&&(source==='all'||e.refs.some(r=>r.id===source))&&q.every(w=>[e.title,e.desc,e.note,e.cat,...e.refs.map(r=>sourceMap[r.id].title)].join(' ').toLowerCase().includes(w))}
function dataTileCards(e){return e.tiles.map((t,i)=>`<article class="card" id="${t.id}"><div class="card-top"><span class="number">01.${i+1}</span><h2>${esc(t.title)}</h2></div><button class="preview" data-open="${e.id}" data-tile="${i}" aria-label="查看${esc(t.title)}详情"><img src="${previews[e.id+'-'+i]}" alt="${esc(t.title)}" loading="lazy"><span>放大 ↗</span></button><div class="card-bottom"><button data-open="${e.id}" data-tile="${i}">详情 ↗</button></div></article>`).join('')}
function render(){$('layers').innerHTML=[['system','图例'],['pattern','Pattern · 组合模式']].map(([id,label])=>`<button data-layer="${id}" aria-pressed="${layer===id}">${label}</button>`).join('');shown=DATA.items.filter(matches);$('empty').hidden=!!shown.length;$('grid').hidden=!shown.length;$('grid').innerHTML=shown.map(e=>e.tiles?dataTileCards(e):`<article class="card ${e.id==='system-value'?'data-card':e.layer==='pattern'?'pattern-card':''}" id="${e.id}"><div class="card-top"><span class="number">${String(DATA.items.filter(x=>x.layer===layer).indexOf(e)+1).padStart(2,'0')}</span><h2>${esc(e.title)}</h2></div><button class="preview" data-open="${e.id}" aria-label="查看${esc(e.title)}详情"><img src="${previews[e.id]}" alt="${esc(e.title)}" loading="lazy"><span>放大 ↗</span></button><div class="card-bottom"><span>${esc(e.cat)}</span><button data-open="${e.id}">${new Set(e.refs.map(r=>r.id)).size} 篇来源 ↗</button></div></article>`).join('')}
function show(id,tile){const target=DATA.items.find(e=>e.id===id);if(target&&target.layer!==layer){layer=target.layer;category='全部';$('search').value='';$('source').value='all';render()}selected=shown.findIndex(e=>e.id===id);if(selected<0)return;const e=shown[selected];$('detailTitle').textContent=e.title;configure(e);$('detailDesc').textContent=e.variants?.length>1?e.variants.map(v=>v.title+'：'+v.desc).join('\n\n'):e.desc;$('detailNote').textContent=e.note;$('detailNote').hidden=!e.note;$('detailImg').src=images[e.id];$('detailImg').alt=e.title;$('detailSources').innerHTML=e.refs.map(r=>`<a href="${href(r.id,r.anchor)}" target="_blank" rel="noopener">${esc(sourceMap[r.id].title)} ↗</a>`).join('');$('download').href=images[e.id];$('download').download=e.id+'.svg';$('previous').disabled=selected===0;$('next').disabled=selected===shown.length-1;if(tile!==undefined&&e.tiles?.[tile]){const t=e.tiles[tile];$('detailTitle').textContent=t.title;$('detailImg').src=images[e.id+'-'+tile];$('detailImg').alt=t.title;$('download').href=images[e.id+'-'+tile];$('download').download=t.id+'.svg';}if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','#'+e.id)}
function step(d){const e=shown[selected+d];if(e)show(e.id)}
$('source').innerHTML+=DATA.sources.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');
$('layers').addEventListener('click',e=>{const b=e.target.closest('[data-layer]');if(b){layer=b.dataset.layer;category='全部';render()}});
$('search').addEventListener('input',render);$('source').addEventListener('change',render);$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)show(b.dataset.open,b.dataset.tile)});$('close').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>history.replaceState(null,'',location.pathname+location.search));$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.defaultPrevented||['INPUT','SELECT','TEXTAREA'].includes(e.target?.tagName)||e.target?.isContentEditable)return;if(!$('detail').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();step(e.key==='ArrowRight'?1:-1)}});
const selectControl=(key,label,options)=>`<label>${label}<select data-option="${key}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`;
function configure(e){
 currentOptions={};const system=true,pattern=e.layer==='pattern',value=e.id==='system-value';
 // The layout class is optional in the lightweight DOM validator.
 $('detailImg').parentElement?.parentElement?.classList.toggle('pattern',pattern);
 $('detailImg').parentElement?.parentElement?.classList.toggle('data-detail',['system-value','system-op'].includes(e.id));
 let controls='';
 if(system){if(['pattern-compute','pattern-distribution','pattern-storage'].includes(e.id))controls+=selectControl('expanded','表示',[['false','折叠'],['true','展开']]);
 if(e.id==='pattern-distribution')controls+=selectControl('mode','分布语义',[['shard','分片'],['replica','复制'],['partial','部分结果']]);
}
 $('variantControls').innerHTML=controls;
}
function updatePreview(e){if(!['pattern-compute','pattern-distribution','pattern-storage'].includes(e.id))return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(new Blob([VisualSystem.render(e.id,currentOptions)],{type:'image/svg+xml'}));$('detailImg').src=currentUrl;$('download').href=currentUrl;$('download').download=e.id+'-current.svg'}
$('variantControls').addEventListener('change',ev=>{const key=ev.target.dataset.option;if(!key)return;currentOptions[key]=key==='expanded'?ev.target.value==='true':ev.target.value;updatePreview(shown[selected])});
render();const initial=decodeURIComponent(location.hash.slice(1));if(initial)show(initial);
</script></body></html>
