const main=document.querySelector('main');variants.forEach(v=>{let c=document.createElement('section');c.className='card';c.dataset.variant=v.id;c.innerHTML=`<div class="info"><div><h2>${v.id} / ${v.name}</h2><p>${v.desc}</p></div><button title="选择 ${v.id} ${v.name}" aria-pressed="false">选 ${v.id}</button></div><div class="scene"><div class="back"><div class="grid"></div><div class="stripe"></div><span>UB 74304 →</span></div><div class="glass" aria-label="可拖动的${v.name}"><div class="shine"></div><b>−</b><b>ZOOM</b><b>＋</b><b>⛶</b><b>↶</b></div></div>`;main.append(c);c.querySelector('button').onclick=e=>{document.querySelectorAll('.info button').forEach(b=>b.setAttribute('aria-pressed','false'));document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));e.target.setAttribute('aria-pressed','true');c.classList.add('selected');location.hash=v.id};const g=c.querySelector('.glass');addTuning(c,g,v);if(v.id==='B')addBScene(c,g,v);new ResizeObserver(()=>render(g,v)).observe(g);let start;g.onpointerdown=e=>{start=[e.clientX,e.clientY,g.offsetLeft,g.offsetTop];g.setPointerCapture(e.pointerId)};g.onpointermove=e=>{if(!start)return;g.style.left=Math.max(-g.offsetWidth/2,Math.min(g.parentElement.clientWidth-g.offsetWidth/2,start[2]+e.clientX-start[0]))+'px';g.style.top=Math.max(0,Math.min(226,start[3]+e.clientY-start[1]))+'px'};g.onpointerup=g.onpointercancel=()=>start=null});
function addBScene(card,glass,v){
 const modes=document.createElement('div');modes.className='b-modes';
 for(const [key,name] of [['reference','参考比例 · 绿色'],['toolbar','工具栏 · 原背景']]){
  const button=document.createElement('button');button.textContent=name;button.title='B '+name;button.setAttribute('aria-pressed',String(key==='toolbar'));
  button.onclick=()=>{card.classList.toggle('reference',key==='reference');glass.style.left='';glass.style.top='';modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render(glass,v)};modes.append(button);
 }

 const scene=card.querySelector('.scene'),comparison=document.createElement('div');comparison.className='comparison';
 const ref=document.createElement('figure');ref.innerHTML='<img src="apple-reference.png" alt="用户提供的 Apple 绿色玻璃参考"><figcaption>Apple · 你的参考</figcaption>';

}
function addTuning(card,glass,v){

 const specs=[['strength','折射强度',0,100,1,''],['depth','玻璃厚度',0,48,1,'px'],['bezel','折射覆盖宽度',2,36,1,'px'],['shine','高光强度',0,1.5,.05,''],['power','高光聚焦',5,100,1,''],['blur','磨砂程度',0,3,.1,'px'],['rim','侧壁取色',0,100,1,''],['rimWidth','侧壁宽度',1,6,.25,'px'],['ior','折射率',1,1.8,.01,'']];

  const order=['strength','bezel','shine','power','depth','blur','rim','rimWidth','ior'];
  specs.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  specs.find(spec=>spec[0]==='power')[2]=0;
 }
 const panel=document.createElement('div');panel.className='tuning';
 const advanced=document.createElement('details');advanced.style.gridColumn='1 / -1';const summary=document.createElement('summary');summary.textContent='高级 · 物理折射率';summary.title='展开物理折射率调节，默认 1.50';advanced.append(summary);

 panel.append(advanced);
 let pending=false;function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render(glass,v)})}
 const compare=document.createElement('button');compare.textContent='查看原始背景';compare.title='隐藏玻璃材质，与原始背景对比';compare.setAttribute('aria-pressed','false');compare.style.gridColumn='1';compare.onclick=()=>{const on=glass.classList.toggle('original');compare.setAttribute('aria-pressed',String(on));compare.textContent=on?'返回玻璃效果':'查看原始背景'};
 const reset=document.createElement('button');reset.textContent='恢复本版默认';reset.title='恢复 '+v.id+' 的全部材质参数';reset.onclick=()=>{Object.assign(v,defaults);syncs.forEach(sync=>sync());schedule()};panel.append(compare,reset);card.append(panel);
}
// Screen-space sidewall approximation: compress an inward background band into
// a narrow contour. It samples the live backdrop; no fixed semantic tint.
function sidewallMaps(w,h,r,v){
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d'),map=ctx.createImageData(w,h),mask=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const i=(y*w+x)*4,d=-sdf(x+.5,y+.5,w,h,r),e=.25;
  let gx=sdf(x+.5+e,y+.5,w,h,r)-sdf(x+.5-e,y+.5,w,h,r),gy=sdf(x+.5,y+.5+e,w,h,r)-sdf(x+.5,y+.5-e,w,h,r);
  const len=Math.hypot(gx,gy)||1;gx/=len;gy/=len;
  const t=Math.max(0,Math.min(1,d/v.rimWidth));
  // Across 3px of sidewall, sample a broad strip toward the flat interior.
  const reach=Math.min(h*.48,v.depth*.5+16)*(1-.2*t);
  map.data.set([Math.round(127.5-gx*reach/128*255),Math.round(127.5-gy*reach/128*255),128,255],i);
  const aa=Math.max(0,Math.min(1,d+.5))*Math.max(0,Math.min(1,v.rimWidth-d+.5));
  const alpha=aa*(v.rim/100)*(.75+.25*Math.sin(t*Math.PI));

}
function sdf(x,y,w,h,r){let qx=Math.abs(x-w/2)-(w/2-r),qy=Math.abs(y-h/2)-(h/2-r);return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r}
function render(el,v){if(v.id==='B'){renderB(el,v);return;}let w=Math.round(el.clientWidth),h=74,r=37,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d'),map=ctx.createImageData(w,h),hi=ctx.createImageData(w,h),scale=Math.max(128,v.depth*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4,d=-sdf(x+.5,y+.5,w,h,r),dx=0,dy=0,light=0;if(d>=0&&d<v.bezel){let t=d/v.bezel,e=.1,gx=(sdf(x+e,y,w,h,r)-sdf(x-e,y,w,h,r))/(2*e),gy=(sdf(x,y+e,w,h,r)-sdf(x,y-e,w,h,r))/(2*e),len=Math.hypot(gx,gy)||1;gx/=len;gy/=len;let slope=v.smooth?6*t*(1-t):(Math.pow(1-t,3)/Math.pow(Math.max(.0001,1-Math.pow(1-t,4)),.75)),nz=1/Math.sqrt(1+slope*slope),nx=gx*slope*nz,ny=gy*slope*nz,eta=1/v.ior,f=eta*nz-Math.sqrt(1-eta*eta*(1-nz*nz)),tz=-eta+f*nz;let height=v.depth*(.25+.75*Math.pow(1-Math.pow(1-t,4),.25));let shift=height/Math.max(.1,-tz),fr=.04+.96*(1-nz)**5,fade=v.fresnel?1-fr:1;dx=f*nx*shift*fade;dy=f*ny*shift*fade;let nd=Math.max(0,nx*(-.34)+ny*(-.48)+nz*.81);light=Math.pow(nd,v.power)*v.shine*Math.min(1,slope*3);light+=fr*(v.fresnel?.46:.12);light*=Math.min(1,d*2)}map.data.set([Math.round(128+dx/scale*255),Math.round(128+dy/scale*255),128,255],i);hi.data.set([255,255,255,Math.round(Math.min(.95,light)*255)],i)}ctx.putImageData(map,0,0);let url=canvas.toDataURL();ctx.putImageData(hi,0,0);el.querySelector('.shine').style.backgroundImage=`url(${canvas.toDataURL()})`;const side=sidewallMaps(w,h,r,v);let id='glass-'+v.id,svg=document.getElementById(id+'-svg');if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id=id+'-svg';svg.style.cssText='position:absolute;width:0;height:0;pointer-events:none';document.body.append(svg)}svg.innerHTML=`<filter id="${id}" x="-30%" y="-100%" width="160%" height="300%" color-interpolation-filters="sRGB"><feImage href="${url}" x="0" y="0" width="${w}" height="${h}" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="${scale*v.strength/40}" xChannelSelector="R" yChann <feImage href="${side.map}" x="0" y="0" width="${w}" height="${h}" result="sideMap"/>

<feComposite in="sideRich" in2="sideMask" operator="in" result="rimColor"/>
<feComposite in="rimColor" in2="face" operator="over"/></filter>`;let filter=/Chrome/.test(navigator.userAgent)?`url(#${id})`:'blur(2px)';el.style.backdropFilter=filter;el.style.webkitBackdropFilter=filter}
document.querySelector('#theme').onclick=e=>{let dark=document.body.classList.toggle('night');e.target.textContent=dark?'切换浅色':'切换深色'};let moved=false;document.querySelector('#move').onclick=()=>{moved=!moved;document.querySelectorAll('.back').forEach(b=>b.style.transform=moved?'translateX(120px)':'none')};
